async function saveMeasurement(id, isNew){
  const type=state.measType;
  const obj={ id, stationId:state.stationId, type, timestamp: nowIso(), notes: document.getElementById('f_notes').value };

  if(type==='planar'){
    obj.subtype=document.getElementById('f_subtype').value;
    if(LINEAR_SUBTYPES.includes(obj.subtype)){
      obj.trend=intOrNull('trend_l1'); obj.plunge=intOrNull('plunge_l1');
    } else {
      obj.dipDir=intOrNull('dipDir_p1'); obj.dip=intOrNull('dip_p1');
      obj.strike = obj.dipDir!=null? roundInt(norm360(obj.dipDir-90)) : null;
    }
  } else if(type==='fault'){
    obj.dipDir=intOrNull('dipDir_fp'); obj.dip=intOrNull('dip_fp');
    obj.strike = obj.dipDir!=null? roundInt(norm360(obj.dipDir-90)) : null;
    obj.striaeMode=document.querySelector('input[name=striaeMode]:checked')?.value || 'rake';
    if(obj.striaeMode==='trendplunge'){
      obj.trend=intOrNull('trend_fl'); obj.plunge=intOrNull('plunge_fl');
    }
    obj.rake=intOrNull('f_rake');
    obj.rakeQuadrant=document.getElementById('f_rakeQuad')?.value || null;
    obj.sense=document.getElementById('f_sense').value;
    obj.senseQuality=document.getElementById('f_senseQuality').value;
    obj.criteria=[...document.querySelectorAll('.crit-chk:checked')].map(c=>c.value);
  } else if(type==='contact'){
    obj.contactType=document.getElementById('f_contactType').value;
    obj.dipDir=intOrNull('dipDir_c1'); obj.dip=intOrNull('dip_c1');
    obj.strike = obj.dipDir!=null? roundInt(norm360(obj.dipDir-90)) : null;
    obj.lithoTop=document.getElementById('f_lithoTop').value;
    obj.lithoBottom=document.getElementById('f_lithoBottom').value;
    obj.appThickness=intOrNull('f_appThickness');
    obj.bedDip=intOrNull('f_bedDip');
    obj.slope=intOrNull('f_slope');
    obj.slopeSense=document.getElementById('f_slopeSense').value;
    obj.trueThickness=calcThickness();
  } else if(type==='vein'){
    obj.structKind=document.querySelector('input[name=structKind]:checked')?.value || 'Veta';
    obj.dipDir=intOrNull('dipDir_v1'); obj.dip=intOrNull('dip_v1');
    obj.strike = obj.dipDir!=null? roundInt(norm360(obj.dipDir-90)) : null;
    obj.veinThickness=intOrNull('f_veinThick');
    obj.veinUnit=document.getElementById('f_veinUnit').value;
    obj.veinDensity=intOrNull('f_veinDensity');
    obj.mineralogy=[...document.querySelectorAll('.min-chk:checked')].map(c=>c.value);
    obj.mineralOther=document.getElementById('f_mineralOther').value;
    obj.texture=document.getElementById('f_texture').value;
    obj.alteration=[...document.querySelectorAll('.alt-chk:checked')].map(c=>c.value);
    obj.intensity=document.getElementById('f_intensity').value;
  }
  await dbPut('measurements', obj);

  Nav.station(state.stationId, state.campId);
}

function drawDial(svg, mode){
  const r=sensorState.last;
  let heading = 0;
  if(r){
    if(mode==='planar'){
      heading = (needleMode==='strike') ? r.strike : r.dipDir;
    } else {
      heading = r.trend;
    }
  }
  const mag = r ? (mode==='planar'? r.dip : r.plunge) : 0;
  let ticks='';
  for(let i=0;i<36;i++){
    const ang=i*10, len = (i%3===0)?12:6;
    const rad=toRad(ang);
    const x1=70+58*Math.sin(rad), y1=70-58*Math.cos(rad);
    const x2=70+(58-len)*Math.sin(rad), y2=70-(58-len)*Math.cos(rad);
    ticks+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--border)" stroke-width="${i%9===0?2:1}"/>`;
  }
  const needleRad=toRad(heading);
  const nx=70+46*Math.sin(needleRad), ny=70-46*Math.cos(needleRad);
  const barW = clamp(mag/90,0,1)*100;
  svg.innerHTML = `
    <circle cx="70" cy="70" r="62" fill="var(--surface-2)" stroke="var(--border)" stroke-width="1.5"/>
    ${ticks}
    <text x="70" y="16" text-anchor="middle" fill="var(--text-dim)" font-size="9">N</text>
    <text x="124" y="74" text-anchor="middle" fill="var(--text-dim)" font-size="9">E</text>
    <text x="70" y="130" text-anchor="middle" fill="var(--text-dim)" font-size="9">S</text>
    <text x="16" y="74" text-anchor="middle" fill="var(--text-dim)" font-size="9">${currentLang==='es'?'O':'W'}</text>
    <line x1="70" y1="70" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="70" cy="70" r="4" fill="var(--accent)"/>
    <rect x="20" y="118" width="100" height="6" rx="3" fill="var(--surface)" stroke="var(--border)" />
    <rect x="20" y="118" width="${barW}" height="6" rx="3" fill="var(--accent)" />
  `;
}

function captureSensorReading(formKey, mode){
  if(!sensorState.last){ toast(currentLang==='es'?'Sin datos de sensor':'No sensor data yet'); return; }
  const r=sensorState.last;
  if(mode==='planar'){
    setVal('dipDir_'+formKey, roundInt(r.dipDir));
    setVal('dip_'+formKey, roundInt(r.dip));
    setVal('strike_'+formKey, roundInt(r.strike));
    setVal('quad_'+formKey, toQuadrant(r.strike));
    onOrientationInputChange(formKey, 'dipdir');
  } else {
    setVal('trend_'+formKey, roundInt(r.trend));
    setVal('plunge_'+formKey, roundInt(r.plunge));
  }
  if(formKey==='fl' || formKey==='fp') autoCalcRakeIfReady();
  toast(currentLang==='es'?'Lectura capturada':'Reading captured');
}

async function initStereonetCanvas(){
  const canvas = document.getElementById('stereoCanvas');
  if(!canvas) return;
  const size = Math.min(window.innerWidth - 32, 440);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  canvas.onpointerdown = handleCanvasTouch;
  await drawStereonet();
}

async function drawStereonet(){
  const canvas = document.getElementById('stereoCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.width / dpr;
  const R = (size / 2) - 22;
  const cx = size / 2, cy = size / 2;

  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, size, size);

  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = colorTheme === 'sun' ? '#ffffff' : '#171c21';
  ctx.fill();

  const allSts = await dbGetAll('stations');
  const allMeas = await dbGetAll('measurements');
  
  let validStations = allSts;
  if(stereoState.campId !== 'ALL') validStations = validStations.filter(s => s.campaignId === stereoState.campId);
  if(stereoState.stationId !== 'ALL') validStations = validStations.filter(s => s.id === stereoState.stationId);
  const stIds = new Set(validStations.map(s => s.id));
  const meas = allMeas.filter(m => stIds.has(m.stationId));

  stereoState.interactiveItems = [];
  const polesForMean = [];
  const faultRecords = [];

  if(stereoState.showBeachball){
    meas.filter(m => m.type === 'fault' && (m.strike != null || m.dipDir != null)).forEach(f => {
      const kin = computeFaultKinematics(f);
      drawBeachballQuadrants(ctx, cx, cy, R, stereoState.proj, kin);
    });
  }

  drawStereoGrid(ctx, cx, cy, R);

  meas.forEach(m => {
    let strike = m.strike;
    if(strike == null && m.dipDir != null) strike = norm360(m.dipDir - 90);
    const dip = m.dip;

    if(m.type !== 'fault' && strike != null && dip != null){
      const poleVec = planeToPoleVector(strike, dip);
      polesForMean.push(poleVec);
      const polePt = project3D(poleVec, stereoState.proj, R);
      const px = cx + polePt.x, py = cy + polePt.y;

      let color = '#5fb583';
      if((m.subtype||'').includes('Foliación')) color = '#e8a33d';
      if(m.type === 'vein') color = '#5cb3ff';
      if(m.type === 'contact') color = '#d38aea';

      if(stereoState.showPlanes) drawGreatCircle(ctx, cx, cy, R, stereoState.proj, strike, dip, color, 1.4, false);
      if(stereoState.showPoles){
        ctx.beginPath();
        ctx.arc(px, py, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#14181c';
        ctx.lineWidth = 1;
        ctx.stroke();

        stereoState.interactiveItems.push({
          x: px, y: py, radius: 12, data: m, label: `${m.subtype||m.type}: ${pad3(strike)}/${pad2(dip)}`
        });
      }
    }

    if(m.trend != null && m.plunge != null && m.type !== 'fault'){
      const linVec = trendPlungeToVector(m.trend, m.plunge);
      const pt = project3D(linVec, stereoState.proj, R);
      const lx = cx + pt.x, ly = cy + pt.y;
      ctx.fillStyle = '#ff6b6b';
      ctx.fillRect(lx - 4, ly - 4, 8, 8);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.strokeRect(lx - 4, ly - 4, 8, 8);
      stereoState.interactiveItems.push({ x: lx, y: ly, radius: 12, data: m, label: `Lineación: ${pad3(m.trend)}/${pad2(m.plunge)}` });
    }

    if(m.type === 'fault' && (strike != null || m.dipDir != null)){
      faultRecords.push(m);
      const kin = computeFaultKinematics(m);

      if(stereoState.showFaults){
        drawGreatCircle(ctx, cx, cy, R, stereoState.proj, strike, dip, '#e0645c', 2, false);
        drawGreatCircle(ctx, cx, cy, R, stereoState.proj, kin.auxStrike, kin.auxDip, 'rgba(224,100,92,0.4)', 1, true);

        const stPt = project3D(kin.u, stereoState.proj, R);
        const sx = cx + stPt.x, sy = cy + stPt.y;
        ctx.beginPath();
        ctx.arc(sx, sy, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#e0645c';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        drawKinematicArrow(ctx, cx, cy, R, stereoState.proj, strike, dip, kin);
        stereoState.interactiveItems.push({
          x: sx, y: sy, radius: 14, data: m,
          label: `Falla ${m.sense||''}: ${pad3(strike)}/${pad2(dip)} | Rake: ${m.rake??'—'}°`
        });
      }

      if(stereoState.showPT){
        const pPt = project3D(kin.P, stereoState.proj, R);
        const pX = cx + pPt.x, pY = cy + pPt.y;
        ctx.beginPath();
        ctx.arc(pX, pY, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#e0645c';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        const tPt = project3D(kin.T, stereoState.proj, R);
        const tX = cx + tPt.x, tY = cy + tPt.y;
        ctx.beginPath();
        ctx.rect(tX - 4.5, tY - 4.5, 9, 9);
        ctx.fillStyle = '#5cb3ff';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        stereoState.interactiveItems.push({ x: pX, y: pY, radius: 10, data: m, label: `Eje P: ${pad3(kin.P_tp.trend)}/${pad2(kin.P_tp.plunge)}` });
        stereoState.interactiveItems.push({ x: tX, y: tY, radius: 10, data: m, label: `Eje T: ${pad3(kin.T_tp.trend)}/${pad2(kin.T_tp.plunge)}` });
      }
    }
  });

  const mean = calculateMeanOrientation(polesForMean);
  if(mean && stereoState.showPlanes){
    drawGreatCircle(ctx, cx, cy, R, stereoState.proj, mean.strike, mean.dip, '#ffffff', 2.2, true);
    const mPt = project3D(mean.meanVec, stereoState.proj, R);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(cx + mPt.x, cy + mPt.y, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  updateStereoStats(mean, faultRecords, meas.length);
  ctx.restore();
}

function drawStereoGrid(ctx, cx, cy, R){
  ctx.save();
  ctx.strokeStyle = colorTheme === 'sun' ? '#b0bec5' : '#333c44';
  ctx.lineWidth = 1;

  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R);
  ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy);
  ctx.stroke();

  for(let deg = 0; deg < 360; deg += 2){
    const rad = toRad(deg);
    const isMajor = (deg % 10 === 0);
    const isCardinal = (deg % 90 === 0);
    const len = isCardinal ? 9 : (isMajor ? 6 : 3);
    const x1 = cx + R * Math.sin(rad), y1 = cy - R * Math.cos(rad);
    const x2 = cx + (R - len) * Math.sin(rad), y2 = cy - (R - len) * Math.cos(rad);

    ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = isMajor ? (colorTheme==='sun'?'#37474f':'#8a97a3') : (colorTheme==='sun'?'#cfd8dc':'#333c44');
    ctx.lineWidth = isMajor ? 1.2 : 0.8;
    ctx.stroke();
  }

  ctx.fillStyle = colorTheme === 'sun' ? '#d87a00' : '#e8a33d';
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('N', cx, cy - R + 14);
  ctx.fillText('S', cx, cy + R - 14);
  ctx.fillText('E', cx + R - 14, cy);
  ctx.fillText(currentLang === 'es' ? 'O' : 'W', cx - R + 14, cy);
  ctx.restore();
}

function drawGreatCircle(ctx, cx, cy, R, projType, strike, dip, color, lineWidth, dashed){
  ctx.save();
  ctx.beginPath();
  if(dashed) ctx.setLineDash([4, 4]);
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;

  const sR = toRad(strike), dR = toRad(dip);
  const strikeVec = [Math.sin(sR), Math.cos(sR), 0];
  const dipVec = [Math.cos(sR) * Math.sin(dR), -Math.sin(sR) * Math.sin(dR), Math.cos(dR)];

  let first = true;
  for(let alpha = 0; alpha <= 180; alpha += 2){
    const aR = toRad(alpha);
    const v = V3.add(V3.scale(strikeVec, Math.cos(aR)), V3.scale(dipVec, Math.sin(aR)));
    const pt = project3D(v, projType, R);
    const x = cx + pt.x, y = cy + pt.y;
    if(first){ ctx.moveTo(x, y); first = false; } else { ctx.lineTo(x, y); }
  }
  ctx.stroke();
  ctx.restore();
}

function drawKinematicArrow(ctx, cx, cy, R, projType, strike, dip, kin){
  const pt = project3D(kin.u, projType, R);
  const px = cx + pt.x, py = cy + pt.y;
  const moveDir = V3.norm(V3.cross(kin.n, kin.b));
  const arrowHead = V3.add(kin.u, V3.scale(moveDir, 0.12));
  const ptH = project3D(arrowHead, projType, R);
  const dx = (cx + ptH.x) - px, dy = (cy + ptH.y) - py;
  const ang = Math.atan2(dy, dx);

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(ang);
  ctx.fillStyle = '#e8a33d';
  ctx.beginPath();
  ctx.moveTo(6, 0); ctx.lineTo(-6, -4); ctx.lineTo(-6, 4);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawBeachballQuadrants(ctx, cx, cy, R, projType, kin){
  ctx.save();
  const step = 6;
  for(let y = -R; y <= R; y += step){
    for(let x = -R; x <= R; x += step){
      if(Math.hypot(x, y) <= R){
        const v = unproject2D(x, y, projType, R);
        if(v){
          if(V3.dot(kin.n, v) * V3.dot(kin.u, v) > 0){
            ctx.fillStyle = 'rgba(224, 100, 92, 0.18)';
            ctx.fillRect(cx + x - step/2, cy + y - step/2, step, step);
          }
        }
      }
    }
  }
  ctx.restore();
}

function handleCanvasTouch(e){
  const canvas = document.getElementById('stereoCanvas');
  const tooltip = document.getElementById('stereoTooltip');
  if(!canvas || !tooltip) return;

  const rect = canvas.getBoundingClientRect();
  const clientX = e.clientX || (e.touches && e.touches[0].clientX);
  const clientY = e.clientY || (e.touches && e.touches[0].clientY);
  const touchX = clientX - rect.left, touchY = clientY - rect.top;

  let found = null;
  for(const item of stereoState.interactiveItems){
    if(Math.hypot(touchX - item.x, touchY - item.y) <= item.radius){
      found = item; break;
    }
  }

  if(found){
    tooltip.style.display = 'block';
    tooltip.style.left = Math.min(touchX + 12, rect.width - 200) + 'px';
    tooltip.style.top = Math.max(touchY - 40, 10) + 'px';
    tooltip.innerHTML = `<b>${esc(found.label)}</b><br><span style="color:var(--text-dim);font-size:10.5px;">ID: ${esc(found.data.id)}</span>`;
  } else {
    tooltip.style.display = 'none';
  }
}

function updateStereoStats(mean, faults, totalMeas){
  const el = document.getElementById('stereoStats');
  if(!el) return;
  let html = `Total de datos proyectados: <b>${totalMeas}</b><br>`;
  if(mean){
    html += `Polo medio (N=${mean.count}): <b>Trend/Plunge ${pad3(mean.trend)}/${pad2(mean.plunge)}</b><br>`;
    html += `Plano medio equivalente: <b>${pad3(mean.strike)}/${pad2(mean.dip)} (RHR)</b> · DipDir <b>${pad3(mean.dipDir)}</b><br>`;
  }
  if(faults.length > 0){

async function buildBackupObject(includeOverlays) {
  const stores = Array.from(DB.objectStoreNames);
  const data = {};
  const counts = {};
  for (const store of stores) {
    // Sin imágenes base: se omite el almacén (así "Reemplazar" no borra las imágenes actuales)
    if (!includeOverlays && store === 'map_overlays') continue;
    const records = await dbGetAll(store);
    data[store] = records;
    counts[store] = records.length;
  }
  const settings = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith('geo_') && key !== 'geo_last_backup') {
      settings[key] = localStorage.getItem(key);
    }
  }
  return {
    app: 'GeoField Core',
    format_version: 1,
    db_version: DB.version,
    exported_at: nowIso(),
    counts,
    settings,
    data
  };
}

function validateBackupObject(obj) {
  const res = { ok: true, errors: [], warnings: [], summary: {} };
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) {
    res.errors.push("El archivo no es un objeto JSON válido.");
    res.ok = false;
    return res;
  }
  if (obj.app !== 'GeoField Core') {
    res.errors.push("La firma de la aplicación (app) no coincide con 'GeoField Core'.");
    res.ok = false;
  }
  if (!Number.isInteger(obj.format_version) || obj.format_version > 1) {
    res.errors.push("La versión del formato no es válida o es superior a la soportada (1).");
    res.ok = false;
  }
  if (!obj.data || typeof obj.data !== 'object') {
    res.errors.push("El objeto carece de la propiedad principal 'data'.");
    res.ok = false;
    return res;
  }
  // Todo almacén presente en el archivo debe ser un arreglo
  for (const key of Object.keys(obj.data)) {
    if (!Array.isArray(obj.data[key])) {
      res.errors.push(`El almacén de datos '${key}' no es un arreglo válido.`);
      res.ok = false;
    }
  }
  if (!res.ok) return res;
 
  const campIds = new Set();
  const statIds = new Set();
  for (const store in obj.data) {
    res.summary[store] = obj.data[store].length;
    for (const record of obj.data[store]) {
      if (!record || typeof record !== 'object' || !record.id) {
        res.errors.push(`Se encontró un registro sin 'id' en el almacén '${store}'.`);
        res.ok = false;
      } else {
        if (store === 'campaigns') campIds.add(record.id);
        if (store === 'stations') statIds.add(record.id);
      }
    }
  }
  if (obj.data.stations) {
    for (const s of obj.data.stations) {
      if (s && s.campaignId && !campIds.has(s.campaignId)) {
        res.warnings.push(`La estación ${s.id} referencia a una campaña inexistente en este respaldo.`);
      }
    }
  }
  if (obj.data.measurements) {
    for (const m of obj.data.measurements) {
      if (m && m.stationId && !statIds.has(m.stationId)) {
        res.warnings.push(`La medición ${m.id} referencia a una estación inexistente en este respaldo.`);
      }
    }
  }
  return res;
}
 
async function importFullBackup(file, mode, overwrite) {
  try {
    const text = await file.text();
    let obj;
    try {
      obj = JSON.parse(text);
    } catch (e) {
      alert("El archivo seleccionado no tiene un formato JSON válido.");
      return;
    }
    const validation = validateBackupObject(obj);
    if (!validation.ok) {
      alert("Error de validación del respaldo:\n\n- " + validation.errors.join('\n- '));
      return;
    }
    if (validation.warnings.length > 0) {
      console.warn("Advertencias durante la validación:", validation.warnings);
    }
 
    const dbStores = Array.from(DB.objectStoreNames);
    const storesInFile = Object.keys(obj.data);
    const validStores = storesInFile.filter(s => dbStores.includes(s) && Array.isArray(obj.data[s]));
    storesInFile.filter(s => !validStores.includes(s)).forEach(s => console.warn(`Almacén ignorado (no existe en DB): ${s}`));
    if (validStores.length === 0) {
      alert("El respaldo no contiene almacenes compatibles con esta versión.");
      return;
    }
 
    if (mode === 'replace') {
      const confirmText = prompt("Escribe REEMPLAZAR para confirmar que deseas borrar toda tu base de datos actual y cargar la del archivo.");
      if (confirmText !== 'REEMPLAZAR') {
        toast("Restauración cancelada.");
        return;
      }
      const currentData = await buildBackupObject(true);
      downloadFile(JSON.stringify(currentData), `geofield_antes_de_restaurar_${dateStamp()}.json`, 'application/json');
      toast("Copia de seguridad previa descargada.");
    }
 
    const transaction = DB.transaction(validStores, 'readwrite');
    let added = 0, updated = 0, skipped = 0;
    const txPromise = new Promise((resolve, reject) => {
      transaction.oncomplete = () => resolve();
      transaction.onerror = () => reject(transaction.error);
      transaction.onabort = () => reject(transaction.error || new Error("Transacción abortada."));
    });
 
    try {
      for (const storeName of validStores) {
        const store = transaction.objectStore(storeName);
        if (mode === 'replace') store.clear();
        for (const record of obj.data[storeName]) {
          if (mode === 'replace') {
            store.put(record);
            added++;
          } else {
            const req = store.get(record.id);
            req.onsuccess = (e) => {
              if (e.target.result) {
                if (overwrite) { store.put(record); updated++; } else { skipped++; }
              } else {
                store.put(record); added++;
              }
            };
            req.onerror = () => { transaction.abort(); };
          }
        }
      }
    } catch (loopErr) {
      try { transaction.abort(); } catch (_) {}
      await txPromise.catch(() => {});
      throw loopErr;
    }
 
    await txPromise;
 
    // Los ajustes se restauran SOLO si la base de datos se escribió completa
    let settingsRestored = false;
    if (mode === 'replace' && obj.settings && typeof obj.settings === 'object') {
      for (const [k, v] of Object.entries(obj.settings)) {
        if (k.startsWith('geo_')) localStorage.setItem(k, v);
      }
      settingsRestored = true;
    }
 
    alert(`Restauración completada con éxito.\nResumen de operaciones:\nAgregados: ${added}\nActualizados: ${updated}\nOmitidos: ${skipped}`);
    if (settingsRestored) {
      location.reload();
    } else {
      render();
    }
  } catch (err) {
    console.error(err);
    alert("Error durante la importación (no se modificó ningún dato): " + err.message);
  }
}

function csvEsc(v){ v=String(v??''); if(/[",\n]/.test(v)){ v='"'+v.replace(/"/g,'""')+'"'; } return v; }

async function getFilteredData(){
  const scope = document.getElementById('exportCampSelect')?.value || 'ALL';
  let stations = await dbGetAll('stations');
  let camps = await dbGetAll('campaigns');
  const campMap={}; camps.forEach(c=>campMap[c.id]=c);

  if(scope !== 'ALL'){
    stations = stations.filter(s=>s.campaignId === scope);
  }
  const stMap={}; stations.forEach(s=>stMap[s.id]=s);
  const allMeas = await dbGetAll('measurements');
  const measurements = allMeas.filter(m=>stMap[m.stationId]);
  return { stations, measurements, stMap, campMap };
}

async function exportCSV(){
  const { measurements, stMap, campMap } = await getFilteredData();
  const headers=['Campaign','Station_ID','Timestamp','Lat','Lon','Alt','UTM_Zone','UTM_Hemisphere','UTM_Easting','UTM_Northing','Struct_Type','Kind','Strike','Dip','DipDir','Trend','Plunge','Rake','Rake_Quad','Sense','True_Thickness','Vein_Thick','Vein_Unit','Alteration','Notes'];
  const rows=[headers.join(',')];
  measurements.forEach(m=>{
    const st=stMap[m.stationId]||{};
    const camp=campMap[st.campaignId]||{};
    const u = utmLabel(st.lat, st.lon);
    rows.push([
      csvEsc(camp.name||''), csvEsc(st.name||st.id||''), csvEsc(m.timestamp||st.timestamp||''),
      st.lat??'', st.lon??'', st.alt??'',
      u? u.zoneNumber:'', u? u.hemisphere:'', u? u.easting:'', u? u.northing:'',
      csvEsc(m.subtype||m.type), csvEsc(m.structKind||''),
      m.strike!=null?roundInt(m.strike):'', m.dip!=null?roundInt(m.dip):'', m.dipDir!=null?roundInt(m.dipDir):'',
      m.trend!=null?roundInt(m.trend):'', m.plunge!=null?roundInt(m.plunge):'', m.rake!=null?roundInt(m.rake):'', csvEsc(m.rakeQuadrant||''),

      csvEsc((m.alteration||[]).join('; ')), csvEsc(m.notes||'')

async function handleFileImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const text = await file.text();
  const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
  if(lines.length < 2){ toast('Archivo vacío o sin datos'); return; }

  const campName = 'Importación_' + file.name.replace(/\.[^/.]+$/, "");
  const campId = uid();
  await dbPut('campaigns', { id: campId, name: campName, timestamp: nowIso(), notes: `Importado desde ${file.name}` });

  const headerLine = lines[0];
  const delim = headerLine.includes('\t') ? '\t' : (headerLine.includes(';') ? ';' : ',');
  const rawHeaders = headerLine.split(delim).map(h => h.trim().toLowerCase());

  const getIdx = (patterns) => rawHeaders.findIndex(h => patterns.some(p => h.includes(p)));
  const iStrike = getIdx(['fault strike','strike']);
  const iDip = getIdx(['fault dip','dip']);
  const iTrend = getIdx(['striae trend','trend']);
  const iPlunge = getIdx(['striae plunge','plunge']);
  const iSense = getIdx(['sense of slip','sense']);
  const iFieldNo = getIdx(['field no.','station_id','station','estacion','name']);
  const iLat = getIdx(['latitude','lat']);
  const iLon = getIdx(['longitude','lon','long']);
  const iAlt = getIdx(['elevation','alt']);
  const iNotes = getIdx(['notes','nota']);

  let count = 0;
  const stationsCreated = {};

  for(let i = 1; i < lines.length; i++){
    const cols = lines[i].split(delim).map(c => c.trim());
    if(cols.length < 2) continue;

    const stName = (iFieldNo >= 0 && cols[iFieldNo]) ? cols[iFieldNo] : `EST-${String(count+1).padStart(2,'0')}`;
    let stId = stationsCreated[stName];

    const latVal = (iLat >= 0 && cols[iLat]) ? parseFloat(cols[iLat]) : null;
    const lonVal = (iLon >= 0 && cols[iLon]) ? parseFloat(cols[iLon]) : null;
    const altVal = (iAlt >= 0 && cols[iAlt]) ? roundInt(parseFloat(cols[iAlt])) : null;

    if(!stId){
      stId = uid();
      stationsCreated[stName] = stId;
      await dbPut('stations', {
        id: stId, campaignId: campId, name: stName, timestamp: nowIso(),
        lat: isNaN(latVal) ? null : latVal, lon: isNaN(lonVal) ? null : lonVal, alt: isNaN(altVal) ? null : altVal,
        notes: 'Importado de FaultKin/Texto'
      });
    }

    const strikeVal = (iStrike >= 0 && cols[iStrike]) ? roundInt(parseFloat(cols[iStrike])) : null;
    const dipVal = (iDip >= 0 && cols[iDip]) ? roundInt(parseFloat(cols[iDip])) : null;
    const trendVal = (iTrend >= 0 && cols[iTrend]) ? roundInt(parseFloat(cols[iTrend])) : null;
    const plungeVal = (iPlunge >= 0 && cols[iPlunge]) ? roundInt(parseFloat(cols[iPlunge])) : null;
    const senseVal = (iSense >= 0 && cols[iSense]) ? cols[iSense] : '';
    const noteVal = (iNotes >= 0 && cols[iNotes]) ? cols[iNotes] : '';

    if(strikeVal != null && dipVal != null){
      const dipDirVal = roundInt(norm360(strikeVal + 90));
      const measObj = {
        id: uid(), stationId: stId,
        type: (trendVal != null || senseVal) ? 'fault' : 'planar',
        subtype: 'Importado', timestamp: nowIso(),
        strike: strikeVal, dip: dipVal, dipDir: dipDirVal,
        trend: trendVal, plunge: plungeVal, striaeMode: 'trendplunge',
        sense: senseVal || 'Normal', notes: noteVal
      };

      if(trendVal != null && plungeVal != null){
        const rk = calculateRakeFromTP(dipDirVal, dipVal, trendVal, plungeVal);
        if(rk){ measObj.rake = rk.rake; measObj.rakeQuadrant = rk.quadrant; }
      }
      await dbPut('measurements', measObj);
      count++;
    }
  }

  toast(`Importados ${count} registros`);
  Nav.campaign(campId);
}

  </div>

  <div class="card" style="cursor:default;">
    <div class="card-title">${t('quadrantMode')}</div>
    <select onchange="changeQuadrantPref(this.value)" style="margin-top:8px;">
      <option value="NS" ${quadrantPref==='NS'?'selected':''}>Norte y Sur (ej. N30°E y S45°O)</option>
      <option value="N_ONLY" ${quadrantPref==='N_ONLY'?'selected':''}>Solo Norte (ej. N30°E y N135°O)</option>
    </select>
  </div>

  <div class="card" style="cursor:default;">
    <div class="card-title">${t('needleTarget')}</div>
    <select onchange="changeNeedleMode(this.value)" style="margin-top:8px;">
      <option value="dipdir" ${needleMode==='dipdir'?'selected':''}>Dirección de Manteo (Dip Direction)</option>
      <option value="strike" ${needleMode==='strike'?'selected':''}>Rumbo / Strike (Regla mano derecha)</option>
    </select>
  </div>

  <div class="card" style="cursor:default;">
    <div class="card-title">${t('calibration')}</div>
    <input type="number" step="1" value="${magOffset}" id="magOffsetInput" onchange="changeMagOffset(this.value)" style="margin-top:8px;" placeholder="ej. -5 o 8">
    <button class="btn ghost small" style="width:100%;margin-top:8px;" onclick="autoEstimateDeclination()">📍 Calcular declinación desde GPS actual</button>
  </div>

  <div class="card" style="cursor:default;">
    <div class="card-title">${t('compassSize')}</div>
    <select onchange="changeCompassScale(this.value)" style="margin-top:8px;">
      <option value="sm" ${compassScale==='sm'?'selected':''}>Pequeño / Small</option>
      <option value="md" ${compassScale==='md'?'selected':''}>Medio / Medium</option>
      <option value="lg" ${compassScale==='lg'?'selected':''}>Grande / Large</option>
      <option value="xl" ${compassScale==='xl'?'selected':''}>Extra Grande / Extra Large</option>
    </select>
  </div>

  <div class="card" style="cursor:default;">
    <div class="card-title">${t('sensorBoxSize')}</div>
    <select onchange="changeBoxScale(this.value)" style="margin-top:8px;">
      <option value="md" ${boxScale==='md'?'selected':''}>Normal</option>
      <option value="lg" ${boxScale==='lg'?'selected':''}>Grande (Recomendado)</option>
      <option value="xl" ${boxScale==='xl'?'selected':''}>Extra grande</option>
    </select>
  </div>

  <div class="card" style="cursor:default;">
    <div class="card-title">Sensores / Permisos</div>
    <button class="btn primary" style="margin-top:8px;" onclick="requestSensorPermission()">📡 Activar / Re-calibrar Sensores</button>
  </div>
  `;
}

function autoEstimateDeclination(){
  if(gpsState.lat==null || gpsState.lon==null){ toast('Requiere señal GPS'); return; }
  const est = estimateDeclination(gpsState.lat, gpsState.lon);
  changeMagOffset(est);
  const input = document.getElementById('magOffsetInput');
  if(input) input.value = est;
  toast(`Declinación estimada: ${est}° aplicada`);
}

function changeColorTheme(theme){ colorTheme=theme; localStorage.setItem('geo_theme', theme); render(); }
function changeInputNotation(not){ inputNotation=not; localStorage.setItem('geo_input_notation', not); render(); }
function changeLanguage(lang){ currentLang=lang; localStorage.setItem('geo_lang', lang); render(); }
function changeCompassScale(scale){ compassScale=scale; localStorage.setItem('geo_compass_scale', scale); render(); }
function changeBoxScale(scale){ boxScale=scale; localStorage.setItem('geo_box_scale', scale); render(); }
function changeQuadrantPref(val){ quadrantPref=val; localStorage.setItem('geo_quadrant_pref', val); render(); }
function changeNeedleMode(val){ needleMode=val; localStorage.setItem('geo_needle_mode', val); render(); }
function changeMagOffset(val){ magOffset=parseFloat(val)||0; localStorage.setItem('geo_mag_offset', magOffset); render(); }

(async function init(){
  await openDB();
  injectBackupTranslations();
  injectMapLayerTranslations();
  injectOnlineLayerTranslations();
  injectMapNavTranslations();
  requestPersistentStorage().catch(()=>{});
  initGPS();
  initSensors();
  updateTopbarStatus();
  setInterval(updateTopbarStatus, 3000);
  render();
})();

// --- Funcionamiento sin conexión (service worker) ---
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch(err => console.warn('Service worker no registrado:', err));
  });
}

</script>
</body>
</html>
