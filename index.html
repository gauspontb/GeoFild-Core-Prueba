// CAMBIO: Función pura para normalizar códigos de sentido cinemático
function normalizeSenseCode(raw) {
  // CAMBIO: Resolver el mismo código interno usado por computeFaultKinematics.
  return canonicalSense(raw);
}

// CAMBIO: Wrapper para aislar la llamada, aplicar la normalización en lectura 
// y emitir advertencias de consola una sola vez por sesión/código.
const warnedSenses = new Set();
function getFaultKinematicsNormalized(f) {
  const norm = normalizeSenseCode(f.sense);
    // CAMBIO: No calcular cinemática cuando el sentido está sin determinar.
  if (norm === 'undetermined') return null;
  if (norm === null && f.sense) {
    const rawStr = String(f.sense).trim();
    if (rawStr !== '' && !warnedSenses.has(rawStr)) {
      console.warn('Sentido cinemático no reconocido, usando "normal":', rawStr);
      warnedSenses.add(rawStr);
    }
  }
  // Se pasa el valor normalizado o un fallback silencioso para que la original no grite
  return computeFaultKinematics({ ...f, sense: norm || 'normal' });
}

async function drawStereonet(){
  const canvas = document.getElementById('stereoCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.width / dpr;
  const R = (size / 2) - 22;
  const cx = size / 2, cy = size / 2;

  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, size, size);

  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  // CAMBIO: Fondo blanco del estereograma para pink.
  ctx.fillStyle = (colorTheme === 'sun' || colorTheme === 'pink') ? '#ffffff' : '#171c21';
  ctx.fill();

  const allSts = await dbGetAll('stations');
  const allMeas = await dbGetAll('measurements');
  
  let validStations = allSts;
  if(stereoState.campId !== 'ALL') validStations = validStations.filter(s => s.campaignId === stereoState.campId);
  if(stereoState.stationId !== 'ALL') validStations = validStations.filter(s => s.id === stereoState.stationId);
  const stIds = new Set(validStations.map(s => s.id));
  const meas = allMeas.filter(m => stIds.has(m.stationId));

  stereoState.interactiveItems = [];
  const polesForMean = [];
  const faultRecords = [];

  if(stereoState.showBeachball){
    meas.filter(m => m.type === 'fault' && (m.strike != null || m.dipDir != null)).forEach(f => {
      const kin = getFaultKinematicsNormalized(f); // CAMBIO: Usar wrapper normalizado
            // CAMBIO: Omitir el mecanismo focal cuando no hay cinemática determinada.
      if (kin) drawBeachballQuadrants(ctx, cx, cy, R, stereoState.proj, kin);
    });
  }

  drawStereoGrid(ctx, cx, cy, R);

  meas.forEach(m => {
    let strike = m.strike;
    if(strike == null && m.dipDir != null) strike = norm360(m.dipDir - 90);
    const dip = m.dip;

    if(m.type !== 'fault' && strike != null && dip != null){
      const poleVec = planeToPoleVector(strike, dip);
      polesForMean.push(poleVec);
      const polePt = project3D(poleVec, stereoState.proj, R);
      const px = cx + polePt.x, py = cy + polePt.y;

      let color = '#5fb583';
      if((m.subtype||'').includes('Foliación')) color = '#e8a33d';
      if(m.type === 'vein') color = '#5cb3ff';
      if(m.type === 'contact') color = '#d38aea';

      if(stereoState.showPlanes) drawGreatCircle(ctx, cx, cy, R, stereoState.proj, strike, dip, color, 1.4, false);
      if(stereoState.showPoles){
        ctx.beginPath();
        ctx.arc(px, py, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#14181c';
        ctx.lineWidth = 1;
        ctx.stroke();

        stereoState.interactiveItems.push({
          x: px, y: py, radius: 12, data: m, label: `${m.subtype||m.type}: ${pad3(strike)}/${pad2(dip)}`
        });
      }
    }

    if(m.trend != null && m.plunge != null && m.type !== 'fault'){
      const linVec = trendPlungeToVector(m.trend, m.plunge);
      const pt = project3D(linVec, stereoState.proj, R);
      const lx = cx + pt.x, ly = cy + pt.y;
      ctx.fillStyle = '#ff6b6b';
      ctx.fillRect(lx - 4, ly - 4, 8, 8);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.strokeRect(lx - 4, ly - 4, 8, 8);
      stereoState.interactiveItems.push({ x: lx, y: ly, radius: 12, data: m, label: `Lineación: ${pad3(m.trend)}/${pad2(m.plunge)}` });
    }

    if(m.type === 'fault' && (strike != null || m.dipDir != null)){
      
      const kin = getFaultKinematicsNormalized(m); // CAMBIO: Usar wrapper normalizado
      // CAMBIO: Registrar únicamente fallas con una solución cinemática válida.
      if (kin) faultRecords.push(m);

      if(stereoState.showFaults){
        drawGreatCircle(ctx, cx, cy, R, stereoState.proj, strike, dip, '#e0645c', 2, false);
                // CAMBIO: El plano auxiliar solo existe cuando hay cinemática determinada.
        if (kin) drawGreatCircle(ctx, cx, cy, R, stereoState.proj, kin.auxStrike, kin.auxDip, 'rgba(224,100,92,0.4)', 1, true);

                // CAMBIO: Obtener la estría desde sus datos geométricos si la cinemática es indeterminada.
        const striaeVec = kin ? kin.u :
          (m.trend != null && m.plunge != null)
            ? trendPlungeToVector(m.trend, m.plunge)
            : (m.rake != null && dip != null)
              ? faultRakeToSlipVector(strike, dip, m.rake, m.rakeQuadrant)
              : null;

        // CAMBIO: Dibujar el punto solamente si hay datos de estría.
        if (striaeVec) {
          const stPt = project3D(striaeVec, stereoState.proj, R);

        const sx = cx + stPt.x, sy = cy + stPt.y;
        ctx.beginPath();
        ctx.arc(sx, sy, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#e0645c';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // CAMBIO: Mantener el bloque de estría abierto hasta registrar el punto interactivo.
        // CAMBIO: No dibujar flecha cinemática para fallas indeterminadas.
        // CAMBIO: Dibujar flecha solamente cuando hay cinemática válida.
        if (kin) drawKinematicArrow(ctx, cx, cy, R, stereoState.proj, strike, dip, kin);
        stereoState.interactiveItems.push({
          x: sx, y: sy, radius: 14, data: m,
          label: `Falla ${m.sense||''}: ${pad3(strike)}/${pad2(dip)} | Rake: ${m.rake??'—'}°`
        });
        // CAMBIO: Cerrar el dibujo opcional de estría después de registrar el punto.
        }

      }

            // CAMBIO: Los ejes P/T requieren una solución cinemática válida.
      if(stereoState.showPT && kin){
        const pPt = project3D(kin.P, stereoState.proj, R);
        const pX = cx + pPt.x, pY = cy + pPt.y;
        ctx.beginPath();
        ctx.arc(pX, pY, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#e0645c';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        const tPt = project3D(kin.T, stereoState.proj, R);
        const tX = cx + tPt.x, tY = cy + tPt.y;
        ctx.beginPath();
        ctx.rect(tX - 4.5, tY - 4.5, 9, 9);
        ctx.fillStyle = '#5cb3ff';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        stereoState.interactiveItems.push({ x: pX, y: pY, radius: 10, data: m, label: `Eje P: ${pad3(kin.P_tp.trend)}/${pad2(kin.P_tp.plunge)}` });
        stereoState.interactiveItems.push({ x: tX, y: tY, radius: 10, data: m, label: `Eje T: ${pad3(kin.T_tp.trend)}/${pad2(kin.T_tp.plunge)}` });
      }
    }
  });

  const mean = calculateMeanOrientation(polesForMean);
  if(mean && stereoState.showPlanes){
    drawGreatCircle(ctx, cx, cy, R, stereoState.proj, mean.strike, mean.dip, '#ffffff', 2.2, true);
    const mPt = project3D(mean.meanVec, stereoState.proj, R);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(cx + mPt.x, cy + mPt.y, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  updateStereoStats(mean, faultRecords, meas.length);
  ctx.restore();
}

function drawStereoGrid(ctx, cx, cy, R){
  ctx.save();
  // CAMBIO: Trazos de cuadrícula de tema claro para pink.
  ctx.strokeStyle = (colorTheme === 'sun' || colorTheme === 'pink') ? '#b0bec5' : '#333c44';
  ctx.lineWidth = 1;

  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R);
  ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy);
  ctx.stroke();

  for(let deg = 0; deg < 360; deg += 2){
    const rad = toRad(deg);
    const isMajor = (deg % 10 === 0);
    const isCardinal = (deg % 90 === 0);
    const len = isCardinal ? 9 : (isMajor ? 6 : 3);
    const x1 = cx + R * Math.sin(rad), y1 = cy - R * Math.cos(rad);
    const x2 = cx + (R - len) * Math.sin(rad), y2 = cy - (R - len) * Math.cos(rad);

    ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    // CAMBIO: Marcas principales y secundarias adaptadas a pink claro.
    ctx.strokeStyle = isMajor ? ((colorTheme==='sun' || colorTheme==='pink')?'#37474f':'#8a97a3') : ((colorTheme==='sun' || colorTheme==='pink')?'#cfd8dc':'#333c44');
    ctx.lineWidth = isMajor ? 1.2 : 0.8;
    ctx.stroke();
  }

  // CAMBIO: Letras cardinales con tratamiento de tema claro para pink.
  ctx.fillStyle = (colorTheme === 'sun' || colorTheme === 'pink') ? '#d87a00' : '#e8a33d';
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('N', cx, cy - R + 14);
  ctx.fillText('S', cx, cy + R - 14);
  ctx.fillText('E', cx + R - 14, cy);
  ctx.fillText(currentLang === 'es' ? 'O' : 'W', cx - R + 14, cy);
  ctx.restore();
}

function drawGreatCircle(ctx, cx, cy, R, projType, strike, dip, color, lineWidth, dashed){
  ctx.save();
  ctx.beginPath();
  if(dashed) ctx.setLineDash([4, 4]);
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;

  const sR = toRad(strike), dR = toRad(dip);
  const strikeVec = [Math.sin(sR), Math.cos(sR), 0];
  // CAMBIO: Vector de máxima pendiente perpendicular al polo, con inmersión igual al manteo.
  const dipVec = [Math.cos(sR) * Math.cos(dR), -Math.sin(sR) * Math.cos(dR), Math.sin(dR)];

  let first = true;
  for(let alpha = 0; alpha <= 180; alpha += 2){
    const aR = toRad(alpha);
    const v = V3.add(V3.scale(strikeVec, Math.cos(aR)), V3.scale(dipVec, Math.sin(aR)));
    const pt = project3D(v, projType, R);
    const x = cx + pt.x, y = cy + pt.y;
    if(first){ ctx.moveTo(x, y); first = false; } else { ctx.lineTo(x, y); }
  }
  ctx.stroke();
  ctx.restore();
}

function drawKinematicArrow(ctx, cx, cy, R, projType, strike, dip, kin){
  const pt = project3D(kin.u, projType, R);
  const px = cx + pt.x, py = cy + pt.y;
  const moveDir = V3.norm(V3.cross(kin.n, kin.b));
  const arrowHead = V3.add(kin.u, V3.scale(moveDir, 0.12));
  const ptH = project3D(arrowHead, projType, R);
  const dx = (cx + ptH.x) - px, dy = (cy + ptH.y) - py;
  const ang = Math.atan2(dy, dx);

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(ang);
  ctx.fillStyle = '#e8a33d';
  ctx.beginPath();
  ctx.moveTo(6, 0); ctx.lineTo(-6, -4); ctx.lineTo(-6, 4);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawBeachballQuadrants(ctx, cx, cy, R, projType, kin){
  // CAMBIO: Presupuesto de memoria y gestor LRU integrado
  const BEACHBALL_CACHE_MAX_BYTES = 48 * 1024 * 1024;
  
  if (!drawBeachballQuadrants.cacheManager) {
    drawBeachballQuadrants.cacheManager = {
      cache: new Map(),
      totalBytes: 0,
      currentProps: '',
      clear: function() {
        this.cache.clear();
        this.totalBytes = 0;
        window.stereoFillCacheBytes = 0;
      },
      get: function(key) {
        if (this.cache.has(key)) {
          // LRU: Extraer y volver a insertar al final
          const entry = this.cache.get(key);
          this.cache.delete(key);
          this.cache.set(key, entry);
          return entry.canvas;
        }
        return null;
      },
      put: function(key, canvas, bytes) {
        this.cache.set(key, { canvas, bytes });
        this.totalBytes += bytes;
        // Expulsar las entradas más antiguas si se supera el presupuesto
        while (this.totalBytes > BEACHBALL_CACHE_MAX_BYTES && this.cache.size > 0) {
          const firstKey = this.cache.keys().next().value;
          const entry = this.cache.get(firstKey);
          this.totalBytes -= entry.bytes;
          this.cache.delete(firstKey);
        }
        window.stereoFillCacheBytes = this.totalBytes;
      }
    };
  }
  
  if (typeof window.stereoFillCalcCount === 'undefined') window.stereoFillCalcCount = 0;
  if (typeof window.stereoFillCacheBytes === 'undefined') window.stereoFillCacheBytes = 0;

  const dpr = window.devicePixelRatio || 1;
  
  // CAMBIO: Invalidar caché entero si las propiedades base cambian (para redimensionamiento)
  const currentProps = `${projType}_${Math.round(R)}_${dpr}`;
  if (drawBeachballQuadrants.cacheManager.currentProps !== currentProps) {
    drawBeachballQuadrants.cacheManager.clear();
    drawBeachballQuadrants.cacheManager.currentProps = currentProps;
  }

  const key = `${kin.n.map(v=>v.toFixed(3)).join(',')}_${kin.u.map(v=>v.toFixed(3)).join(',')}`;
  
  const cachedCanvas = drawBeachballQuadrants.cacheManager.get(key);
  if(cachedCanvas){
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(cachedCanvas, cx - R, cy - R, R * 2, R * 2);
    ctx.restore();
    return;
  }
  
  window.stereoFillCalcCount++;
  
  let scale = dpr;
  if (scale < 2) scale = 2; // Asegurar al menos 2x en pantallas normales
  if (R * 2 * scale > 1600) scale = 1600 / (R * 2);
  
  // CAMBIO: Asegurar que la entrada individual NUNCA supere el presupuesto general
  let size;
  let bytes;
  while (true) {
    size = Math.ceil(R * 2 * scale);
    bytes = size * size * 4;
    if (bytes <= BEACHBALL_CACHE_MAX_BYTES) break;
    scale *= 0.8; // Bajar factor de supermuestreo si es demasiado grande
  }
  
  const offCanvas = document.createElement('canvas');
  offCanvas.width = size;
  offCanvas.height = size;
  const offCtx = offCanvas.getContext('2d');
  
  const imgData = offCtx.createImageData(size, size);
  const data = imgData.data;
  const rScaled = size / 2;
  const rScaledSq = rScaled * rScaled;
  
  for (let y = 0; y < size; y++) {
    const dy = y - rScaled;
    for (let x = 0; x < size; x++) {
      const dx = x - rScaled;
      if (dx * dx + dy * dy <= rScaledSq) {
        const origX = dx / scale;
        const origY = dy / scale;
        const v = unproject2D(origX, origY, projType, R);
        if (v && (V3.dot(kin.n, v) * V3.dot(kin.u, v) > 0)) {
          const idx = (y * size + x) * 4;
          data[idx] = 224;
          data[idx+1] = 100;
          data[idx+2] = 92;
          data[idx+3] = 46; 
        }
      }
    }
  }
  offCtx.putImageData(imgData, 0, 0);
  
  offCtx.globalCompositeOperation = 'destination-in';
  offCtx.fillStyle = '#000';
  offCtx.beginPath();
  offCtx.arc(rScaled, rScaled, rScaled - 0.5, 0, Math.PI * 2);
  offCtx.fill();
  offCtx.globalCompositeOperation = 'source-over';
  
  // Guardar en el gestor LRU
  drawBeachballQuadrants.cacheManager.put(key, offCanvas, bytes);
  
  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(offCanvas, cx - R, cy - R, R * 2, R * 2);
  ctx.restore();
}

function handleCanvasTouch(e){
  const canvas = document.getElementById('stereoCanvas');
  const tooltip = document.getElementById('stereoTooltip');
  if(!canvas || !tooltip) return;

  const rect = canvas.getBoundingClientRect();
  const clientX = e.clientX || (e.touches && e.touches[0].clientX);
  const clientY = e.clientY || (e.touches && e.touches[0].clientY);
  const touchX = clientX - rect.left, touchY = clientY - rect.top;

  let found = null;
  for(const item of stereoState.interactiveItems){
    if(Math.hypot(touchX - item.x, touchY - item.y) <= item.radius){
      found = item; break;
    }
  }

  if(found){
    tooltip.style.display = 'block';
    tooltip.style.left = Math.min(touchX + 12, rect.width - 200) + 'px';
    tooltip.style.top = Math.max(touchY - 40, 10) + 'px';
    tooltip.innerHTML = `<b>${esc(found.label)}</b><br><span style="color:var(--text-dim);font-size:10.5px;">ID: ${esc(found.data.id)}</span>`;
  } else {
    tooltip.style.display = 'none';
  }
}

// CAMBIO: Lógicas de API Storage y actualización asíncrona de UI de Ajustes
async function getStorageStatus() {
  const res = { supported: false, persisted: false, usage: 0, quota: 0 };
  if (navigator.storage) {
    res.supported = true;
    if (navigator.storage.persisted) {
      try { res.persisted = await navigator.storage.persisted(); } catch(e){}
    }
    if (navigator.storage.estimate) {
      try {
        const est = await navigator.storage.estimate();
        res.usage = est.usage || 0;
        res.quota = est.quota || 0;
      } catch(e){}
    }
  }
  return res;
}

async function requestPersistentStorage() {
  if (navigator.storage && navigator.storage.persist) {
    try {
      const isPersisted = await navigator.storage.persisted();
      if (!isPersisted) {
        await navigator.storage.persist();
        return true;
      }
      return true;
    } catch (e) {
      return false;
    }
  }
  return false;
}

async function updateStorageSettingsUI() {
  const statusEl = document.getElementById('storageStatusTxt');
  const usageEl = document.getElementById('storageUsageTxt');
  const btn = document.getElementById('btnReqStorage');
  const backupEl = document.getElementById('lastBackupTxt');
  const warnEl = document.getElementById('storageWarnBox');
  if (!statusEl) return;

  const st = await getStorageStatus();
  
  if (!st.supported) {
    statusEl.textContent = t('storageNotAvail');
    usageEl.textContent = '—';
    if(btn) btn.style.display = 'none';
  } else {
    statusEl.textContent = st.persisted ? t('storageProtected') : t('storageUnprotected');
    const mbUsage = (st.usage / (1024*1024)).toFixed(1);
    const mbQuota = (st.quota / (1024*1024)).toFixed(1);
    usageEl.textContent = mbUsage + ' MB de ' + mbQuota + ' MB';
    if(btn) btn.style.display = st.persisted ? 'none' : 'inline-flex';
  }

  // CAMBIO: Mostrar si fue con fotos
  const lastBkup = localStorage.getItem('geo_last_backup');
  const lastBkupPhotos = localStorage.getItem('geo_last_backup_photos');
  let isOld = false;
  if (!lastBkup) {
    backupEl.textContent = t('never');
    isOld = true;
  } else {
    const d = new Date(lastBkup);
    const diffDays = Math.floor((Date.now() - d.getTime()) / (1000 * 3600 * 24));
    const pStr = lastBkupPhotos === '1' ? t('backupWithPhotos') : t('backupWithoutPhotos');
    backupEl.textContent = fmtDate(lastBkup) + ' (hace ' + diffDays + ' días) - ' + pStr;
    if (diffDays > 7) isOld = true;
  }

  if (!st.persisted && isOld) {
    warnEl.style.display = 'block';
    warnEl.textContent = t('storageWarning');
  } else {
    warnEl.style.display = 'none';
  }
}

async function handleRequestStorage() {
  const success = await requestPersistentStorage();
  if (!success) {
    const warnEl = document.getElementById('storageWarnBox');
    if (warnEl) {
      warnEl.style.display = 'block';
      warnEl.textContent = t('storageDeniedMsg');
    }
  }
  updateStorageSettingsUI();
}

const CLUSTER_RADIUS_PX = 20;

function distanceMeters(lat1, lon1, lat2, lon2) {
  const avgLat = (lat1 + lat2) / 2;
  const mLat = 111320;
  const mLon = 111320 * Math.cos(avgLat * Math.PI / 180);
  const dx = (lon2 - lon1) * mLon;
  const dy = (lat2 - lat1) * mLat;
  return Math.hypot(dx, dy);
}

function clusterScreenPoints(points, radiusPx) {
  const clusters = [];
  if (!points || points.length === 0) return clusters;
  
  let originX = null, originY = null;
  const cellSize = radiusPx;
  const grid = new Map();
  
  const getCell = (x, y) => `${Math.floor((x - originX) / cellSize)},${Math.floor((y - originY) / cellSize)}`;

  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    if (!isFinite(p.x) || !isFinite(p.y)) continue;
    if (originX === null) {
      originX = p.x;
      originY = p.y;
    }
    
    const cx = Math.floor((p.x - originX) / cellSize);
    const cy = Math.floor((p.y - originY) / cellSize);
    
    let closestCluster = null;
    let minDist = radiusPx + 0.001;
    
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        const cellKey = `${cx + dx},${cy + dy}`;
        const cellClusters = grid.get(cellKey);
        if (cellClusters) {
          for (let j = 0; j < cellClusters.length; j++) {
            const c = cellClusters[j];
            const dist = Math.hypot(p.x - c.x, p.y - c.y);
            if (dist <= radiusPx && dist < minDist) {
              minDist = dist;
              closestCluster = c;
            }
          }
        }
      }
    }
    
    if (closestCluster) {
      const oldCellKey = getCell(closestCluster.x, closestCluster.y);
      const n = closestCluster.count;
      closestCluster.x = (closestCluster.x * n + p.x) / (n + 1);
      closestCluster.y = (closestCluster.y * n + p.y) / (n + 1);
      closestCluster.count++;
      closestCluster.members.push(p.id);
      
      const newCellKey = getCell(closestCluster.x, closestCluster.y);
      if (oldCellKey !== newCellKey) {
        const oldList = grid.get(oldCellKey);
        const idx = oldList.indexOf(closestCluster);
        if (idx > -1) oldList.splice(idx, 1);
        if (!grid.has(newCellKey)) grid.set(newCellKey, []);
        grid.get(newCellKey).push(closestCluster);
      }
    } else {
      const newCluster = { x: p.x, y: p.y, count: 1, members: [p.id] };
      clusters.push(newCluster);
      const cellKey = getCell(p.x, p.y);
      if (!grid.has(cellKey)) grid.set(cellKey, []);
      grid.get(cellKey).push(newCluster);
    }
  }
  return clusters;
}

function hitTestClusters(clusters, x, y, hitRadiusPx) {
  let closest = null;
  let minDist = hitRadiusPx + 0.001;
  for (let i = 0; i < clusters.length; i++) {
    const c = clusters[i];
    const d = Math.hypot(c.x - x, c.y - y);
    if (d <= hitRadiusPx && d < minDist) {
      minDist = d;
      closest = c;
    }
  }
  return closest;
}

function canSeparateCluster(members, radiusPx, minMpp) {
  if (members.length < 2) return false;
  let maxDist = 0;
  for (let i = 0; i < members.length; i++) {
    for (let j = i + 1; j < members.length; j++) {
      const d = distanceMeters(members[i].lat, members[i].lon, members[j].lat, members[j].lon);
      if (d > maxDist) maxDist = d;
    }
  }
  return (maxDist / minMpp) > radiusPx;
}

// CAMBIO: Excluir las fotos explícitamente para ensamblarlas después y no saturar RAM
async function buildBackupObject(includeOverlays) {
  const stores = Array.from(DB.objectStoreNames);
  const data = {};
  const counts = {};
  for (const store of stores) {
    if (!includeOverlays && store === 'map_overlays') continue;
    if (store === 'photos') continue;
    const records = await dbGetAll(store);
    data[store] = records;
    counts[store] = records.length;
  }
  const settings = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith('geo_') && key !== 'geo_last_backup') {
      settings[key] = localStorage.getItem(key);
    }
  }
  return {
    app: 'GeoField Core',
    format_version: 1,
    db_version: DB.version,
    exported_at: nowIso(),
    counts,
    settings,
    data
  };
}

// CAMBIO: Nueva función para construir Blob usando partes y FileReader
async function buildBackupBlob({ includeOverlays, includePhotos, onProgress }) {
  const baseObj = await buildBackupObject(includeOverlays);
  const allPhotos = includePhotos ? await dbGetAll('photos') : [];
  if (includePhotos) baseObj.counts.photos = allPhotos.length;

  const parts = [];
  const preData = { ...baseObj };
  delete preData.data;
  let jsonStart = JSON.stringify(preData);
  jsonStart = jsonStart.slice(0, -1) + ',"data":{';
  parts.push(jsonStart);

  const dataKeys = Object.keys(baseObj.data);
  let firstStore = true;
  for (const key of dataKeys) {
    if (!firstStore) parts.push(',');
    parts.push(JSON.stringify(key) + ':' + JSON.stringify(baseObj.data[key]));
    firstStore = false;
  }

  if (includePhotos) {
    if (!firstStore) parts.push(',');
    parts.push('"photos":[');
    for (let i = 0; i < allPhotos.length; i++) {
      if (onProgress) onProgress(i + 1, allPhotos.length);
      const p = allPhotos[i];
      const b64 = await blobToBase64(p.blob);
      const pCopy = { ...p, blobBase64: b64, blobType: p.blob.type || 'image/jpeg' };
      delete pCopy.blob;
      parts.push((i > 0 ? ',' : '') + JSON.stringify(pCopy));
    }
    parts.push(']');
  }
  parts.push('}}');
  return new Blob(parts, { type: 'application/json' });
}

function validateBackupObject(obj) {
  const res = { ok: true, errors: [], warnings: [], summary: {} };
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) {
    res.errors.push("El archivo no es un objeto JSON válido.");
    res.ok = false;
    return res;
  }
  if (obj.app !== 'GeoField Core') {
    res.errors.push("La firma de la aplicación (app) no coincide con 'GeoField Core'.");
    res.ok = false;
  }
  if (!Number.isInteger(obj.format_version) || obj.format_version > 1) {
    res.errors.push("La versión del formato no es válida o es superior a la soportada (1).");
    res.ok = false;
  }
  if (!obj.data || typeof obj.data !== 'object') {
    res.errors.push("El objeto carece de la propiedad principal 'data'.");
    res.ok = false;
    return res;
  }
  // Todo almacén presente en el archivo debe ser un arreglo
  for (const key of Object.keys(obj.data)) {
    if (!Array.isArray(obj.data[key])) {
      res.errors.push(`El almacén de datos '${key}' no es un arreglo válido.`);
      res.ok = false;
    }
  }
  if (!res.ok) return res;
 
  const campIds = new Set();
  const statIds = new Set();
  for (const store in obj.data) {
    res.summary[store] = obj.data[store].length;
    for (const record of obj.data[store]) {
      if (!record || typeof record !== 'object' || !record.id) {
        res.errors.push(`Se encontró un registro sin 'id' en el almacén '${store}'.`);
        res.ok = false;
      } else {
        if (store === 'campaigns') campIds.add(record.id);
        if (store === 'stations') statIds.add(record.id);
      }
    }
  }
  if (obj.data.stations) {
    for (const s of obj.data.stations) {
      if (s && s.campaignId && !campIds.has(s.campaignId)) {
        res.warnings.push(`La estación ${s.id} referencia a una campaña inexistente en este respaldo.`);
      }
    }
  }
  if (obj.data.measurements) {
    for (const m of obj.data.measurements) {
      if (m && m.stationId && !statIds.has(m.stationId)) {
        res.warnings.push(`La medición ${m.id} referencia a una estación inexistente en este respaldo.`);
      }
    }
  }
  return res;
}
 
async function importFullBackup(file, mode, overwrite) {
  try {
    const text = await file.text();
    let obj;
    try {
      obj = JSON.parse(text);
    } catch (e) {
      alert("El archivo seleccionado no tiene un formato JSON válido.");
      return;
    }
    const validation = validateBackupObject(obj);
    if (!validation.ok) {
      alert("Error de validación del respaldo:\n\n- " + validation.errors.join('\n- '));
      return;
    }
    if (validation.warnings.length > 0) {
      console.warn("Advertencias durante la validación:", validation.warnings);
    }
 
    const dbStores = Array.from(DB.objectStoreNames);
    const storesInFile = Object.keys(obj.data);
    const validStores = storesInFile.filter(s => dbStores.includes(s) && Array.isArray(obj.data[s]));
    storesInFile.filter(s => !validStores.includes(s)).forEach(s => console.warn(`Almacén ignorado (no existe en DB): ${s}`));
    if (validStores.length === 0) {
      alert("El respaldo no contiene almacenes compatibles con esta versión.");
      return;
    }
 
    if (mode === 'replace') {
      // CAMBIO: Aviso de pérdida de fotos actuales
      const hasPhotos = obj.data.photos && obj.data.photos.length > 0;
      const currentPhotos = await dbGetAll('photos');
      if (!hasPhotos && currentPhotos.length > 0) {
        if (!confirm(t('replaceNoPhotosWarn'))) {
          toast("Restauración cancelada.");
          return;
        }
      }
      
      const confirmText = prompt("Escribe REEMPLAZAR para confirmar que deseas borrar toda tu base de datos actual y cargar la del archivo.");
      if (confirmText !== 'REEMPLAZAR') {
        toast("Restauración cancelada.");
        return;
      }
      const currentData = await buildBackupObject(true);
      downloadFile(JSON.stringify(currentData), `geofield_antes_de_restaurar_${dateStamp()}.json`, 'application/json');
      toast("Copia de seguridad previa descargada.");
    }
 
    const transaction = DB.transaction(validStores, 'readwrite');
    let added = 0, updated = 0, skipped = 0;
    const txPromise = new Promise((resolve, reject) => {
      transaction.oncomplete = () => resolve();
      transaction.onerror = () => reject(transaction.error);
      transaction.onabort = () => reject(transaction.error || new Error("Transacción abortada."));
    });
 
    try {
      for (const storeName of validStores) {
        const store = transaction.objectStore(storeName);
        if (mode === 'replace') store.clear();
        for (const record of obj.data[storeName]) {
          // CAMBIO: Decodificar el base64 a Blob antes de insertar
          if (storeName === 'photos' && record.blobBase64) {
             record.blob = base64ToBlob(record.blobBase64, record.blobType);
             delete record.blobBase64;
             delete record.blobType;
          }

          if (mode === 'replace') {
            store.put(record);
            added++;
          } else {
            const req = store.get(record.id);
            req.onsuccess = (e) => {
              if (e.target.result) {
                if (overwrite) { store.put(record); updated++; } else { skipped++; }
              } else {
                store.put(record); added++;
              }
            };
            req.onerror = () => { transaction.abort(); };
          }
        }
      }
    } catch (loopErr) {
      try { transaction.abort(); } catch (_) {}
      await txPromise.catch(() => {});
      throw loopErr;
    }
 
    await txPromise;
    
    // CAMBIO: Limpiar fotos huérfanas
    let omittedPhotos = 0;
    if (validStores.includes('photos')) {
      const allSts = await dbGetAll('stations');
      const allMeas = await dbGetAll('measurements');
      const validOwners = new Set([...allSts.map(s => s.id), ...allMeas.map(m => m.id)]);
      const finalPhotos = await dbGetAll('photos');
      for (const p of finalPhotos) {
        if (p.ownerId && !validOwners.has(p.ownerId)) {
          await dbDelete('photos', p.id);
          omittedPhotos++;
        }
      }
    }
 
    let settingsRestored = false;
    if (mode === 'replace' && obj.settings && typeof obj.settings === 'object') {
      for (const [k, v] of Object.entries(obj.settings)) {
        if (k.startsWith('geo_')) localStorage.setItem(k, v);
      }
      settingsRestored = true;
    }
 
    // CAMBIO: Actualizar resumen alertando de las fotos huérfanas
    let msg = `Restauración completada con éxito.\nResumen de operaciones:\nAgregados: ${added}\nActualizados: ${updated}\nOmitidos: ${skipped}`;
    if (obj.data.photos) {
      msg += `\nFotos restauradas: ${obj.data.photos.length - omittedPhotos}\nFotos omitidas (sin estación/medición base): ${omittedPhotos}`;
    }
    alert(msg);
    
    if (settingsRestored) {
      location.reload();
    } else {
      render();
    }
  } catch (err) {
    console.error(err);
    alert("Error durante la importación (no se modificó ningún dato): " + err.message);
  }
}

// CAMBIO: Preparar el contexto de nombres, orden y alcance compartido.
async function getPhotoExportContext() {
  const scoped = await getFilteredData();
  const allStations = await dbGetAll('stations');
  // CAMBIO: Resolver campañas antes de las estaciones, de forma estable por ID.
  const stationNames = {};
  const campaignNames = {};
  const usedCampaignNames = new Set();
  const usedStationNames = new Map();
  const safe = value => {
    const v = String(value ?? '').replace(/[/\\:*?"<>|\s]/g, '_');
    return !v || v === '.' || v === '..' ? '_' : v;
  };
  const lexCompare = (a, b) => a < b ? -1 : a > b ? 1 : 0;

  // CAMBIO: Truncar cada base a 30 caracteres antes del sufijo de colisión.
  Object.values(scoped.campMap).sort((a, b) => lexCompare(String(a.id), String(b.id))).forEach(camp => {
    const base = Array.from(safe(camp.name || camp.id)).slice(0, 30).join('');
    let result = base;
    let suffix = 2;
    while (usedCampaignNames.has(result)) result = base + '-' + suffix++;
    usedCampaignNames.add(result);
    campaignNames[camp.id] = result;
  });

  allStations.slice().sort((a, b) => lexCompare(String(a.id), String(b.id))).forEach(st => {
    // CAMBIO: Las colisiones de estación se resuelven dentro de cada campaña.
    if (!usedStationNames.has(st.campaignId)) usedStationNames.set(st.campaignId, new Set());
    const usedNames = usedStationNames.get(st.campaignId);
    const base = Array.from(safe(st.name || st.id)).slice(0, 30).join('');
    let result = base;
    let suffix = 2;
    while (usedNames.has(result)) result = base + '-' + suffix++;
    usedNames.add(result);
    stationNames[st.id] = result;
  });

  const measById = {};
  const measIndices = {};
  const grouped = new Map();

  scoped.measurements.forEach(m => {
    measById[m.id] = m;
    const key = JSON.stringify([m.stationId, m.type]);
    if (!grouped.has(key)) grouped.set(key, []);
    grouped.get(key).push(m);
  });

  const dateCompare = (a, b, prop) => {
    const ax = Date.parse(a[prop]);
    const bx = Date.parse(b[prop]);
    const av = Number.isFinite(ax) ? ax : 0;
    const bv = Number.isFinite(bx) ? bx : 0;
    return av - bv || lexCompare(String(a.id), String(b.id));
  };

  grouped.forEach(group => {
    group.sort((a, b) => dateCompare(a, b, 'timestamp'));
    group.forEach((m, i) => { measIndices[m.id] = i + 1; });
  });

  const scopedIds = new Set(scoped.stations.map(s => s.id));
  const photos = await new Promise((resolve, reject) => {
    const result = [];
    const request = tx('photos', 'readonly').openCursor();

    request.onsuccess = () => {
      const cursor = request.result;
      if (!cursor) {
        resolve(result);
        return;
      }

      const p = cursor.value;
      if (scopedIds.has(p.stationId)) {
        result.push({
          id: p.id,
          ownerKind: p.ownerKind,
          ownerId: p.ownerId,
          stationId: p.stationId,
          createdAt: p.createdAt,
          width: p.width,
          height: p.height,
          bytes: p.blob instanceof Blob ? p.blob.size : Number(p.bytes) || 0
        });
      }
      cursor.continue();
    };

    request.onerror = () => reject(request.error);
  });

  const photoIndices = {};
  const owned = new Map();

  photos.forEach(p => {
    const key = JSON.stringify([p.ownerKind, p.ownerId]);
    if (!owned.has(key)) owned.set(key, []);
    owned.get(key).push(p);
  });

  owned.forEach(group => {
    group.sort((a, b) => dateCompare(a, b, 'createdAt'));
    group.forEach((p, i) => { photoIndices[p.id] = i + 1; });
  });

  const ctx = {
    ...scoped,
    photos,
    stationNames,
    // CAMBIO: Compartir las campañas saneadas con ZIP, CSV y GeoJSON.
    campaignNames,
    measById,
    measIndices,
    photoIndices
  };

  photos.sort((a, b) => lexCompare(photoFileName(a, ctx), photoFileName(b, ctx)));
  return ctx;
}


// CAMBIO: Generar nombres puros, deterministas y compartidos.
function photoFileName(photo, ctx) {
  const safe = value => {
    const result = String(value ?? '').replace(/[/\\:*?"<>|\s]/g, '_');
    return !result || result === '.' || result === '..' ? '_' : result;
  };

  const station = ctx.stationNames[photo.stationId];
  // CAMBIO: Usar el segmento de campaña calculado en el contexto compartido.
  const campaign = ctx.campaignNames[ctx.stMap[photo.stationId]?.campaignId];
  const n = ctx.photoIndices[photo.id];

  if (!station || !Number.isInteger(n) || n < 1) {
    throw new Error('Foto sin estación o índice: ' + photo.id);
  }
  // CAMBIO: Detectar estaciones sin campaña válida antes de nombrar un archivo.
  if (!campaign) throw new Error(t('photoExportMissingCampaign'));

  const pad = value => String(value).padStart(2, '0');

  if (photo.ownerKind === 'station') {
    if (photo.ownerId !== photo.stationId) {
      throw new Error('Propietario de foto de estación incoherente: ' + photo.id);
    }
    // CAMBIO: Ruta Campaña/Estación y prefijo Campaña_Estación.
    return campaign + '/' + station + '/' + campaign + '_' + station + '_estacion_f' + pad(n) + '.jpg';
  }

  if (photo.ownerKind === 'measurement') {
    const m = ctx.measById[photo.ownerId];
    const index = ctx.measIndices[photo.ownerId];

    if (!m || m.stationId !== photo.stationId || !Number.isInteger(index)) {
      throw new Error('Foto sin medición válida: ' + photo.id);
    }

    // CAMBIO: Conservar el sufijo de tipo, medición y foto.
    return campaign + '/' + station + '/' + campaign + '_' + station + '_' + safe(m.type) + '_m' + pad(index) + '_f' + pad(n) + '.jpg';
  }

  throw new Error('Tipo de propietario de foto no reconocido: ' + photo.ownerKind);
}


// CAMBIO: CRC-32 IEEE propio sobre los bytes originales.
function photoZipCRC32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    crc ^= bytes[i];
    for (let j = 0; j < 8; j++) {
      crc = (crc >>> 1) ^ ((crc & 1) ? 0xEDB88320 : 0);
    }
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}


// CAMBIO: Construir ZIP clásico sin compresión, ZIP64 ni bibliotecas.
async function buildPhotoZip(ctx, onProgress) {
  const maxBytes = 3.5 * 1024 * 1024 * 1024;
  if (ctx.photos.length > 60000) throw new Error(t('zipLimitError'));

  const byteTotal = ctx.photos.reduce((sum, p) => sum + p.bytes, 0);
  if (byteTotal > maxBytes) throw new Error(t('zipLimitError'));

  const encoder = new TextEncoder();
  const parts = [];
  const centralParts = [];
  let offset = 0;
  let entries = 0;
  let centralSize = 0;

  const dosDateTime = iso => {
    const parsed = new Date(iso);
    const valid = Number.isFinite(parsed.getTime());
    const year = valid ? Math.max(1980, Math.min(2107, parsed.getUTCFullYear())) : 1980;
    const month = valid ? parsed.getUTCMonth() + 1 : 1;
    const day = valid ? parsed.getUTCDate() : 1;
    const hour = valid ? parsed.getUTCHours() : 0;
    const minute = valid ? parsed.getUTCMinutes() : 0;
    const second = valid ? parsed.getUTCSeconds() : 0;

    return {
      date: ((year - 1980) << 9) | (month << 5) | day,
      time: (hour << 11) | (minute << 5) | Math.floor(second / 2)
    };
  };

  const addEntry = async (filename, data, date) => {
    const nameBytes = encoder.encode(filename);

    if (nameBytes.length > 65535 || !(data instanceof Blob)) {
      throw new Error(t('zipLimitError'));
    }

    const length = data.size;
    if (length > 0xFFFFFFFF) throw new Error(t('zipLimitError'));

    const crc = photoZipCRC32(new Uint8Array(await data.arrayBuffer()));
    const dos = dosDateTime(date);

    const local = new Uint8Array(30 + nameBytes.length);
    const lh = new DataView(local.buffer);

    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true);
    lh.setUint16(10, dos.time, true);
    lh.setUint16(12, dos.date, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, length, true);
    lh.setUint32(22, length, true);
    lh.setUint16(26, nameBytes.length, true);
    lh.setUint16(28, 0, true);
    local.set(nameBytes, 30);

    const central = new Uint8Array(46 + nameBytes.length);
    const ch = new DataView(central.buffer);

    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true);
    ch.setUint16(12, dos.time, true);
    ch.setUint16(14, dos.date, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, length, true);
    ch.setUint32(24, length, true);
    ch.setUint16(28, nameBytes.length, true);
    ch.setUint16(30, 0, true);
    ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true);
    ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true);
    ch.setUint32(42, offset, true);
    central.set(nameBytes, 46);

    offset += local.length + length;
    centralSize += central.length;

    if (offset + centralSize + 22 > maxBytes) {
      throw new Error(t('zipLimitError'));
    }

    parts.push(local, data);
    centralParts.push(central);
    entries++;
  };

  const indexRows = [[
    'Photo_File',
    'Campaign',
    'Station_ID',
    'Owner_Kind',
    'Meas_Type',
    'Meas_Index',
    'Photo_Index',
    'Created_At',
    'Width',
    'Height',
    'Bytes'
  ].join(',')];

  for (let i = 0; i < ctx.photos.length; i++) {
    const p = ctx.photos[i];
    const file = photoFileName(p, ctx);
    const measured = p.ownerKind === 'measurement' ? ctx.measById[p.ownerId] : null;
    const station = ctx.stMap[p.stationId];

    if (!station) throw new Error('Estación inexistente: ' + p.stationId);

    indexRows.push([
      file,
      ctx.campMap[station.campaignId]?.name || '',
      station.id,
      p.ownerKind,
      measured ? measured.type : '',
      measured ? String(ctx.measIndices[p.ownerId]).padStart(2, '0') : '',
      String(ctx.photoIndices[p.id]).padStart(2, '0'),
      p.createdAt || '',
      p.width ?? '',
      p.height ?? '',
      p.bytes
    ].map(csvEsc).join(','));

    const original = await dbGet('photos', p.id);
    if (!(original?.blob instanceof Blob)) {
      throw new Error(t('zipReadError'));
    }

    if (original.blob.size !== p.bytes) {
      throw new Error('El tamaño de una foto cambió durante la exportación: ' + p.id);
    }

    await addEntry(file, original.blob, p.createdAt);
    if (onProgress) onProgress(i + 1, ctx.photos.length);
  }

  const indexBlob = new Blob(
    ['\uFEFF' + indexRows.join('\r\n')],
    { type: 'text/csv;charset=utf-8' }
  );
  await addEntry('indice_fotos.csv', indexBlob, '1980-01-01T00:00:00.000Z');

  const centralOffset = offset;
  for (const centralPart of centralParts) parts.push(centralPart);

  const end = new Uint8Array(22);
  const eocd = new DataView(end.buffer);

  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(4, 0, true);
  eocd.setUint16(6, 0, true);
  eocd.setUint16(8, entries, true);
  eocd.setUint16(10, entries, true);
  eocd.setUint32(12, centralSize, true);
  eocd.setUint32(16, centralOffset, true);
  eocd.setUint16(20, 0, true);
  parts.push(end);

  const archive = new Blob(parts, { type: 'application/zip' });
  if (archive.size > maxBytes) throw new Error(t('zipLimitError'));
  return archive;
}


// CAMBIO: Actualizar disponibilidad, cantidad y bytes reales del ZIP.
async function refreshPhotoZipButton() {
  const button = document.getElementById('btnExportPhotosZip');
  const stats = document.getElementById('photoZipButtonStats');

  if (!button || !stats || button.dataset.busy === '1') return;

  const scope = document.getElementById('exportCampSelect')?.value || 'ALL';
  button.disabled = true;

  try {
    const ctx = await getPhotoExportContext();
    if (document.getElementById('exportCampSelect')?.value !== scope || button.dataset.busy === '1') return;

    const bytes = ctx.photos.reduce((sum, p) => sum + p.bytes, 0);
    stats.textContent = formatPhotoZipStats(ctx.photos.length, bytes);
    button.disabled = ctx.photos.length === 0;
  } catch (err) {
    const progress = document.getElementById('photoZipProgress');
    if (progress) {
      progress.textContent = t('zipExportError').replace('{error}', err.message);
    }
  }
}


// CAMBIO: Exportar únicamente después de construir correctamente el ZIP completo.
async function exportPhotosZIP() {
  const button = document.getElementById('btnExportPhotosZip');
  const status = document.getElementById('photoZipProgress');

  if (!button || button.disabled || button.dataset.busy === '1') return;

  button.dataset.busy = '1';
  button.disabled = true;

  try {
    const ctx = await getPhotoExportContext();
    if (!ctx.photos.length) throw new Error(t('zipEmpty'));

    if (
      ctx.photos.length > 60000 ||
      ctx.photos.reduce((sum, p) => sum + p.bytes, 0) > 3.5 * 1024 * 1024 * 1024
    ) {
      throw new Error(t('zipLimitError'));
    }

    const bytes = ctx.photos.reduce((sum, p) => sum + p.bytes, 0);
    if (bytes > 150 * 1024 * 1024 && !confirm(t('zipLargeConfirm'))) return;

    const zip = await buildPhotoZip(ctx, (i, n) => {
      if (status) {
        status.textContent = t('zipProgress')
          .replace('{i}', i)
          .replace('{n}', n);
      }
    });

    const url = URL.createObjectURL(zip);

    try {
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = 'GeoFieldCore_fotos_' + dateStamp() + '.zip';
      document.body.appendChild(anchor);

      try {
        anchor.click();
      } finally {
        anchor.remove();
      }
    } finally {
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    if (status) status.textContent = t('zipExportDone');
  } catch (err) {
    console.error(err);
    if (status) {
      status.textContent = t('zipExportError').replace('{error}', err.message);
    }
    alert(t('zipExportError').replace('{error}', err.message));
  } finally {
    button.dataset.busy = '0';
    await refreshPhotoZipButton();
  }
}


/* =========================================================
   IMPORTADOR Y EXPORTADOR DE ARCHIVOS
   ========================================================= */
async function renderExport() {

  const meas = await dbGetAll('measurements');

  const lastBackup = localStorage.getItem('geo_last_backup');
  const lastBackupPhotos = localStorage.getItem('geo_last_backup_photos');

     const pStr = lastBackupPhotos === '1' ? t('backupWithPhotos') : t('backupWithoutPhotos');
     lastBackupStr = fmtDate(lastBackup) + ' (' + pStr + ')';
  }

  if (navigator.storage && navigator.storage.persisted) {
    const isPersisted = await navigator.storage.persisted();
    persistMsg = isPersisted ? '✅ Seguro (Activado)' : '❌ Volátil (Podría limpiarse)';

function csvEsc(v){ v=String(v??''); if(/[",\n]/.test(v)){ v='"'+v.replace(/"/g,'""')+'"'; } return v; }

async function getFilteredData(){
  const scope = document.getElementById('exportCampSelect')?.value || 'ALL';
  let stations = await dbGetAll('stations');
  let camps = await dbGetAll('campaigns');
  const campMap={}; camps.forEach(c=>campMap[c.id]=c);

  if(scope !== 'ALL'){
    stations = stations.filter(s=>s.campaignId === scope);
  }
  const stMap={}; stations.forEach(s=>stMap[s.id]=s);
  const allMeas = await dbGetAll('measurements');
  const measurements = allMeas.filter(m=>stMap[m.stationId]);
  return { stations, measurements, stMap, campMap };
}

async function exportCSV(){
  // CAMBIO: Un único contexto garantiza nombres y alcance idénticos al ZIP.
  const photoCtx = await getPhotoExportContext();
  const { measurements, stations, stMap, campMap } = photoCtx;
  const photosByOwner = new Map();
  const stationPhotosByOwner = new Map();
  photoCtx.photos.forEach(p => {
    // CAMBIO: Distinguir fotografías de medición de fotografías propias de estación.
    const target = p.ownerKind === 'station' ? stationPhotosByOwner : photosByOwner;
    if (p.ownerKind !== 'station' && p.ownerKind !== 'measurement') return;
    if (!target.has(p.ownerId)) target.set(p.ownerId, []);
    target.get(p.ownerId).push(photoFileName(p, photoCtx));
  });

  // CAMBIO: Las 25 columnas originales y Photo_* permanecen en su posición.
  const headers=['Campaign','Station_ID','Timestamp','Lat','Lon','Alt','UTM_Zone','UTM_Hemisphere','UTM_Easting','UTM_Northing','Struct_Type','Kind','Strike','Dip','DipDir','Trend','Plunge','Rake','Rake_Quad','Sense','True_Thickness','Vein_Thick','Vein_Unit','Alteration','Notes','Photo_Count','Photo_Files','Station_Photo_Count','Station_Photo_Files','Record_Type'];
  const rows=[headers.join(',')];
  measurements.forEach(m=>{
    const st=stMap[m.stationId]||{};
    const camp=campMap[st.campaignId]||{};
    const u = utmLabel(st.lat, st.lon);
    const ownPhotos = photosByOwner.get(m.id) || [];
    // CAMBIO: Agregar fotos propias de estación y tipo al final.
    const stationPhotos = stationPhotosByOwner.get(st.id) || [];
    rows.push([
      csvEsc(camp.name||''), csvEsc(st.name||st.id||''), csvEsc(m.timestamp||st.timestamp||''),
      st.lat??'', st.lon??'', st.alt??'',
      u? u.zoneNumber:'', u? u.hemisphere:'', u? u.easting:'', u? u.northing:'',
      csvEsc(m.subtype||m.type), csvEsc(m.structKind||''),
      m.strike!=null?roundInt(m.strike):'', m.dip!=null?roundInt(m.dip):'', m.dipDir!=null?roundInt(m.dipDir):'',
      m.trend!=null?roundInt(m.trend):'', m.plunge!=null?roundInt(m.plunge):'', m.rake!=null?roundInt(m.rake):'', csvEsc(m.rakeQuadrant||''),
      csvEsc(m.sense||''), m.trueThickness!=null?roundInt(m.trueThickness):'', m.veinThickness!=null?roundInt(m.veinThickness):'', csvEsc(m.veinUnit||''),
      csvEsc((m.alteration||[]).join('; ')), csvEsc(m.notes||''),
      ownPhotos.length, csvEsc(ownPhotos.join(' | ')),
      stationPhotos.length, csvEsc(stationPhotos.join(' | ')), 'measurement'
    ].join(','));
  });
  // CAMBIO: Añadir una fila por estación sin mediciones, incluso sin coordenadas.
  const measuredStationIds = new Set(measurements.map(m => m.stationId));
  stations.filter(st => !measuredStationIds.has(st.id)).forEach(st => {
    const camp = campMap[st.campaignId] || {};
    const u = isValidLatLon(st.lat, st.lon) ? utmLabel(st.lat, st.lon) : null;
    const stationPhotos = stationPhotosByOwner.get(st.id) || [];
    rows.push([
      csvEsc(camp.name||''), csvEsc(st.name||st.id||''), csvEsc(st.timestamp||''),
      st.lat??'', st.lon??'', st.alt??'',
      u? u.zoneNumber:'', u? u.hemisphere:'', u? u.easting:'', u? u.northing:'',
      ...Array(14).fill(''), csvEsc(st.notes||''),
      0, '', stationPhotos.length, csvEsc(stationPhotos.join(' | ')), 'station'
    ].join(','));
  });
  downloadFile('\uFEFF'+rows.join('\r\n'), 'GeoFieldCore_'+dateStamp()+'.csv', 'text/csv;charset=utf-8');
  // CAMBIO: Mensaje traducido al idioma activo.
  toast(t('photoCsvExportDone'));
}

async function exportGeoJSON(){
  // CAMBIO: Contexto compartido con CSV y ZIP.
  const photoCtx = await getPhotoExportContext();
  const { measurements, stations, stMap, campMap } = photoCtx;
  const photoNamesByMeasurement = new Map();
  const photoNamesByStation = new Map();
  photoCtx.photos.forEach(p => {
    // CAMBIO: Evitar mezclar fotos de medición y de estación.
    const target = p.ownerKind === 'station' ? photoNamesByStation : photoNamesByMeasurement;
    if (p.ownerKind !== 'station' && p.ownerKind !== 'measurement') return;
    if (!target.has(p.ownerId)) target.set(p.ownerId, []);
    target.get(p.ownerId).push(photoFileName(p, photoCtx));
  });

  const features=measurements.filter(m=>{ const s=stMap[m.stationId]; return s && s.lat!=null && s.lon!=null; }).map(m=>{
    const st=stMap[m.stationId];
    const camp=campMap[st.campaignId]||{};
    const u = utmLabel(st.lat, st.lon);
    // CAMBIO: Photo_* solo de esta medición y Station_Photo_* de la estación.
    const ownPhotos = photoNamesByMeasurement.get(m.id) || [];
    const stationPhotos = photoNamesByStation.get(st.id) || [];
    return {
      type:'Feature',
      geometry:{ type:'Point', coordinates:[Number(st.lon), Number(st.lat), st.alt!=null?Number(st.alt):0] },
      properties:{
        Campaign: camp.name||null, Station_ID: st.name||st.id, Timestamp: m.timestamp||st.timestamp,
        UTM_Zone: u? u.zoneNumber:null, UTM_Hemisphere: u? u.hemisphere:null,
        UTM_Easting: u? u.easting:null, UTM_Northing: u? u.northing:null,
        Struct_Type: m.subtype||m.type, Kind: m.structKind||null,
        Strike: m.strike!=null?roundInt(m.strike):null, Dip: m.dip!=null?roundInt(m.dip):null, DipDir: m.dipDir!=null?roundInt(m.dipDir):null,
        Trend: m.trend!=null?roundInt(m.trend):null, Plunge: m.plunge!=null?roundInt(m.plunge):null, Rake: m.rake!=null?roundInt(m.rake):null, Rake_Quad: m.rakeQuadrant||null,

        Vein_Thick: m.veinThickness!=null?roundInt(m.veinThickness):null, Vein_Unit: m.veinUnit||null,
        Alteration: (m.alteration||[]).join('; ')||null, Notes: m.notes||null,
        Photo_Count: ownPhotos.length,
        Photo_Files: ownPhotos.join(' | '),
        // CAMBIO: Propiedades añadidas exclusivamente al final.
        Station_Photo_Count: stationPhotos.length,
        Station_Photo_Files: stationPhotos.join(' | '),
        Record_Type: 'measurement'
      }
    };
  });

  // CAMBIO: Conservar estaciones sin mediciones solo con coordenadas válidas.
  const measuredStationIds = new Set(measurements.map(m => m.stationId));
  stations.filter(st => !measuredStationIds.has(st.id) && isValidLatLon(st.lat, st.lon)).forEach(st => {
    const camp = campMap[st.campaignId] || {};
    const u = utmLabel(st.lat, st.lon);
    const stationPhotos = photoNamesByStation.get(st.id) || [];
    features.push({
      type:'Feature',
      geometry:{ type:'Point', coordinates:[Number(st.lon), Number(st.lat), st.alt!=null?Number(st.alt):0] },
      properties:{
        Campaign: camp.name||null, Station_ID: st.name||st.id, Timestamp: st.timestamp,
        UTM_Zone: u? u.zoneNumber:null, UTM_Hemisphere: u? u.hemisphere:null,
        UTM_Easting: u? u.easting:null, UTM_Northing: u? u.northing:null,
        Struct_Type:null, Kind:null,
        Strike:null, Dip:null, DipDir:null,
        Trend:null, Plunge:null, Rake:null, Rake_Quad:null,
        Sense:null, True_Thickness:null,
        Vein_Thick:null, Vein_Unit:null,
        Alteration:null, Notes:st.notes||null,
        Photo_Count:0, Photo_Files:'',
        Station_Photo_Count:stationPhotos.length,
        Station_Photo_Files:stationPhotos.join(' | '),
        Record_Type:'station'
      }
    });
  });
  downloadFile(JSON.stringify({ type:'FeatureCollection', features },null,2), 'GeoFieldCore_'+dateStamp()+'.geojson', 'application/geo+json');
  // CAMBIO: Mensaje traducido al idioma activo.
  toast(t('photoGeoJSONExportDone'));
}

function isValidLatLon(lat, lon) {
  if (typeof lat !== 'number' || typeof lon !== 'number') return false;
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return false;
  if (lat < -90 || lat > 90) return false;
  if (lon < -180 || lon > 180) return false;
  return true;
}

// CAMBIO: Funciones puras para análisis de CSV y fechas
function splitCsvLine(line, delim) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    if (char === '"') {
      if (inQuotes && line[i + 1] === '"') { current += '"'; i++; }
      else { inQuotes = !inQuotes; }
    } else if (char === delim && !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += char;
    }
  }
  result.push(current);
  return result;
}

function detectDelimiter(headerLine) {
  const counts = { '\t': 0, ',': 0, ';': 0 };
  let inQuotes = false;
  for (let i = 0; i < headerLine.length; i++) {
    const char = headerLine[i];
    if (char === '"') {
      if (inQuotes && headerLine[i + 1] === '"') i++;
      else inQuotes = !inQuotes;
    } else if (!inQuotes && counts[char] !== undefined) {
      counts[char]++;
    }
  }
  let best = '\t';
  let max = counts['\t'];
  if (counts[','] > max) { best = ','; max = counts[',']; }
  if (counts[';'] > max) { best = ';'; max = counts[';']; }
  return best;
}

function normalizeField(s) {
  if (!s) return '';
  let res = s.replace(/^\uFEFF/, '').replace(/^[\s\u00A0]+|[\s\u00A0]+$/g, '');
  if (res.startsWith('"') && res.endsWith('"') && res.length >= 2) {
    res = res.slice(1, -1);
  }
  return res;
}

function parseFlexibleDate(str) {
  if (!str) return null;
  const s = str.trim();
  if (!s) return null;
  const m1 = s.match(/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})[T\s](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?/);
  if (m1) return new Date(m1[1], m1[2] - 1, m1[3], m1[4], m1[5], m1[6] || 0);
  const m2 = s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})[\sT](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?/);
  if (m2) return new Date(m2[3], m2[2] - 1, m2[1], m2[4], m2[5], m2[6] || 0);
  const m3 = s.match(/^(?:[A-Za-z]{3,4}\s+)?([A-Za-z]{3,4})\s+(\d{1,2})\s+(\d{1,2}):(\d{1,2}):(\d{1,2})\s+(\d{4})$/);
  if (m3) {
    const months = { jan: 0, ene: 0, feb: 1, mar: 2, apr: 3, abr: 3, may: 4, jun: 5, jul: 6, aug: 7, ago: 7, sep: 8, set: 8, oct: 9, nov: 10, dec: 11, dic: 11 };
    const mon = months[m3[1].toLowerCase().substring(0, 3)];
    if (mon !== undefined) return new Date(m3[6], mon, m3[2], m3[3], m3[4], m3[5]);
  }
  return null;
}

function looksLikeSeparatorMangled(raw) {
  if (typeof raw !== 'string') return false;
  // 1 a 3 dígitos seguidos de dos o más grupos ".ddd" (separador de miles)
  return /^[+-]?\d{1,3}(?:\.\d{3}){2,}$/.test(raw.trim());
}

function analyzeImportRows(rows) {
  const validRows = [];
  const flagged = [];
  
  for (const row of rows) {
    let isFlagged = false;
    let reason = '';
    
    // CAMBIO: Se añade la verificación para -1 en estructuras
    if (row.strikeVal === -1 || row.dipVal === -1 || row.dipAzVal === -1) {
      isFlagged = true;
      reason = t('reasonNoData');
    } else if (looksLikeSeparatorMangled(row.rawLat) || looksLikeSeparatorMangled(row.rawLon) || 
        looksLikeSeparatorMangled(row.rawX) || looksLikeSeparatorMangled(row.rawY)) {
      isFlagged = true;
      reason = 'separator_mangled';
    } else if (row.rawLat && row.rawLat.trim() !== '' && row.rawLon && row.rawLon.trim() !== '') {
      if (!isValidLatLon(row.parsedLat, row.parsedLon)) {
        isFlagged = true;
        reason = 'invalid_range';
      }
    }
    
    if (isFlagged) {
      flagged.push({ index: row.index, reason, rawLat: row.rawLat, rawLon: row.rawLon });
    } else {
      validRows.push(row.index);
    }
  }
  return { validRows, flagged };
}

  }).join('');

      <ul style="margin:8px 0 15px 0;padding-left:20px;color:var(--danger);">${examplesHtml}</ul>
      ${isAllInvalid ? `<p style="font-size:13px;color:var(--danger);margin-bottom:15px;font-weight:bold;">${t('importAllInvalid')}</p>` : ''}
      <div class="btn-row">
        <button class="btn ghost" id="btnImportCancel">${t('importCancel')}</button>
        ${!isAllInvalid ? `<button class="btn danger" id="btnImportProceed">${t('importValidOnly')}</button>` : ''}
      </div>
    </div>

  document.body.appendChild(modal);

  if (!isAllInvalid) {

    };
  }
}

async function handleFileImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const text = await file.text();
  const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
  if(lines.length < 2){ toast('Archivo vacío o sin datos'); return; }

  const campName = 'Importación_' + file.name.replace(/\.[^/.]+\$/, "");
  const campId = uid();

  const headerLine = lines[0];
  const delim = detectDelimiter(headerLine);
  const rawHeaders = splitCsvLine(headerLine, delim).map(h => normalizeField(h).toLowerCase());

  const getIdx = (patterns) => rawHeaders.findIndex(h => patterns.some(p => h.includes(p)));
  const iStrike = getIdx(['fault strike','strike']);
  const iDip = getIdx(['fault dip','dip']);
  const iDipAz = getIdx(['dipazimuth','dip azimuth','dip_azimuth','dip direction','dipdir']);
  const iTrend = getIdx(['striae trend','trend']);
  const iPlunge = getIdx(['striae plunge','plunge']);
  const iSense = getIdx(['sense of slip','sense']);
  const iFieldNo = getIdx(['field no.','station_id','station','estacion','name','localityname']);
  const iLat = getIdx(['latitude','lat']);
  const iLon = getIdx(['longitude','lon','long']);
  const iAlt = getIdx(['elevation','alt','altitude']);
  const iNotes = getIdx(['notes','nota']);
  const iEast = getIdx(['easting','east','x']);
  const iNorth = getIdx(['northing','north','y']);
  const iDate = getIdx(['timedate','date','fecha','timestamp']);

  const parsedRows = [];
  const rowsForAnalysis = [];
  let unparseableDateCount = 0;

  for(let i = 1; i < lines.length; i++){
    const cols = splitCsvLine(lines[i], delim).map(c => normalizeField(c));
    if(cols.length < 2) continue;

    const rawLat = (iLat >= 0 && cols[iLat]) ? cols[iLat] : '';
    const rawLon = (iLon >= 0 && cols[iLon]) ? cols[iLon] : '';
    const rawX = (iEast >= 0 && cols[iEast]) ? cols[iEast] : '';
    const rawY = (iNorth >= 0 && cols[iNorth]) ? cols[iNorth] : '';

    const latVal = rawLat ? parseFloat(rawLat) : null;
    const lonVal = rawLon ? parseFloat(rawLon) : null;
    const altVal = (iAlt >= 0 && cols[iAlt]) ? roundInt(parseFloat(cols[iAlt])) : null;
    const strikeVal = (iStrike >= 0 && cols[iStrike]) ? roundInt(parseFloat(cols[iStrike])) : null;
    const dipVal = (iDip >= 0 && cols[iDip]) ? roundInt(parseFloat(cols[iDip])) : null;
    const dipAzVal = (iDipAz >= 0 && cols[iDipAz]) ? roundInt(parseFloat(cols[iDipAz])) : null;
    
    let recordDate = null;
    if (iDate >= 0 && cols[iDate]) {
      const parsed = parseFlexibleDate(cols[iDate]);
      if (parsed) recordDate = parsed.toISOString();
      else unparseableDateCount++;
    }

    rowsForAnalysis.push({
      index: i, rawLat, rawLon, rawX, rawY, parsedLat: latVal, parsedLon: lonVal,
      strikeVal, dipVal, dipAzVal
    });

    const stName = (iFieldNo >= 0 && cols[iFieldNo]) ? cols[iFieldNo] : '';
    const trendVal = (iTrend >= 0 && cols[iTrend]) ? roundInt(parseFloat(cols[iTrend])) : null;
    const plungeVal = (iPlunge >= 0 && cols[iPlunge]) ? roundInt(parseFloat(cols[iPlunge])) : null;
    const senseVal = (iSense >= 0 && cols[iSense]) ? cols[iSense] : '';
    const noteVal = (iNotes >= 0 && cols[iNotes]) ? cols[iNotes] : '';

    parsedRows.push({
      index: i, stName, latVal, lonVal, altVal,
      strikeVal, dipVal, dipAzVal, trendVal, plungeVal, senseVal, noteVal, recordDate
    });
  }

  const analysis = analyzeImportRows(rowsForAnalysis);

  const doWrite = async (validIndices) => {
    let writtenCount = 0;
    const stationsCreated = {};

    await dbPut('campaigns', { id: campId, name: campName, timestamp: nowIso(), notes: `Importado desde ${file.name}` });

    for (const pr of parsedRows) {
      if (!validIndices.includes(pr.index)) continue;

      const finalStName = pr.stName ? pr.stName : `EST-${String(writtenCount + 1).padStart(2, '0')}`;
      const ts = pr.recordDate || nowIso();

      let stId = stationsCreated[finalStName];
      if (!stId) {
        stId = uid();
        stationsCreated[finalStName] = stId;
        await dbPut('stations', {
          id: stId, campaignId: campId, name: finalStName, timestamp: ts,
          lat: isNaN(pr.latVal) ? null : pr.latVal, lon: isNaN(pr.lonVal) ? null : pr.lonVal, alt: isNaN(pr.altVal) ? null : pr.altVal,
          notes: 'Importado de FaultKin/Texto'
        });
      }

      if (pr.strikeVal != null && pr.dipVal != null) {
        const dipDirVal = pr.dipAzVal != null ? pr.dipAzVal : roundInt(norm360(pr.strikeVal + 90));
        const measObj = {
          id: uid(), stationId: stId,
          type: (pr.trendVal != null || pr.senseVal) ? 'fault' : 'planar',
          subtype: 'Importado', timestamp: ts,
          strike: pr.strikeVal, dip: pr.dipVal, dipDir: dipDirVal,
          trend: pr.trendVal, plunge: pr.plungeVal, striaeMode: 'trendplunge',
          sense: pr.senseVal, // CAMBIO: Conservar el texto original (removido el default a 'Normal')
          notes: pr.noteVal
        };

        if (pr.trendVal != null && pr.plungeVal != null) {
          const rk = calculateRakeFromTP(dipDirVal, pr.dipVal, pr.trendVal, pr.plungeVal);
          if (rk) { measObj.rake = rk.rake; measObj.rakeQuadrant = rk.quadrant; }
        }
        await dbPut('measurements', measObj);
        writtenCount++;
      }
    }

    toast(`Importados ${writtenCount} registros`);
    if (unparseableDateCount > 0) {
      setTimeout(() => alert(t('importDateWarn').replace('{count}', unparseableDateCount)), 500);
    }
    Nav.campaign(campId);
  };

  if (analysis.flagged.length > 0) {
    showImportWarningModal(analysis.flagged, parsedRows.length,
      () => { e.target.value = ''; toast(t('importCancel')); },
      () => { doWrite(analysis.validRows); e.target.value = ''; }
    );
  } else {
    await doWrite(analysis.validRows);
    e.target.value = '';
  }
}

// CAMBIO: Variables globales para el manejo de Screen Wake Lock
let wakeLockSentinel = null;
let wakeLockPref = localStorage.getItem('geo_keep_awake') === '1';
let wakeLockRetryPending = false;

// CAMBIO: Solicitud del bloqueo de pantalla
async function requestKeepAwake() {
  if (!('wakeLock' in navigator) || !window.isSecureContext) return false;
  try {
    wakeLockSentinel = await navigator.wakeLock.request('screen');
    wakeLockSentinel.addEventListener('release', function() {
      if (document.getElementById('geoWakeLockToggle')) updateWakeLockUI();
    });
    wakeLockPref = true;
    localStorage.setItem('geo_keep_awake', '1');
    if (document.getElementById('geoWakeLockToggle')) updateWakeLockUI();
    return true;
  } catch (err) {
    if (err.name === 'NotAllowedError') {
      toast(t('wakeLockBattery'));
      wakeLockPref = false;
      localStorage.setItem('geo_keep_awake', '0');
    }
    if (document.getElementById('geoWakeLockToggle')) updateWakeLockUI();
    return false;
  }
}

// CAMBIO: Liberación del bloqueo de pantalla
async function releaseKeepAwake() {
  wakeLockPref = false;
  localStorage.setItem('geo_keep_awake', '0');
  if (wakeLockSentinel) {
    await wakeLockSentinel.release();
    wakeLockSentinel = null;
  }
  if (document.getElementById('geoWakeLockToggle')) updateWakeLockUI();
}

// CAMBIO: Manejador del toggle en Ajustes
function toggleKeepAwake(checked) {
  if (checked) {
    requestKeepAwake();
  } else {
    releaseKeepAwake();
  }
}

// CAMBIO: Actualización de la interfaz en base al estado del Wake Lock
function updateWakeLockUI() {
  const chk = document.getElementById('geoWakeLockToggle');
  const lbl = document.getElementById('geoWakeLockStatus');
  if (!chk || !lbl) return;
  if (!('wakeLock' in navigator) || !window.isSecureContext) {
    chk.disabled = true;
    chk.checked = false;
    lbl.textContent = t('wakeLockUnavailable');
  } else {
    chk.disabled = false;
    chk.checked = (wakeLockSentinel !== null && !wakeLockSentinel.released);
    lbl.textContent = chk.checked ? t('wakeLockActive') : t('wakeLockInactive');
  }
}

// CAMBIO: Listener global para recuperar el lock al volver a la pestaña
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'visible' && wakeLockPref) {
    requestKeepAwake();
  }
});

// CAMBIO: Función para reintentar obtener el Wake Lock en la primera interacción
function handleWakeLockInteraction() {
  if (wakeLockRetryPending && wakeLockPref) {
    wakeLockRetryPending = false;
    requestKeepAwake();
  }
  document.removeEventListener('pointerdown', handleWakeLockInteraction);
  document.removeEventListener('keydown', handleWakeLockInteraction);
}

// CAMBIO: Inicializador global del estado del Wake Lock
async function initWakeLock() {
  if (wakeLockPref) {
    const success = await requestKeepAwake();
    if (!success && wakeLockPref) {
      wakeLockRetryPending = true;
      document.addEventListener('pointerdown', handleWakeLockInteraction);
      document.addEventListener('keydown', handleWakeLockInteraction);
    }
  }
}
initWakeLock();

    ['🌲 Bosque / Oliva', 'settingsThemeForest'],

    ['Medio / Medium', 'settingsMedium'],
    ['Grande / Large', 'settingsLarge'],
    ['Extra Grande / Extra Large', 'settingsExtraLarge'],
    ['Normal', 'settingsNormal'],
    ['Grande (Recomendado)', 'settingsLargeRecommended'],
    ['Extra grande', 'settingsExtraLargeLower'],
    ['Dip Direction / Dip (ej. 135 / 45)', 'settingsDipDirection'],
    ['Strike RHR / Dip (ej. 045 / 45)', 'settingsStrike'],
    ['Cuadrante / Dip (ej. N45°E / 45)', 'settingsQuadrant'],
    ['Norte y Sur (ej. N30°E y S45°O)', 'settingsQuadrantNS'],
    ['Solo Norte (ej. N30°E y N135°O)', 'settingsQuadrantNorth'],
    ['Dirección de Manteo (Dip Direction)', 'settingsNeedleDip'],
    ['Rumbo / Strike (Regla mano derecha)', 'settingsNeedleStrike'],
    ['📍 Calcular declinación desde GPS actual', 'settingsEstimateDeclination'],
    ['Sensores / Permisos', 'settingsSensorsPermissions'],
    ['📡 Activar / Re-calibrar Sensores', 'settingsActivateSensors'],
    ['Cargando...', 'settingsLoading']
  ]);

  // CAMBIO: Traducir exclusivamente textos del panel Ajustes.
  app.querySelectorAll('.settings-sec option, .settings-sec .set-sub, .settings-sec .set-title, .settings-sec button').forEach(el => {
    const key = translatedTexts.get(el.textContent.trim());
    if (key) el.textContent = t(key);
  });

  // CAMBIO: Traducir el marcador de posición de calibración.
  const calibration = app.querySelector('#magOffsetInput');
  if (calibration) calibration.placeholder = t('settingsCalibrationExample');

  // CAMBIO: Crear asociaciones explícitas para controles existentes.
  app.querySelectorAll('.settings-sec select, .settings-sec input[id]').forEach((control, index) => {
    if (!control.id) control.id = 'geoSettingsControl' + index;

    if (app.querySelector('.settings-sec label[for="' + control.id + '"]')) return;

    const item = control.closest('.set-item');
    const title = item ? item.querySelector('.set-title') : null;

    if (title && title.tagName !== 'LABEL') {
      const label = document.createElement('label');
      label.className = title.className;
      label.htmlFor = control.id;
      label.textContent = title.textContent;
      title.replaceWith(label);
    } else if (title && title.tagName === 'LABEL') {
      title.htmlFor = control.id;
    } else {
      const label = document.createElement('label');
      label.className = 'settings-sr-only';
      label.htmlFor = control.id;
      label.textContent = t('settings');
      control.parentElement.insertBefore(label, control);
    }
  });

  // CAMBIO: Restaurar el estado de cada sección de forma segura.
  let saved = {};
  try {
    const raw = localStorage.getItem('geo_settings_open');
    if (raw !== null) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
        saved = parsed;
      }
    }
  } catch (e) {
    saved = {};
  }

  sections.forEach((section, index) => {
    const key = String(index);
    section.open = typeof saved[key] === 'boolean' ? saved[key] : true;

    // CAMBIO: Guardar el estado individual de las cuatro secciones.
    section.addEventListener('toggle', () => {
      let current = {};
      try {
        const raw = localStorage.getItem('geo_settings_open');
        if (raw !== null) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
            current = parsed;
          }
        }
        current[key] = section.open;
        localStorage.setItem('geo_settings_open', JSON.stringify(current));
      } catch (e) {
        // CAMBIO: Mantener el funcionamiento sin almacenamiento disponible.
      }
    });
  });
}

function autoEstimateDeclination(){
  if(gpsState.lat==null || gpsState.lon==null){ toast('Requiere señal GPS'); return; }
  const est = estimateDeclination(gpsState.lat, gpsState.lon);
  changeMagOffset(est);
  const input = document.getElementById('magOffsetInput');
  if(input) input.value = est;
  toast(`Declinación estimada: ${est}° aplicada`);
}

function changeColorTheme(theme){
  // CAMBIO: Impedir que se guarden paletas inexistentes.
  colorTheme = THEME_IDS.includes(theme) ? theme : 'dark';

  render();
}

function changeInputNotation(not){ inputNotation=not; localStorage.setItem('geo_input_notation', not); render(); }

function changeCompassScale(scale){ compassScale=scale; localStorage.setItem('geo_compass_scale', scale); render(); }

function changeQuadrantPref(val){ quadrantPref=val; localStorage.setItem('geo_quadrant_pref', val); render(); }
function changeNeedleMode(val){ needleMode=val; localStorage.setItem('geo_needle_mode', val); render(); }
function changeMagOffset(val){
  magOffset=parseFloat(val)||0;
  localStorage.setItem('geo_mag_offset',magOffset);
  // CAMBIO: F4: descartar lecturas calculadas con la declinación anterior.
  sensorState.buffer.length=0;
  sensorState.last=null;
  // CAMBIO: F4: utilizar el vigilante B4-3 existente al salir de active.
  if(sensorState.status==='active') setSensorStatus('pending');
  updateLiveDial();
  render();
}

// CAMBIO: Función pura central de validación de campos según el tipo numérico o textual
function validateField(kind, value, isRequired) {
  if (typeof value === 'string') value = value.trim();

  if (value === '' || value === null || value === undefined) {
    if (isRequired) return { ok: false, value: null, message: t('valReq') };
    return { ok: true, value: null };
  }
  
    if (kind === 'quadrant') {
    const strike = parseQuadrantToStrike(String(value));
    if (strike === null) return { ok: false, value: value, message: t('valQuad') };
    const nums = String(value).match(/\d+(?:[.,]\d+)?/g) || [];
    // CAMBIO: Distinguir un ángulo superior a 90° de un formato incorrecto.
    if (nums.some(n => parseFloat(n.replace(',', '.')) > 90)) return { ok: false, value: value, message: t('quadrantAngleRange') };
    return { ok: true, value: String(value) };
  }
  
  const v = (typeof value === 'string') ? Number(value.replace(',', '.')) : Number(value);
  if (!Number.isFinite(v)) return { ok: false, value: v, message: t('valNum') };

  if (kind === 'azimuth') {
    let norm = v;
    if (norm === 360) norm = 0;
    if (norm < 0 || norm >= 360) return { ok: false, value: norm, message: t('valAzi') };
    return { ok: true, value: norm };
  } else if (kind === 'angle') {
    if (v < 0 || v > 90) return { ok: false, value: v, message: t('valAng') };
  } else if (kind === 'lat') {
    if (v < -90 || v > 90) return { ok: false, value: v, message: t('valLat') };
  } else if (kind === 'lon') {
    if (v < -180 || v > 180) return { ok: false, value: v, message: t('valLon') };
  } else if (kind === 'positive') {
    if (v < 0) return { ok: false, value: v, message: t('valPos') };
  } else if (kind === 'utmZone') {
    if (v < 1 || v > 60) return { ok: false, value: v, message: t('valZone') };
  } else if (kind === 'easting') {
    if (v < 100000 || v > 900000) return { ok: false, value: v, message: t('valEast') };
  } else if (kind === 'northing') {
    if (v < 0 || v > 10000000) return { ok: false, value: v, message: t('valNorth') };
  }
  
  return { ok: true, value: v };
}

// CAMBIO: Evitar registros duplicados de los eventos de tamaño del mapa.
let mapResizeListenersInstalled = false;

// CAMBIO: Registrar una sola vez los listeners del mapa a nivel de ventana.
if(!mapResizeListenersInstalled){
  mapResizeListenersInstalled = true;

  let mapResizeTimer = null;

  const scheduleGISResize = () => {
    clearTimeout(mapResizeTimer);

    // CAMBIO: Esperar a que finalice la actualización del layout.
    mapResizeTimer = setTimeout(() => {
      mapResizeTimer = null;

      if(state.view !== 'mapView') return;

      const container = document.getElementById('mapContainer');
      if(!container) return;

      if(container.clientWidth <= 0 || container.clientHeight <= 0){
        // CAMBIO: Reintentar exactamente una vez si el layout aún mide cero.
        mapResizeTimer = setTimeout(() => {
          mapResizeTimer = null;
          resizeGISCanvas();
        }, 150);
        return;
      }

      resizeGISCanvas();
    }, 150);
  };

  window.addEventListener('resize', scheduleGISResize);
  window.addEventListener('orientationchange', scheduleGISResize);

  // CAMBIO: Cubrir también cambios del viewport visual en dispositivos móviles.
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', scheduleGISResize);
  }
}
