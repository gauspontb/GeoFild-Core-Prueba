function accuracyToPixels(accuracyM, mpp) {
  if (isNaN(accuracyM) || isNaN(mpp) || mpp <= 0) return 0;
  return Math.max(0, accuracyM / mpp);
}

function toggleLiveLocation() {
  if (!window.isSecureContext) {
    toast(t('insecureLocation'));
    return;
  }
  const btn = document.getElementById('btnLiveLoc');
  
  if (liveLocState.active) {
    stopLiveLocation();
  } else {
    liveLocState.active = true;
    liveLocState.firstFix = true;
    if (btn) btn.style.background = 'var(--accent)';
    liveLocWatchId = navigator.geolocation.watchPosition(
      (pos) => {
        liveLocState.lat = pos.coords.latitude;
        liveLocState.lon = pos.coords.longitude;
        liveLocState.accuracy = pos.coords.accuracy;
        if (liveLocState.firstFix) {
          const canvas = document.getElementById('gisCanvas');
          const w = canvas ? canvas.width / (window.devicePixelRatio||1) : 300;
          const h = canvas ? canvas.height / (window.devicePixelRatio||1) : 300;
          const sc = geoToScreen(liveLocState.lat, liveLocState.lon, w, h);
          if (sc.x < 0 || sc.x > w || sc.y < 0 || sc.y > h) {
            mapState.centerLat = liveLocState.lat;
            mapState.centerLon = liveLocState.lon;
            mapState.panX = 0; mapState.panY = 0;
          }
          liveLocState.firstFix = false;
        }
        drawGISMap();
      },
      (err) => {
        if (err.code === 1) toast(t('locErrorPerm'));
        else if (err.code === 2) toast(t('locErrorUnavail'));
        else if (err.code === 3) toast(t('locErrorTimeout'));
        stopLiveLocation();
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
    );
  }
}

function stopLiveLocation() {
  if (liveLocWatchId !== null) {
    navigator.geolocation.clearWatch(liveLocWatchId);
    liveLocWatchId = null;
  }
  liveLocState.active = false;
  liveLocState.lat = null;
  liveLocState.lon = null;
  liveLocState.accuracy = null;
  const btn = document.getElementById('btnLiveLoc');
  if (btn) btn.style.background = '';
  drawGISMap();
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && liveLocState.active) {
    stopLiveLocation();
  }
});

function drawMapNavMarkers(ctx, width, height) {
  try {
    const mpp = mapState.zoom / mapState.scale;
    if (navSearchMarker && navSearchMarker.lat != null && navSearchMarker.lon != null) {
      const pt = geoToScreen(navSearchMarker.lat, navSearchMarker.lon, width, height);
      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.strokeStyle = '#e8a33d';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-10, 0); ctx.lineTo(10, 0);
      ctx.moveTo(0, -10); ctx.lineTo(0, 10);
      ctx.stroke();
      ctx.restore();
    }

    if (liveLocState.active && liveLocState.lat != null && liveLocState.lon != null) {
      const pt = geoToScreen(liveLocState.lat, liveLocState.lon, width, height);
      const accPx = accuracyToPixels(liveLocState.accuracy, mpp);
      
      ctx.save();
      if (accPx > 0) {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, accPx, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(92, 179, 255, 0.2)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(92, 179, 255, 0.4)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#5cb3ff';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
  } catch (e) {
    console.warn('Error rendering nav markers', e);
  }
}

function drawGISMap(){
  const canvas = document.getElementById('gisCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width / dpr;
  const h = canvas.height / dpr;
 
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
 
  // 1. Fondo de terreno
  // CAMBIO: Tratar pink como paleta clara en el fondo GIS.
  ctx.fillStyle = (colorTheme === 'sun' || colorTheme === 'pink') ? '#f4f6f8' : (colorTheme==='earth' ? '#1f1c18' : '#14181c');

  ctx.fillRect(0, 0, w, h);
 
  // 2. Dibujar Imagen Satelital / Topográfica Calibrada (Ráster) o Mapas Online
  drawOnlineBaseTiles(ctx, w, h);
  if(mapState.overlayImg && mapState.overlayMeta){
    const m = mapState.overlayMeta;
    const nw = geoToScreen(m.latMax, m.lonMin, w, h);
    const se = geoToScreen(m.latMin, m.lonMax, w, h);
    const imgW = se.x - nw.x;
    const imgH = se.y - nw.y;
    ctx.drawImage(mapState.overlayImg, nw.x, nw.y, imgW, imgH);
  }
 
  // 3. Dibujar Cuadrícula Geográfica / UTM dinámica
  drawMapGrid(ctx, w, h);
 
  // 4. Dibujar Símbolos Geológicos Estructurales (CAMBIO: Clústeres de puntos)
  let isClusterEnabled = true;
  try {
    const val = localStorage.getItem('geo_map_cluster');
    if (val !== null) isClusterEnabled = val === 'true';
  } catch(e) {}

  const screenPts = [];
  const stMapForCluster = new Map();
  
  mapState.stationsCache.forEach(st => {
    const pt = geoToScreen(st.lat, st.lon, w, h);
    if(pt.x < -60 || pt.x > w + 60 || pt.y < -60 || pt.y > h + 60) return; // Culling
    stMapForCluster.set(st.id, st);
    screenPts.push({ id: st.id, x: pt.x, y: pt.y });
  });

  let clusters = [];
  if (isClusterEnabled) {
    clusters = clusterScreenPoints(screenPts, CLUSTER_RADIUS_PX);
  } else {
    clusters = screenPts.map(p => ({ x: p.x, y: p.y, count: 1, members: [p.id] }));
  }

  mapState.currentClusters = clusters;
  mapState.currentClusterMap = stMapForCluster;

  clusters.forEach(c => {
    if (c.count === 1) {
      const st = stMapForCluster.get(c.members[0]);
      const stMeas = mapState.measCache.filter(m => m.stationId === st.id);
      
      // Punto base de la estación
      ctx.beginPath();
      ctx.arc(c.x, c.y, 4, 0, Math.PI*2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#e8a33d';
      ctx.lineWidth = 1.5;
      ctx.stroke();
   
      // Etiqueta de la estación
      ctx.font = 'bold 11px system-ui, sans-serif';
      // CAMBIO: Etiquetas oscuras para pink y sun.
      ctx.fillStyle = (colorTheme==='sun' || colorTheme==='pink') ? '#111' : '#eef2f5';
      ctx.fillText(st.name || st.id, c.x + 8, c.y - 6);
   
      if(stMeas.length > 0){
        stMeas.forEach((m) => {
          if(mapState.filterLayer !== 'ALL' && m.type !== mapState.filterLayer) return;
          drawGeologicalSymbol(ctx, c.x, c.y, m);
        });
      }
    } else {
      // Burbuja de Clúster
      const numStr = String(c.count);
      const r = numStr.length > 2 ? 18 : (numStr.length > 1 ? 16 : 14);
      
      ctx.beginPath();
      ctx.arc(c.x, c.y, r, 0, Math.PI*2);
      // CAMBIO: Fondo claro de clústeres para pink.
      ctx.fillStyle = (colorTheme === 'sun' || colorTheme === 'pink') ? '#ffffff' : '#1c2227';
      ctx.fill();
      ctx.strokeStyle = '#e8a33d';
      ctx.lineWidth = 2;
      ctx.stroke();
      
      ctx.font = 'bold 12px system-ui, sans-serif';
      // CAMBIO: Texto oscuro de clústeres para pink.
      ctx.fillStyle = (colorTheme === 'sun' || colorTheme === 'pink') ? '#111' : '#e8a33d';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(numStr, c.x, c.y + 1);
      
      // Restaurar alineación
      ctx.textAlign = 'start';
      ctx.textBaseline = 'alphabetic';
    }
  });
 
  // 5. Dibujar posición GPS en vivo del usuario
  if(gpsState.lat != null && gpsState.lon != null){
    const gpsPt = geoToScreen(gpsState.lat, gpsState.lon, w, h);
    ctx.beginPath();
    ctx.arc(gpsPt.x, gpsPt.y, 7, 0, Math.PI*2);
    ctx.fillStyle = '#38a169';
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
 
    // Pulso animado
    ctx.beginPath();
    ctx.arc(gpsPt.x, gpsPt.y, 14, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(56, 161, 105, 0.4)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
 
  drawMapNavMarkers(ctx, w, h);
 
  // 6. Elementos cartográficos: Rosa de los vientos y Escala gráfica
  drawNorthArrow(ctx, w - 35, 95);
  drawMapScaleBar(ctx, 20, h - 25, w);
 
  ctx.restore();
}
 
/* =========================================================
   SIMBOLOGÍA ESTRUCTURAL EN PLANTA NORMALIZADA
   ========================================================= */
function drawGeologicalSymbol(ctx, cx, cy, m){
  const strike = m.strike != null ? m.strike : (m.dipDir != null ? norm360(m.dipDir - 90) : 0);
  const dip = m.dip || 0;
  const strikeRad = toRad(strike);
  const len = 22; // Longitud del rumbo
 
  ctx.save();
  ctx.translate(cx, cy);
 
  // A. ESTRATIFICACIÓN (S0) Y FOLIACIONES (S1, S2, CLIVAJE)
  if(m.type === 'planar' || (m.subtype && m.subtype.includes('Estratificación')) || (m.subtype && m.subtype.includes('Foliación'))){
    const isFoliation = (m.subtype || '').includes('Foliación');
    ctx.rotate(strikeRad);
 
    // Línea de rumbo
    ctx.strokeStyle = isFoliation ? '#e8a33d' : '#5fb583';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-len/2, 0);
    ctx.lineTo(len/2, 0);
    ctx.stroke();
 
    // Trazo de buzamiento / manteo perpendicular hacia el bloque techo
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 8);
    ctx.stroke();
 
    if(isFoliation){
      // Trazado doble para foliación
      ctx.beginPath();
      ctx.moveTo(-len/3, -3);
      ctx.lineTo(len/3, -3);
      ctx.stroke();
    }
 
    // Texto con el valor de manteo
    ctx.rotate(-strikeRad);
    ctx.font = 'bold 10px monospace';
    ctx.fillStyle = isFoliation ? '#e8a33d' : '#5fb583';
    ctx.fillText(`${dip}°`, 8, 14);
  }
 
  // B. FALLAS Y CINEMÁTICA EN PLANTA
  else if(m.type === 'fault'){
    ctx.rotate(strikeRad);
    ctx.strokeStyle = '#e0645c';
    ctx.lineWidth = 2.8;
 
    // Trazo de falla
    ctx.beginPath();
    ctx.moveTo(-len/2, 0);
    ctx.lineTo(len/2, 0);
    ctx.stroke();
 
    // Diente o línea de manteo
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 7);
    ctx.stroke();
 
    // Flechas de cizalle según cinemática (Dextral / Sinistral)

        // CAMBIO: Normalizar el sentido guardado sin alterar su valor original.
    const sense = canonicalSense(m.sense);
    // CAMBIO: Activar las flechas dextrales también en fallas mixtas.
    if(sense === 'dextral' || sense === 'normal_dextral' || sense === 'reverse_dextral'){
      // Flecha arriba hacia la derecha, abajo hacia la izquierda
      drawArrowHead(ctx, 6, -4, 0);
      drawArrowHead(ctx, -6, 4, Math.PI);
    } else if(sense === 'sinistral' || sense === 'normal_sinistral' || sense === 'reverse_sinistral'){
      // CAMBIO: Activar las flechas sinistrales también en fallas mixtas.
      // Flecha arriba hacia la izquierda, abajo hacia la derecha
      drawArrowHead(ctx, -6, -4, Math.PI);
      drawArrowHead(ctx, 6, 4, 0);
    }
    // CAMBIO: Dibujar la componente inversa por separado, incluso si hay flechas laterales.
    if(sense === 'reverse' || sense === 'reverse_dextral' || sense === 'reverse_sinistral'){
      // Dientes de cabalgamiento
      ctx.fillStyle = '#e0645c';
      ctx.beginPath();
      ctx.moveTo(-6, 0); ctx.lineTo(-2, 6); ctx.lineTo(2, 0);
      ctx.fill();
    }
 
    ctx.rotate(-strikeRad);
    ctx.font = 'bold 10px monospace';
    ctx.fillStyle = '#e0645c';
    ctx.fillText(`${dip}°`, 8, 14);
  }
 
  // C. LINEACIONES Y ESTRÍAS PURAS
  else if(m.trend != null && m.plunge != null){
    const trendRad = toRad(m.trend);
    ctx.rotate(trendRad);
    ctx.strokeStyle = '#ff6b6b';
    ctx.fillStyle = '#ff6b6b';
    ctx.lineWidth = 2;
 
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 16);
    ctx.stroke();
    drawArrowHead(ctx, 0, 16, Math.PI/2);
 
    ctx.rotate(-trendRad);
    ctx.font = 'bold 10px monospace';
    ctx.fillText(`${m.plunge}°`, 6, 12);
  }
 
  // D. VETAS Y CONTACTOS
  else if(m.type === 'vein' || m.type === 'contact'){
    ctx.rotate(strikeRad);
    ctx.strokeStyle = m.type === 'vein' ? '#5cb3ff' : '#d38aea';
    ctx.lineWidth = 2;
    if(m.type === 'contact') ctx.setLineDash([3, 3]);
 
    ctx.beginPath();
    ctx.moveTo(-len/2, 0);
    ctx.lineTo(len/2, 0);
    ctx.stroke();
 
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 6);
    ctx.stroke();
 
    ctx.rotate(-strikeRad);
    ctx.font = 'bold 10px monospace';
    ctx.fillStyle = m.type === 'vein' ? '#5cb3ff' : '#d38aea';
    ctx.fillText(`${dip}°`, 8, 12);
  }
 
  ctx.restore();
}
 
function drawArrowHead(ctx, x, y, angRad){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angRad);
  ctx.fillStyle = ctx.strokeStyle;
  ctx.beginPath();
  ctx.moveTo(3, 0);
  ctx.lineTo(-3, -2.5);
  ctx.lineTo(-3, 2.5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
 
// Cuadrícula y coordenadas
function drawMapGrid(ctx, w, h){
  ctx.save();
  // CAMBIO: Cuadrícula oscura y tenue para paletas claras.
  ctx.strokeStyle = (colorTheme==='sun' || colorTheme==='pink') ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
 
  const step = 80;
  for(let x = 0; x < w; x += step){
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for(let y = 0; y < h; y += step){
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
 
  // Ticks con coordenadas en las esquinas
  const nw = screenToGeo(10, 10, w, h);
  const se = screenToGeo(w-10, h-10, w, h);
  ctx.font = '9px monospace';
  // CAMBIO: Aplicar el color de coordenadas de tema claro también a pink.
  ctx.fillStyle = (colorTheme==='sun' || colorTheme==='pink') ? '#78909c' : '#5c6770';
  ctx.fillText(`NW: ${nw.lat.toFixed(4)}, ${nw.lon.toFixed(4)}`, 14, 52);
  ctx.fillText(`SE: ${se.lat.toFixed(4)}, ${se.lon.toFixed(4)}`, w - 160, h - 35);
  ctx.restore();
}
 
function drawNorthArrow(ctx, x, y){
  ctx.save();
  ctx.translate(x, y);
 
  // Fondo circular tenue
  ctx.beginPath();
  ctx.arc(0, 0, 16, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(28,34,39,0.75)';
  ctx.fill();
  ctx.strokeStyle = 'var(--border)';
  ctx.stroke();
 
  // Flecha Norte
  ctx.beginPath();
  ctx.moveTo(0, -12);
  ctx.lineTo(5, 6);
  ctx.lineTo(0, 2);
  ctx.fillStyle = '#e0645c';
  ctx.fill();
 
  ctx.beginPath();
  ctx.moveTo(0, -12);
  ctx.lineTo(-5, 6);
  ctx.lineTo(0, 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
 
  ctx.font = 'bold 9px monospace';
  ctx.fillStyle = '#eef2f5';
  ctx.textAlign = 'center';
  ctx.fillText('N', 0, -15);
  ctx.restore();
}
 
function drawMapScaleBar(ctx, x, y, maxW){
  ctx.save();
  const pxPerMeter = (1 / mapState.zoom) * mapState.scale;
 
  // Determinar longitud ideal de la barra (aprox 80-120px)
  let targetMeters = 100;
  if(pxPerMeter < 0.001) targetMeters = 50000;
  else if(pxPerMeter < 0.01) targetMeters = 10000;
  else if(pxPerMeter < 0.1) targetMeters = 1000;
  else if(pxPerMeter < 0.5) targetMeters = 500;
  else if(pxPerMeter < 2) targetMeters = 100;
  else targetMeters = 20;
 
  const barPx = targetMeters * pxPerMeter;
  const label = targetMeters >= 1000 ? `${targetMeters/1000} km` : `${targetMeters} m`;
 
  ctx.fillStyle = 'rgba(28,34,39,0.85)';
  ctx.fillRect(x - 6, y - 18, barPx + 12, 24);
  ctx.strokeStyle = 'var(--border)';
  ctx.strokeRect(x - 6, y - 18, barPx + 12, 24);
 
  ctx.strokeStyle = 'var(--accent)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + barPx, y);
  ctx.stroke();
 
  ctx.font = 'bold 10px monospace';
  ctx.fillStyle = '#eef2f5';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + barPx/2, y - 5);
  ctx.restore();
}
 
/* =========================================================
   GESTOS TÁCTILES Y HIT-TESTING DEL MAPA
   ========================================================= */
function setupGISMapEvents(canvas){
  // CAMBIO: Impedir listeners duplicados cuando initGISMap reutiliza el canvas.
  if(canvas.__gisEventsInstalled) return;
  canvas.__gisEventsInstalled = true;
  // CAMBIO: Rastrear pointerId y bloquear el arrastre mientras haya varios contactos.
  const activePointers = new Map();
  let touchCount = 0;
  let pointerHadMulti = false;
  let touchHadMulti = false;

  canvas.onpointerdown = (e) => {
    if(activePointers.size === 0 && touchCount < 2 && !touchHadMulti) pointerHadMulti = false;
    activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(activePointers.size >= 2 || touchCount >= 2){
      pointerHadMulti = true;
      gisTouchState.dragging = false;
      gisTouchState.lastTap = 0;
      return;
    }
    gisTouchState.dragging = true;
    gisTouchState.startX = e.clientX;
    gisTouchState.startY = e.clientY;
    gisTouchState.lastX = e.clientX;
    gisTouchState.lastY = e.clientY;
  };

  canvas.onpointermove = (e) => {
    if(!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(!gisTouchState.dragging || activePointers.size !== 1 || touchCount >= 2) return;
    // CAMBIO: Convertir el desplazamiento del puntero a píxeles lógicos.
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const dx = (e.clientX - gisTouchState.lastX) * (rect.width ? canvas.width / dpr / rect.width : 1);
    const dy = (e.clientY - gisTouchState.lastY) * (rect.height ? canvas.height / dpr / rect.height : 1);
    mapState.panX += dx;
    mapState.panY += dy;
    gisTouchState.lastX = e.clientX;
    gisTouchState.lastY = e.clientY;
    drawGISMap();
  };

  const endDrag = (e) => {
    if(!activePointers.has(e.pointerId)) return;
    const wasDragging = gisTouchState.dragging;
    const dist = Math.hypot(e.clientX - gisTouchState.startX, e.clientY - gisTouchState.startY);
    const hadMulti = pointerHadMulti || touchHadMulti || activePointers.size >= 2 || touchCount >= 2;
    activePointers.delete(e.pointerId);
    if(activePointers.size === 1){
      // CAMBIO: Al quedar un dedo, reiniciar el origen para evitar saltos de pan.
      const remaining = activePointers.values().next().value;
      gisTouchState.dragging = true;
      gisTouchState.startX = remaining.x;
      gisTouchState.startY = remaining.y;
      gisTouchState.lastX = remaining.x;
      gisTouchState.lastY = remaining.y;
      return;
    }
    gisTouchState.dragging = false;
    if(activePointers.size === 0) pointerHadMulti = false;
    if(e.type === 'pointerup' && wasDragging && !hadMulti && dist < 6){
      handleMapClick(e.clientX, e.clientY);
    }
  };
  canvas.onpointerup = endDrag;
  canvas.onpointercancel = endDrag;

  canvas.addEventListener('touchstart', (e)=>{
    touchCount = e.touches.length;
    if(touchCount >= 2){
      // CAMBIO: Un pellizco nunca se interpreta como clic o doble toque.
      touchHadMulti = true;
      pointerHadMulti = true;
      gisTouchState.dragging = false;
      gisTouchState.lastTap = 0;
    }
    gisTouchState.pinchDist = touchCount === 2 ? Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    ) : 0;
  }, {passive:true});

  canvas.addEventListener('touchmove', (e)=>{
    touchCount = e.touches.length;
    if(touchCount >= 2){
      gisTouchState.dragging = false;
      touchHadMulti = true;
      pointerHadMulti = true;
      gisTouchState.lastTap = 0;
    }
    if(touchCount === 2){
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      if(gisTouchState.pinchDist > 0 && dist > 0){
        // CAMBIO: Anclar el zoom al punto medio de los dos dedos.
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.width / dpr;
        const h = canvas.height / dpr;
        const mx = (e.touches[0].clientX + e.touches[1].clientX)/2;
        const my = (e.touches[0].clientY + e.touches[1].clientY)/2;
        const ax = (mx - rect.left) * (rect.width ? w / rect.width : 1);
        const ay = (my - rect.top) * (rect.height ? h / rect.height : 1);
        zoomAtAnchor(dist / gisTouchState.pinchDist, ax, ay, w, h);
        drawGISMap();
      }
      gisTouchState.pinchDist = dist;
    } else {
      gisTouchState.pinchDist = 0;
    }
  }, {passive:true});

  canvas.addEventListener('touchend', (e)=>{
    const oldTouchCount = touchCount;
    touchCount = e.touches.length;
    gisTouchState.pinchDist = touchCount === 2 ? Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    ) : 0;
    if(touchCount === 1 && (oldTouchCount >= 2 || touchHadMulti)){
      // CAMBIO: Reanudar el arrastre desde el dedo que permanece en pantalla.
      const remaining = e.touches[0];
      gisTouchState.startX = remaining.clientX;
      gisTouchState.startY = remaining.clientY;
      gisTouchState.lastX = remaining.clientX;
      gisTouchState.lastY = remaining.clientY;
      gisTouchState.dragging = activePointers.size <= 1;
      gisTouchState.lastTap = 0;
      return;
    }
    if(touchCount !== 0) return;
    if(touchHadMulti || oldTouchCount >= 2 || e.changedTouches.length !== 1){
      gisTouchState.lastTap = 0;
      touchHadMulti = false;
      if(activePointers.size === 0) pointerHadMulti = false;
      return;
    }
    const now = Date.now();
    if(now - gisTouchState.lastTap < 300){
      // CAMBIO: Mantener el doble toque original (recentrar y acercar 1.4).
      const t = e.changedTouches[0];
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const w = canvas.width / dpr;
      const h = canvas.height / dpr;
      const ax = (t.clientX - rect.left) * (rect.width ? w / rect.width : 1);
      const ay = (t.clientY - rect.top) * (rect.height ? h / rect.height : 1);
      const geo = screenToGeo(ax, ay, w, h);
      mapState.centerLat = geo.lat;
      mapState.centerLon = geo.lon;
      mapState.panX = 0; mapState.panY = 0;
      const currentMpp = mapState.zoom / mapState.scale;
      mapState.scale = mapState.zoom / clampMapResolution(currentMpp / 1.4);
      drawGISMap();
      gisTouchState.lastTap = 0;
    } else {
      gisTouchState.lastTap = now;
    }
    touchHadMulti = false;
  });

  canvas.addEventListener('touchcancel', (e)=>{
    // CAMBIO: Cancelar el pellizco y reanclar el dedo restante, si existe.
    touchCount = e.touches.length;
    gisTouchState.pinchDist = 0;
    gisTouchState.lastTap = 0;
    if(touchCount === 1){
      const remaining = e.touches[0];
      gisTouchState.startX = remaining.clientX;
      gisTouchState.startY = remaining.clientY;
      gisTouchState.lastX = remaining.clientX;
      gisTouchState.lastY = remaining.clientY;
      gisTouchState.dragging = activePointers.size <= 1;
    } else if(touchCount === 0){
      gisTouchState.dragging = false;
      touchHadMulti = false;
      if(activePointers.size === 0) pointerHadMulti = false;
    }
  }, {passive:true});

  canvas.addEventListener('wheel', (e)=>{
    e.preventDefault();
    // CAMBIO: Usar el cursor como anclaje del zoom de rueda.
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;
    const ax = (e.clientX - rect.left) * (rect.width ? w / rect.width : 1);
    const ay = (e.clientY - rect.top) * (rect.height ? h / rect.height : 1);
    zoomAtAnchor(factor, ax, ay, w, h);
    drawGISMap();
  }, {passive:false});
}
 
function handleMapClick(clientX, clientY){
  const canvas = document.getElementById('gisCanvas');
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const clickX = clientX - rect.left;
  const clickY = clientY - rect.top;
 
  // CAMBIO: Se implementa la resolución de toque basada en clusters
  if (mapState.currentClusters && mapState.currentClusterMap) {
    const clickedCluster = hitTestClusters(mapState.currentClusters, clickX, clickY, 22);
    
    if (clickedCluster) {
      if (clickedCluster.count === 1) {
        const st = mapState.currentClusterMap.get(clickedCluster.members[0]);
        if (st) openMapSheet(st);
      } else {
        const memberPts = clickedCluster.members.map(id => mapState.currentClusterMap.get(id)).filter(Boolean);
        if (canSeparateCluster(memberPts, CLUSTER_RADIUS_PX, MAP_MIN_MPP)) {
          // Si se pueden separar, encuadramos la vista
          let minLat = 90, maxLat = -90, minLon = 180, maxLon = -180;
          memberPts.forEach(s => {
            minLat = Math.min(minLat, s.lat);
            maxLat = Math.max(maxLat, s.lat);
            minLon = Math.min(minLon, s.lon);
            maxLon = Math.max(maxLon, s.lon);
          });
          const bounds = { north: maxLat, south: minLat, west: minLon, east: maxLon };
          const fit = computeFitView(bounds, canvas.width/dpr, canvas.height/dpr, 40);
          
          mapState.centerLat = fit.lat;
          mapState.centerLon = fit.lon;
          mapState.panX = 0;
          mapState.panY = 0;
          mapState.zoom = 1;
          mapState.scale = mapState.zoom / fit.mpp;
          drawGISMap();
        } else {
          // Si no se pueden separar (muy cerca geográficamente o ya en res mínima), listamos
          openClusterSheet(memberPts);
        }
      }
      return;
    }
  }
  
  closeMapSheet();
}
 
function openMapSheet(st){
  const sheet = document.getElementById('mapBottomSheet');
  const title = document.getElementById('sheetTitle');
  const content = document.getElementById('sheetContent');
  if(!sheet || !content) return;
 
  const stMeas = mapState.measCache.filter(m => m.stationId === st.id);
  title.textContent = `📍 ${st.name || st.id}`;
 
  const measList = stMeas.map(m=>`
    <div class="mini-row" style="margin-top:6px;">
      <div class="ml">
        <b>${esc(m.subtype || m.type)}</b>
        <span>${esc(measSub(m))}</span>
      </div>
    </div>

// CAMBIO: Ajustar el zoom alrededor de un anclaje usando el factor efectivo tras el límite.
function zoomAtAnchor(factor, ax, ay, width, height){
  if(!Number.isFinite(factor) || factor <= 0) return 1;
  const mpp = mapState.zoom / mapState.scale;
  const newMpp = clampMapResolution(mpp / factor);
  const r = mpp / newMpp;
  mapState.scale = mapState.zoom / newMpp;
  if(r !== 1){
    mapState.panX = ax - width/2 - r * (ax - width/2 - mapState.panX);
    mapState.panY = ay - height/2 - r * (ay - height/2 - mapState.panY);
  }
  return r;
}

function gisZoom(factor){
  // CAMBIO: Los botones acercan o alejan alrededor del centro lógico del canvas.
  const canvas = document.getElementById('gisCanvas');
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width / dpr;
  const h = canvas.height / dpr;
  zoomAtAnchor(factor, w/2, h/2, w, h);
  drawGISMap();
}
 
function gisCenterGPS(){
  if(gpsState.lat == null){ toast('Sin señal GPS'); return; }
  mapState.centerLat = gpsState.lat;
  mapState.centerLon = gpsState.lon;
  mapState.panX = 0;
  mapState.panY = 0;
  drawGISMap();
  toast('Mapa centrado en tu posición');
}
 
function gisFitBounds(){
  if(mapState.stationsCache.length === 0){
    mapState.panX = 0; mapState.panY = 0;
    const currentMpp = mapState.zoom / mapState.scale;
    mapState.scale = mapState.zoom / clampMapResolution(currentMpp);
    drawGISMap();
    return;
  }
 
  let minLat = 90, maxLat = -90, minLon = 180, maxLon = -180;
  mapState.stationsCache.forEach(s => {
    minLat = Math.min(minLat, s.lat);
    maxLat = Math.max(maxLat, s.lat);
    minLon = Math.min(minLon, s.lon);
    maxLon = Math.max(maxLon, s.lon);
  });
 
  mapState.centerLat = (minLat + maxLat) / 2;
  mapState.centerLon = (minLon + maxLon) / 2;
  mapState.panX = 0;
  mapState.panY = 0;
 
  const latSpan = Math.max(0.002, maxLat - minLat);
  const lonSpan = Math.max(0.002, maxLon - minLon);
  const metersSpan = Math.max(latSpan * 111320, lonSpan * 111320 * Math.cos(toRad(mapState.centerLat)));
 
  const canvas = document.getElementById('gisCanvas');
  const dpr = window.devicePixelRatio || 1;
  const viewSize = canvas ? Math.min(canvas.width/dpr, canvas.height/dpr) - 100 : 300;
 
  mapState.zoom = 1;
  const targetMpp = metersSpan / viewSize;
  mapState.scale = mapState.zoom / clampMapResolution(targetMpp);
  drawGISMap();
}

let tempCalibDataUrl = null;

async function listMapLayers() {
  const records = await dbGetAll('map_overlays');
  const layers = records.map(r => {
    if (r.id === 'current_overlay') {
      return { ...r, name: r.name || 'Imagen base', kind: r.kind || 'other' };
    }
    return r;
  });
  return layers.sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));

async function setActiveMapLayer(id) {
  const warnDiv = document.getElementById('onlineLayerWarning');
  const attrDiv = document.getElementById('mapAttribution');
  
  if (!id) {
    localStorage.setItem('geo_map_layer', '');
    mapState.onlineLayer = null;
    mapState.overlayImg = null;
    mapState.overlayMeta = null;
    if (attrDiv) attrDiv.style.display = 'none';
    if (warnDiv) warnDiv.style.display = 'none';
    drawGISMap();
    return;
  }

  if (id.startsWith('online_')) {
    if (!navigator.onLine) {
      toast(t('offlineRequired'));
      const layerSel = document.getElementById('mapBaseLayerSel');
      if (layerSel) layerSel.value = mapState.onlineLayer ? mapState.onlineLayer.id : (mapState.overlayMeta ? mapState.overlayMeta.id : '');
      return;
    }
    const oLayer = MAP_ONLINE_LAYERS.find(l => l.id === id);
    if (oLayer) {
      mapState.onlineLayer = oLayer;
      mapState.overlayImg = null;
      mapState.overlayMeta = null;
      localStorage.setItem('geo_map_layer', id);
      if (attrDiv) {
        attrDiv.innerHTML = oLayer.attribution || '';
        attrDiv.style.display = oLayer.attribution ? 'block' : 'none';
      }
      if (warnDiv) warnDiv.style.display = 'block';
      drawGISMap();
    }
    return;
  }
  
  const layer = await dbGet('map_overlays', id);
  if (layer && layer.dataUrl) {
    localStorage.setItem('geo_map_layer', id);
    localStorage.setItem('geo_map_last_offline', id);
    mapState.onlineLayer = null;
    mapState.overlayMeta = layer;
    if (warnDiv) warnDiv.style.display = 'none';
    const img = new Image();
    img.onload = () => {
      mapState.overlayImg = img;
      if (attrDiv) {
        attrDiv.textContent = layer.attribution || '';
        attrDiv.style.display = layer.attribution ? 'block' : 'none';
      }
      drawGISMap();
    };
    img.src = layer.dataUrl;
  }
}

function downscaleImage(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > 4096 || h > 4096) {
        const ratio = Math.min(4096 / w, 4096 / h);
        w = Math.round(w * ratio);
        h = Math.round(h * ratio);
        const cvs = document.createElement('canvas');
        cvs.width = w; cvs.height = h;
        const ctx = cvs.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(cvs.toDataURL('image/jpeg', 0.85));
      } else {
        resolve(dataUrl);
      }
    };
    img.src = dataUrl;
  });
}

function parseQuadrantToStrike(qStr){
  if(!qStr) return null;
  const str = qStr.trim().toUpperCase().replace(/\s+/g,'');
  const m = /^([NS])(\d+)(?:°)?([EOW])$/.exec(str);
  if(!m) return null;
  const ns = m[1];
  const ang = parseFloat(m[2]);
  const ew = m[3] === 'O' ? 'W' : m[3];
  if(isNaN(ang)) return null;

  let strike = 0;
  if(ns==='N' && ew==='E') strike = ang;
  else if(ns==='N' && ew==='W') strike = 360 - ang;
  else if(ns==='S' && ew==='E') strike = 180 - ang;
  else if(ns==='S' && ew==='W') strike = 180 + ang;
  // CAMBIO: Normalizar el rumbo cuadrantal como línea axial; la dirección RHR se establece por convención al introducirlo.
  return roundInt(norm360(strike) % 180);
}

function computeDeclinationExact(lat, lon, altKm, decimalYear) {
  const dt = decimalYear - 2025.0;
  
  // Parámetros del elipsoide WGS84 y del WMM
  const a = 6378.137; 
  const f = 1 / 298.257223563;
  const b = a * (1 - f);
  const e2 = 1 - (b * b) / (a * a);
  const aRef = 6371.2;
  
  const phi = lat * Math.PI / 180;
  const lambda = lon * Math.PI / 180;
  const sinPhi = Math.sin(phi);
  const cosPhi = Math.cos(phi);
  
  // Conversión a coordenadas geocéntricas
  const rc = a / Math.sqrt(1 - e2 * sinPhi * sinPhi);
  const p = (rc + altKm) * cosPhi;
  const z = (rc * (1 - e2) + altKm) * sinPhi;
  const r = Math.sqrt(p * p + z * z);
  
  // Ángulos theta (colatitud geocéntrica)
  const sinT = Math.max(p / r, 1e-10); // Límite de seguridad en los polos
  const cosT = z / r;
  
  // Factores de rotación entre sistema geocéntrico y geodésico
  const cPsi = (p * cosPhi + z * sinPhi) / r;
  const sPsi = (z * cosPhi - p * sinPhi) / r;

  // Matrices para polinomios asociados de Legendre (P_n^m) y derivadas (dP_n^m/dtheta)
  const P = Array.from({length: 13}, () => new Float64Array(13));
  const dP = Array.from({length: 13}, () => new Float64Array(13));
  
  // Inicialización y recurrencia semi-normalizada de Schmidt
  P[0][0] = 1; dP[0][0] = 0;
  P[1][0] = cosT; dP[1][0] = -sinT;
  P[1][1] = sinT; dP[1][1] = cosT;
  
  for (let n = 2; n <= 12; n++) {
    const k = Math.sqrt((2 * n - 1) / (2 * n));
    P[n][n] = k * sinT * P[n - 1][n - 1];
    dP[n][n] = k * (cosT * P[n - 1][n - 1] + sinT * dP[n - 1][n - 1]);
    
    for (let m = 0; m < n; m++) {
      const k1 = (2 * n - 1) / Math.sqrt(n * n - m * m);
      const k2 = Math.sqrt((n - 1) * (n - 1) - m * m) / Math.sqrt(n * n - m * m);
      
      P[n][m] = k1 * cosT * P[n - 1][m] - k2 * P[n - 2][m];
      dP[n][m] = k1 * (-sinT * P[n - 1][m] + cosT * dP[n - 1][m]) - k2 * dP[n - 2][m];
    }
  }

  // Sumatoria armónica geocéntrica
  let X_prime = 0, Y_prime = 0, Z_prime = 0;
  
  for (let i = 0; i < WMM2025_COF.length; i++) {
    const cof = WMM2025_COF[i];
    const n = cof[0], m = cof[1];
    const g = cof[2] + cof[4] * dt;
    const h = cof[3] + cof[5] * dt;
    
    const rRatio = Math.pow(aRef / r, n + 2);
    const cosML = Math.cos(m * lambda);
    const sinML = Math.sin(m * lambda);
    
    const gCos_hSin = g * cosML + h * sinML;
    const gSin_hCos = g * sinML - h * cosML;
    
    X_prime += rRatio * gCos_hSin * dP[n][m];
    if (m > 0) {
      Y_prime += (1 / sinT) * rRatio * m * (-gSin_hCos) * P[n][m];
    }
    // Z_prime no es necesario para la declinación simple, pero se incluye para integridad cinemática (si usaras campo total)
    Z_prime -= (n + 1) * rRatio * gCos_hSin * P[n][m];
  }
  
  // CAMBIO: Corregir el signo del componente este antes de calcular la declinación.
  Y_prime = -Y_prime;

  // Rotación del vector de vuelta al referencial geodésico WGS84
  const X = X_prime * cPsi + Z_prime * sPsi;
  const Y = Y_prime;
  
  return Math.atan2(Y, X) * 180 / Math.PI;
}

function estimateDeclination(lat, lon) {
  if (lat == null || lon == null || isNaN(lat) || isNaN(lon)) return 0;

  // Determinar el año decimal actual rigurosamente
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 1);
  const diff = now - start;
  const oneDay = 1000 * 60 * 60 * 24;
  const dayOfYear = Math.floor(diff / oneDay) + 1;
  const isLeap = (now.getFullYear() % 4 === 0 && now.getFullYear() % 100 !== 0) || (now.getFullYear() % 400 === 0);
  const daysInYear = isLeap ? 366 : 365;
  const decimalYear = now.getFullYear() + (dayOfYear / daysInYear);

  return Math.round(computeDeclinationExact(lat, lon, 0, decimalYear));
}

function computeOrientation(alphaDeg, betaDeg, gammaDeg){
  // CAMBIO: Sumar la declinación este positiva al azimut geográfico.
  const correctedAlpha = norm360(alphaDeg - magOffset);
  const a=toRad(correctedAlpha), b=toRad(betaDeg), g=toRad(gammaDeg);
  const cA=Math.cos(a), sA=Math.sin(a);
  const cB=Math.cos(b), sB=Math.sin(b);
  const cG=Math.cos(g), sG=Math.sin(g);
  const E = cA*sG + cG*sA*sB;
  const N = sA*sG - cA*cG*sB;
  const U = cB*cG;
  // CAMBIO: Permitir normalizar el dip y su dirección antes de calcular el strike.
  let dip = toDeg(Math.acos(clamp(U,-1,1)));
  let dipDir = norm360(toDeg(Math.atan2(E,N)) + 180);
  // CAMBIO: Normal invertida: dip equivalente y dirección opuesta.
  if(U<0){ dip=180-dip; dipDir=norm360(dipDir+180); }
  const strike = norm360(dipDir - 90);
  const Ey = -cB*sA, Ny = cA*cB, Uy = sB;
  let trend = norm360(toDeg(Math.atan2(Ey,Ny)));
  let plunge = toDeg(-Math.asin(clamp(Uy,-1,1)));
  if(plunge<0){ trend=norm360(trend+180); plunge=-plunge; }
  return { dip: roundInt(dip), dipDir: roundInt(dipDir), strike: roundInt(strike), trend: roundInt(trend), plunge: roundInt(plunge) };
}

function toQuadrant(strikeAz){
  if(strikeAz==null||isNaN(strikeAz)) return '—';
  let s = norm360(strikeAz);
  const wChar = currentLang==='es'?'O':'W';

  if(quadrantPref==='N_ONLY'){
    let half = s % 180;
    if(half<=90) return `N${Math.round(half)}°E`;
    return `N${Math.round(180-half)}°${wChar}`;
  } else {
    let sNorm = s % 180;
    let ns, ew, angle;
    // CAMBIO: En el segundo sector axial, usar N y O/W para conservar el rumbo al reinterpretarlo.
    if(sNorm<=90){ ns='N'; ew='E'; angle=sNorm; } else { ns='N'; ew=wChar; angle=180-sNorm; }
    angle=Math.round(angle);
    // CAMBIO: Evitar N-S y E-O/E-W; el parser requiere N0°E y N90°E.
    return ns+angle+'°'+ew;
  }
}

function dipDirQuadrant(dipDirAz){
  if(dipDirAz==null||isNaN(dipDirAz)) return '—';
  const az=norm360(dipDirAz);
  const dirsEs=[['N',0],['NNE',22.5],['NE',45],['ENE',67.5],['E',90],['ESE',112.5],['SE',135],['SSE',157.5],
                ['S',180],['SSO',202.5],['SO',225],['OSO',247.5],['O',270],['ONO',292.5],['NO',315],['NNO',337.5]];
  const dirsEn=[['N',0],['NNE',22.5],['NE',45],['ENE',67.5],['E',90],['ESE',112.5],['SE',135],['SSE',157.5],
                ['S',180],['SSW',202.5],['SW',225],['WSW',247.5],['W',270],['WNW',292.5],['NW',315],['NNW',337.5]];
  const dirs = currentLang==='en'? dirsEn : dirsEs;
  let best=dirs[0], bd=999;
  dirs.forEach(d=>{ let diff=Math.abs(az-d[1]); if(diff>180) diff=360-diff; if(diff<bd){bd=diff; best=d;} });
  return best[0];
}

// CAMBIO: Convertir un azimut al cuadrante válido más cercano del selector de rake.
function nearestRakeQuad(az){
  const options = [['N',0],['NE',45],['E',90],['SE',135],['S',180],['SO',225],['O',270],['NO',315]];
  const target = norm360(az);
  let best = options[0], bestDistance = Infinity;
  for(const option of options){
    const distance = Math.abs(((target - option[1] + 540) % 360) - 180);
    if(distance < bestDistance || (distance === bestDistance && option[1] < best[1])){
      best = option;
      bestDistance = distance;
    }
  }
  return best[0];
}

function calculateRakeFromTP(dipDir, dip, trend, plunge){
  if(dip==null || trend==null || plunge==null || dip===0) return null;
  const sinR = Math.sin(toRad(plunge)) / Math.sin(toRad(dip));
  const rakeDeg = roundInt(toDeg(Math.asin(clamp(sinR, -1, 1))));
  const strike = norm360((dipDir||0) - 90);
  const strikeOpp = norm360(strike + 180);
  let diff1 = Math.abs(trend - strike); if(diff1>180) diff1 = 360-diff1;
  let diff2 = Math.abs(trend - strikeOpp); if(diff2>180) diff2 = 360-diff2;
  const refAz = diff1 <= diff2 ? strike : strikeOpp;
  // CAMBIO: Utilizar exclusivamente las ocho direcciones del selector de rake.
  const quad = nearestRakeQuad(refAz);
  return { rake: rakeDeg, quadrant: quad };
}

function switchInputNotation(formKey, mode){
  // CAMBIO: Actualizar la variable global y guardarla para que el panel reaccione instantáneamente
  inputNotation = mode;
  localStorage.setItem('geo_input_notation', mode);

  ['dipdir','strike','quadrant'].forEach(m=>{
    const el = document.getElementById(`box_${m==='quadrant'?'quad':m}_${formKey}`);
    if(el) el.style.display = (m === mode) ? 'block' : 'none';
  });

  // CAMBIO: Forzar la actualización del panel de lectura en vivo para reflejar los nuevos rótulos
  updateLiveDial();
  // CAMBIO: Actualizar las equivalencias desde el azimut existente sin reinterpretar el cuadrante al cambiar de vista.
  onOrientationInputChange(formKey, 'dipdir');
}

function syncDip(formKey, val){
  setVal('dip_'+formKey, val);
  setVal('dip2_'+formKey, val);
  setVal('dip3_'+formKey, val);
  onOrientationInputChange(formKey, 'dipdir');
}

function onOrientationInputChange(formKey, fromSource, isManualQuadrant = false){ // CAMBIO: Distinguir entrada humana y sincronización interna.
  let dipDir = parseInt(document.getElementById('dipDir_'+formKey)?.value, 10);
  let dip = parseInt(document.getElementById('dip_'+formKey)?.value, 10);
  let strike = parseInt(document.getElementById('strike_'+formKey)?.value, 10);
  let quad = document.getElementById('quad_'+formKey)?.value;

  if(fromSource === 'strike'){
    if(!isNaN(strike)){
      dipDir = roundInt(norm360(strike + 90));
      setVal('dipDir_'+formKey, dipDir);
      setVal('quad_'+formKey, toQuadrant(strike));
    }
  } else if(fromSource === 'quadrant' && isManualQuadrant){ // CAMBIO: Respetar el lado de manteo que el usuario selecciona explícitamente.
    const parsedStrike = parseQuadrantToStrike(quad);
    if(parsedStrike != null){
      // CAMBIO: El cuadrante define una línea axial; la dirección de manteo determina cuál rumbo cumple RHR.
      const opposite = document.getElementById('quadDipSide_'+formKey)?.value === 'opposite';
      strike = roundInt(norm360(parsedStrike + (opposite ? 180 : 0)));
      dipDir = roundInt(norm360(strike + 90));
      setVal('strike_'+formKey, strike);
      setVal('dipDir_'+formKey, dipDir);
    } else { // CAMBIO: Evitar mostrar equivalencias de una entrada cuadrantal inválida.
      strike = NaN;
      dipDir = NaN;
      setVal('strike_'+formKey, '');
      setVal('dipDir_'+formKey, '');
    }
  } else if(fromSource === 'dipdir' || fromSource === 'quadrant'){ // CAMBIO: No invertir rumbos procedentes de sensores, registros o guardado.
    if(!isNaN(dipDir)){
      strike = roundInt(norm360(dipDir - 90));
      setVal('strike_'+formKey, strike);
      setVal('quad_'+formKey, toQuadrant(strike));
    }
  }

  // CAMBIO: Actualizar las dos opciones y sincronizar el selector sin alterar el rumbo RHR actual.
  const sideEl = document.getElementById('quadDipSide_'+formKey);
  if(sideEl){
    const axial = parseQuadrantToStrike(document.getElementById('quad_'+formKey)?.value);
    sideEl.disabled = axial == null;
    if(axial != null){
      const dipA = roundInt(norm360(axial + 90));
      const dipB = roundInt(norm360(axial + 270));
      sideEl.options[0].textContent = pad3(dipA) + '° (' + dipDirQuadrant(dipA) + ')';
      sideEl.options[1].textContent = pad3(dipB) + '° (' + dipDirQuadrant(dipB) + ')';
      if(!isNaN(dipDir)) sideEl.value = roundInt(norm360(dipDir)) === dipB ? 'opposite' : 'canonical';
    } else {
      sideEl.options[0].textContent = t('quadDipSidePending');
      sideEl.options[1].textContent = t('quadDipSidePending');
    }
  }

  const out = document.getElementById('derived_'+formKey);
  if(!out) return;
  // CAMBIO: Mostrar siempre las otras dos notaciones, sin repetir el modo seleccionado.
  const mode = document.getElementById('notSel_'+formKey)?.value || inputNotation;
  const labels = mode === 'quadrant' ? [t('strikeRHR'), t('derivedDipDirection')]
               : mode === 'strike' ? [t('derivedDipDirection'), t('quadrant')]
               : [t('strikeRHR'), t('quadrant')];
  if(isNaN(dipDir) || isNaN(dip) || isNaN(strike)){
    out.textContent = labels[0]+': — · '+labels[1]+': —';
    return;
  }
  const highlighted = (label, value) => `${label}: <b style="color:var(--accent)">${value}</b>`;
  const strikeDisplay = highlighted(t('strikeRHR'), `${strike}°`);
  const quadrantDisplay = highlighted(t('quadrant'), toQuadrant(strike));
  const dipDirectionDisplay = highlighted(t('derivedDipDirection'), `${dipDir}°`);
  const otherFormats = mode === 'quadrant' ? [strikeDisplay, dipDirectionDisplay]
                    : mode === 'strike' ? [dipDirectionDisplay, quadrantDisplay]
                    : [strikeDisplay, quadrantDisplay];
  out.innerHTML = otherFormats.join(' &nbsp;·&nbsp; ') + ' &nbsp;·&nbsp; ' + highlighted(t('dipTowards'), dipDirQuadrant(dipDir));
}

async function nextStationName(campId){

  stations.forEach(s=>{ const m=/EST-(\d+)/.exec(s.name||''); if(m) max=Math.max(max,parseInt(m[1],10)); });

}

function utmFromLatLon(){
  const lat=parseFloat(document.getElementById('f_lat')?.value);
  const lon=parseFloat(document.getElementById('f_lon')?.value);
  if(isNaN(lat)||isNaN(lon)) return;
  const r=llToUTM(lat,lon);
  setVal('f_utmZone', r.zoneNumber);
  const hemiEl=document.getElementById('f_utmHemi'); if(hemiEl) hemiEl.value=r.hemisphere;
  setVal('f_utmEast', r.easting);
  setVal('f_utmNorth', r.northing);
}
function latLonFromUtm(){
  const zone=parseInt(document.getElementById('f_utmZone')?.value,10);
  const hemi=document.getElementById('f_utmHemi')?.value||'S';
  const east=parseInt(document.getElementById('f_utmEast')?.value, 10);
  const north=parseInt(document.getElementById('f_utmNorth')?.value, 10);
  if(isNaN(zone)||isNaN(east)||isNaN(north)){ toast('Completa UTM'); return; }
  const r=utmToLL(east, north, zone, hemi);
  setVal('f_lat', r.lat);
  setVal('f_lon', r.lon);
}
function captureGpsIntoStation(){
  if(gpsState.lat==null){ toast('Sin señal GPS'); return; }
  setVal('f_lat', gpsState.lat.toFixed(6));
  setVal('f_lon', gpsState.lon.toFixed(6));
  if(gpsState.alt!=null) setVal('f_alt', Math.round(gpsState.alt));
  utmFromLatLon();
}

// CAMBIO: Consultar coincidencias de nombre dentro de la misma campaña.
async function stationNameExists(campaignId, name, excludeId) {
  const normalizedName = String(name ?? '').trim().toLocaleLowerCase();
  if (!normalizedName) return false;

  const stations = await dbGetByCampaign(campaignId);

  return stations.some(station =>
    station.id !== excludeId &&
    station.campaignId === campaignId &&
    String(station.name ?? '').trim().toLocaleLowerCase() === normalizedName
  );
}

async function saveStation(id, isNew){
  // CAMBIO: Limpiar errores previos en campos de estación
  document.querySelectorAll('.error-msg').forEach(function(e){ e.remove(); });
  document.querySelectorAll('.field-error').forEach(function(e){ e.classList.remove('field-error'); });
  let hasError = false;
  let firstErrorEl = null;

  function check(inputId, kind, isReq) {
    const el = document.getElementById(inputId);
    if (!el) return null;
    const res = validateField(kind, el.value, isReq);
    if (!res.ok) {
      hasError = true;
      el.classList.add('field-error');
      const msg = document.createElement('div');
      msg.className = 'error-msg';
      msg.textContent = res.message;
      el.parentNode.appendChild(msg);
      if (!firstErrorEl) firstErrorEl = el;
    } else if (res.value !== null) {
      el.value = res.value; // Normaliza
    }
    return res.value;
  }

  // CAMBIO: Validar componentes espaciales
  const lat = check('f_lat', 'lat', false);
  const lon = check('f_lon', 'lon', false);
  check('f_utmZone', 'utmZone', false);
  check('f_utmEast', 'easting', false);
  check('f_utmNorth', 'northing', false);

  if (hasError) {
    if (firstErrorEl) firstErrorEl.focus();
    return; // Detiene la grabación
  }

  const name = document.getElementById('f_name').value.trim() || id;
    // CAMBIO: Pedir confirmación solamente cuando existe otra estación homónima.
  if (await stationNameExists(state.campId, name, isNew ? null : id)) {
    if (!confirm(t('stationDuplicateWarning'))) return;
  }
  const dt = document.getElementById('f_dt').value;
  const alt = parseInt(document.getElementById('f_alt').value, 10);
  const notes = document.getElementById('f_notes').value;
  
  const obj = { 
    id: id, 
    campaignId: state.campId, 
    name: name, 
    timestamp: dt ? new Date(dt).toISOString() : nowIso(),
    lat: isNaN(lat) || lat === null ? null : lat, 
    lon: isNaN(lon) || lon === null ? null : lon, 
    alt: isNaN(alt) ? null : alt, 
    notes: notes 
  };
  
  await dbPut('stations', obj);
    // CAMBIO: Usar traducción centralizada para el guardado.
  toast(t('stationSavedPolish'));
  Nav.station(id, state.campId);
}

// CAMBIO: Sistema de fotos y compresión
const PHOTO_CFG = { maxDim: 1600, quality: 0.75, thumbDim: 256, maxPhotos: 12 };
let pendingPhotos = [];
let currentPhotoObjUrl = null;

async function compressPhoto(file) {
  let bmp;
  try {
    bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (e) {
    bmp = await new Promise((res, rej) => {
      const img = new Image();
      const u = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(u); res(img); };
      img.onerror = rej;
      img.src = u;
    });
  }
  
  const w = bmp.width, h = bmp.height;
  const ratio = Math.min(PHOTO_CFG.maxDim / w, PHOTO_CFG.maxDim / h, 1);
  const cw = Math.round(w * ratio), ch = Math.round(h * ratio);
  
  const cvs = document.createElement('canvas');
  cvs.width = cw; cvs.height = ch;
  const ctx = cvs.getContext('2d');
  ctx.drawImage(bmp, 0, 0, cw, ch);
  
  const blob = await new Promise(r => cvs.toBlob(r, 'image/jpeg', PHOTO_CFG.quality));
  
  const tr = Math.min(PHOTO_CFG.thumbDim / w, PHOTO_CFG.thumbDim / h, 1);
  const tw = Math.round(w * tr), th = Math.round(h * tr);
  const tvs = document.createElement('canvas');
  tvs.width = tw; tvs.height = th;
  tvs.getContext('2d').drawImage(bmp, 0, 0, tw, th);
  const thumb = tvs.toDataURL('image/jpeg', 0.6);
  
  return { blob, thumb, width: cw, height: ch, bytes: blob.size };
}

async function handlePhotoCapture(e, ownerKind, ownerId, stationId) {
  const files = e.target.files;
  if (!files || files.length === 0) return;
  
  let currentCount = pendingPhotos.length;
  if (ownerId !== 'NEW') {
    // CAMBIO: Consulta de fotos por índice
    const existing = await dbGetPhotosBy('ownerId', ownerId);
    currentCount += existing.length;
  }
  
  if (currentCount >= PHOTO_CFG.maxPhotos) {
    toast(t('photoLimit'));
    e.target.value = '';
    return;
  }
  
  // CAMBIO: Traducción de procesamiento
  toast(t('processingPhoto'));
  try {
    const compressed = await compressPhoto(files[0]);
    const pObj = {
      id: uid(), ownerKind, ownerId: (ownerId==='NEW' ? null : ownerId), stationId,
      blob: compressed.blob, thumb: compressed.thumb,
      width: compressed.width, height: compressed.height,
      bytes: compressed.bytes, createdAt: nowIso()
    };
    
    if (ownerKind === 'measurement') {
       pendingPhotos.push(pObj);
       renderPendingPhotos();
    } else if (ownerKind === 'station') {
       await dbPut('photos', pObj);
       renderSavedPhotos(ownerId, 'stationPhotoGrid');
    }
  } catch(err) {
    toast(t('photoSaveError'));
  }
  e.target.value = '';
}

// CAMBIO: Umbrales compartidos de actitudes degeneradas (grados).
const ATTITUDE_LIMITS = Object.freeze({ horizontalDip:1, verticalDip:89, verticalPlunge:89 });

// CAMBIO: Clasificar exclusivamente a partir de valores finitos entre 0 y 90°.
function classifyAttitude(dip, plunge){
  const valid = v => v != null && !(typeof v === 'string' && v.trim() === '') && Number.isFinite(Number(v)) && Number(v) >= 0 && Number(v) <= 90;
  const plane = !valid(dip) ? null : Number(dip) <= ATTITUDE_LIMITS.horizontalDip ? 'horizontal' : Number(dip) >= ATTITUDE_LIMITS.verticalDip ? 'vertical' : 'inclined';
  const line = !valid(plunge) ? null : Number(plunge) >= ATTITUDE_LIMITS.verticalPlunge ? 'vertical' : 'inclined';
  return { plane, line };
}

// CAMBIO: Una dirección ausente solo es admisible en un plano horizontal.
function isAzimuthRequired(dip){
  return classifyAttitude(dip, null).plane !== 'horizontal';
}

// CAMBIO: Un trend ausente solo es admisible en una lineación vertical.
function isTrendRequired(plunge){
  return classifyAttitude(null, plunge).line !== 'vertical';
}

// CAMBIO: Umbrales únicos y editables del error angular, expresados en grados.
const STRIA_MISFIT_LIMITS = Object.freeze({ ok:5, warn:10 });

// CAMBIO: Calcular la desviación angular entre una estría y su plano (E, N, U).
function computeStriaMisfit(dipDir, dip, trend, plunge){
  // CAMBIO: Admitir direcciones ausentes solo en actitudes degeneradas.
  const plane = classifyAttitude(dip, null).plane;
  const line = classifyAttitude(null, plunge).line;
  if(plane == null || line == null) return null;
  const noDipDir = dipDir == null || dipDir === '';
  const noTrend = trend == null || trend === '';
  if((noDipDir && plane !== 'horizontal') || (noTrend && line !== 'vertical')) return null;
  const dd = noDipDir ? 0 : dipDir;
  const tr = noTrend ? 0 : trend;
  if(!Number.isFinite(dd) || dd < 0 || dd > 360 || !Number.isFinite(tr) || tr < 0 || tr > 360) return null;
  // CAMBIO: Aproximar como 0°/90° cuando faltan direcciones físicamente inestables.
  const dp = noDipDir ? 0 : dip;
  const pl = noTrend ? 90 : plunge;
  const ddR=toRad(dd), dpR=toRad(dp), trR=toRad(tr), plR=toRad(pl);
  const normal=[Math.sin(dpR)*Math.sin(ddR), Math.sin(dpR)*Math.cos(ddR), Math.cos(dpR)];
  const stria=[Math.cos(plR)*Math.sin(trR), Math.cos(plR)*Math.cos(trR), -Math.sin(plR)];
  const angleDeg=toDeg(Math.asin(clamp(Math.abs(V3.dot(normal, stria)), 0, 1)));
  const level=angleDeg<=STRIA_MISFIT_LIMITS.ok?'ok':angleDeg<=STRIA_MISFIT_LIMITS.warn?'warn':'bad';
  return { angleDeg, level };
}

// CAMBIO: Mostrar el error solo para Trend/Plunge completo y con plano definido.
function updateStriaMisfit(){
  const out=document.getElementById('striaMisfit');
  if(!out) return;
  const hide=()=>{ out.hidden=true; out.textContent=''; out.removeAttribute('data-level'); };
  if(document.querySelector('input[name="striaeMode"]:checked')?.value!=='trendplunge') return hide();

  const notation=document.getElementById('notSel_fp')?.value;
  const azId=notation==='strike'?'strike_fp':notation==='quadrant'?'quad_fp':'dipDir_fp';
  const dipId=notation==='strike'?'dip2_fp':notation==='quadrant'?'dip3_fp':'dip_fp';
  const dipText=document.getElementById(dipId)?.value.trim();
  const plungeText=document.getElementById('plunge_fl')?.value.trim();
  if(!dipText || !plungeText) return hide();
  const dip=Number(dipText), plunge=Number(plungeText);
  const azText=document.getElementById(azId)?.value.trim();
  const trendText=document.getElementById('trend_fl')?.value.trim();
  // CAMBIO: Exigir cada dirección solo cuando su actitud la define.
  if((!azText && isAzimuthRequired(dip)) || (!trendText && isTrendRequired(plunge))) return hide();
  if(notation==='quadrant' && azText && parseQuadrantToStrike(azText)==null) return hide();
  const ddText=document.getElementById('dipDir_fp')?.value.trim();
  const dipDir=ddText ? Number(ddText) : null;
  const trend=trendText ? Number(trendText) : null;
  const misfit=computeStriaMisfit(dipDir,dip,trend,plunge);
  if(!misfit) return hide();

  const key=misfit.level==='ok'?'striaMisfitOk':misfit.level==='warn'?'striaMisfitWarn':'striaMisfitBad';
  out.textContent=t(key).replace('{angle}',misfit.angleDeg.toFixed(2));
  out.dataset.level=misfit.level;
  out.hidden=false;
}

// CAMBIO: Espesor verdadero puro; reutiliza la geometría de B1 sin alterarla.
function computeTrueThickness(Ta, dipDir, dip, slope, slopeSense, lineAzimuth){
  const hasLine = lineAzimuth !== null && lineAzimuth !== undefined && String(lineAzimuth).trim() !== '';
  const method = hasLine ? 'general' : 'simplified';
  const assumptions = ['thickAssumeConstant', 'thickAssumeTerrain'];
  if(method === 'simplified') assumptions.unshift('thickAssumeDipLine');
  const invalid = () => ({ value:null, method, angleDeg:null, assumptions, warnings:['invalid'] });
  const validNumber = v => v !== null && v !== undefined && String(v).trim() !== '' && Number.isFinite(Number(v));
  if(!validNumber(Ta) || Number(Ta) < 0 || !validNumber(dip) || Number(dip) < 0 || Number(dip) > 90) return invalid();
  if(!['same','opp','flat'].includes(slopeSense)) return invalid();
  if(slopeSense !== 'flat' && (!validNumber(slope) || Number(slope) < 0 || Number(slope) > 90)) return invalid();

  const dp = Number(dip);
  const incline = slopeSense === 'flat' ? 0 : Number(slope);
  let angleDeg;
  if(method === 'simplified'){
    const rawAngle = slopeSense === 'same' ? dp - incline : slopeSense === 'opp' ? dp + incline : dp;
    angleDeg = toDeg(Math.asin(clamp(Math.abs(Math.sin(toRad(rawAngle))), 0, 1)));
  } else {
    if(!validNumber(lineAzimuth) || Number(lineAzimuth) < 0 || Number(lineAzimuth) > 360) return invalid();
    if((isAzimuthRequired(dp) && !validNumber(dipDir)) ||
       (validNumber(dipDir) && (Number(dipDir) < 0 || Number(dipDir) > 360))) return invalid();
    const trend = norm360(Number(lineAzimuth) + (slopeSense === 'opp' ? 180 : 0));
    try {
      const geometry = computeStriaMisfit(validNumber(dipDir) ? norm360(Number(dipDir)) : null, dp, trend, incline);
      if(!geometry || !Number.isFinite(geometry.angleDeg)) return invalid();
      angleDeg = Math.abs(geometry.angleDeg);
    } catch(e){
      return invalid();
    }
  }
  if(!Number.isFinite(angleDeg)) return invalid();
  const value = Math.abs(Number(Ta) * Math.sin(toRad(angleDeg)));
  if(!Number.isFinite(value)) return invalid();
  return { value, method, angleDeg, assumptions, warnings:angleDeg < 5 ? ['parallel'] : [] };
}

  }
  const result = readContactThicknessForm();
  const out = document.getElementById('thicknessOut');
  if(!out) return result.value;
  // CAMBIO: El resultado se presenta sin redondear el dato que se guardará.
  const displayValue = result.value === null ? '—' : result.value.toFixed(3);
  const displayAngle = result.angleDeg === null ? '—' : result.angleDeg.toFixed(3) + '°';
  const methodLabel = result.method === 'general' ? t('thickMethodGeneral') : t('thickMethodSimplified');
  const assumptions = result.assumptions.map(key => `<div class="thick-assumption">ℹ ${esc(t(key))}</div>`).join('');
  const warnings = result.warnings.map(key => `<div class="thick-warning">${esc(t(key === 'parallel' ? 'thickWarningParallel' : 'thickWarningInvalid'))}</div>`).join('');
  out.innerHTML = `<div class="thick-result"><b>${esc(t('trueThick'))}: ${displayValue} m</b></div>` +
    `<div class="thick-meta">${esc(t('thickMethodLabel'))}: ${esc(methodLabel)} · ${esc(t('thickAngleLabel'))}: ${displayAngle}</div>` +
    assumptions + warnings;
  return result.value;
}

async function saveMeasurement(id, isNew){
  // CAMBIO: Limpiar errores previos
  document.querySelectorAll('.error-msg').forEach(function(e){ e.remove(); });
  document.querySelectorAll('.field-error').forEach(function(e){ e.classList.remove('field-error'); });
  let hasError = false;
  let firstErrorEl = null;

  // CAMBIO: Función interna para procesar la validación y pintar el DOM
  function check(inputId, kind, isReq) {
    const el = document.getElementById(inputId);
    if (!el) return null;
    const res = validateField(kind, el.value, isReq);
    if (!res.ok) {
      hasError = true;
      el.classList.add('field-error');
      const msg = document.createElement('div');
      msg.className = 'error-msg';
      msg.textContent = res.message;
      el.parentNode.appendChild(msg);
      if (!firstErrorEl) firstErrorEl = el;
    } else if (res.value !== null && kind !== 'quadrant') {
      el.value = res.value; // Escribir de vuelta el valor normalizado (ej. 360 -> 0)
    }
    return res.value;
  }

  // CAMBIO: Determinar los inputs a validar según la notación activa
  function checkPlane(formKey) {
    let dipId = 'dip_' + formKey;
    let azId = 'dipDir_' + formKey;
    let azKind = 'azimuth';
    if (inputNotation === 'strike') {
      dipId = 'dip2_' + formKey;
      azId = 'strike_' + formKey;
    } else if (inputNotation === 'quadrant') {
      dipId = 'dip3_' + formKey;
      azId = 'quad_' + formKey;
      azKind = 'quadrant';
    }

    const dipVal = check(dipId, 'angle', true);
    // CAMBIO: Respetar el umbral horizontal compartido.
    const azReq = isAzimuthRequired(dipVal);
    check(azId, azKind, azReq);

    // Asegurar que los inputs ocultos se sincronicen con el valor validado
    onOrientationInputChange(formKey, inputNotation);
  }

  const type = state.measType;
  const obj = { id: id, stationId: state.stationId, type: type, timestamp: nowIso(), notes: document.getElementById('f_notes').value };

  // CAMBIO: Ejecutar todas las validaciones aplicables al formulario
  if (type === 'planar') {
    obj.subtype = document.getElementById('f_subtype').value;
    if (LINEAR_SUBTYPES.includes(obj.subtype)) {
      // CAMBIO: Trend opcional solamente para lineación vertical.
      check('trend_l1', 'azimuth', isTrendRequired(document.getElementById('plunge_l1')?.value));
      check('plunge_l1', 'angle', true);
    } else {
      checkPlane('p1');
    }
  } else if (type === 'fault') {
    checkPlane('fp');
    const striaeMode = document.querySelector('input[name=striaeMode]:checked') ? document.querySelector('input[name=striaeMode]:checked').value : 'rake';
    if (striaeMode === 'trendplunge') {
      // CAMBIO: Trend opcional solamente para estría vertical.
      check('trend_fl', 'azimuth', isTrendRequired(document.getElementById('plunge_fl')?.value));
      check('plunge_fl', 'angle', true);
    }
    check('f_rake', 'angle', false);
  } else if (type === 'contact') {
    checkPlane('c1');
    check('f_appThickness', 'positive', false);
    check('f_bedDip', 'angle', false);
    check('f_slope', 'angle', false);
        // CAMBIO: Validar el azimut opcional con el kind existente; 360 pasa a 0.
    check('f_lineAzimuth', 'azimuth', false);
  } else if (type === 'vein') {
    checkPlane('v1');
    check('f_veinThick', 'positive', false);
    check('f_veinDensity', 'positive', false);
  }

  if (hasError) {
    if (firstErrorEl) firstErrorEl.focus();
    return; // CAMBIO: Detener el guardado en IndexedDB
  }

  // Poblado final del objeto garantizado con valores ya limpios
  if (type === 'planar') {
    if (LINEAR_SUBTYPES.includes(obj.subtype)) {
      obj.trend = intOrNull('trend_l1');
      obj.plunge = intOrNull('plunge_l1');
    } else {
      obj.dipDir = intOrNull('dipDir_p1');
      obj.dip = intOrNull('dip_p1');
      obj.strike = obj.dipDir != null ? roundInt(norm360(obj.dipDir - 90)) : null;
    }
  } else if (type === 'fault') {
    obj.dipDir = intOrNull('dipDir_fp');
    obj.dip = intOrNull('dip_fp');
    obj.strike = obj.dipDir != null ? roundInt(norm360(obj.dipDir - 90)) : null;
    obj.striaeMode = document.querySelector('input[name=striaeMode]:checked') ? document.querySelector('input[name=striaeMode]:checked').value : 'rake';
    if (obj.striaeMode === 'trendplunge') {
      obj.trend = intOrNull('trend_fl');
      obj.plunge = intOrNull('plunge_fl');
    }
    obj.rake = intOrNull('f_rake');
    obj.rakeQuadrant = document.getElementById('f_rakeQuad') ? document.getElementById('f_rakeQuad').value : null;
    obj.sense = document.getElementById('f_sense').value;
    obj.senseQuality = document.getElementById('f_senseQuality').value;
    obj.criteria = Array.from(document.querySelectorAll('.crit-chk:checked')).map(function(c){ return c.value; });
        // CAMBIO: Guardar el texto libre recortado sin exigir que esté completo.
    obj.criteriaOther = document.getElementById('f_criteriaOther')?.value.trim() || '';
  } else if (type === 'contact') {
    obj.contactType = document.getElementById('f_contactType').value;
    obj.dipDir = intOrNull('dipDir_c1');
    obj.dip = intOrNull('dip_c1');
    obj.strike = obj.dipDir != null ? roundInt(norm360(obj.dipDir - 90)) : null;
    obj.lithoTop = document.getElementById('f_lithoTop').value;
    obj.lithoBottom = document.getElementById('f_lithoBottom').value;
    obj.appThickness = intOrNull('f_appThickness');
    obj.bedDip = intOrNull('f_bedDip');
    obj.slope = intOrNull('f_slope');
    obj.slopeSense = document.getElementById('f_slopeSense').value;
    // CAMBIO: Persistir únicamente las entradas y el método B3 adicionales.
    obj.lineAzimuth = document.getElementById('f_lineAzimuth').value === '' ? '' : Number(document.getElementById('f_lineAzimuth').value);
    const thickness = readContactThicknessForm();
    obj.thicknessMethod = thickness.method;
    obj.trueThickness = thickness.value;
  } else if (type === 'vein') {
    obj.structKind = document.querySelector('input[name=structKind]:checked') ? document.querySelector('input[name=structKind]:checked').value : 'Veta';
    obj.dipDir = intOrNull('dipDir_v1');
    obj.dip = intOrNull('dip_v1');
    obj.strike = obj.dipDir != null ? roundInt(norm360(obj.dipDir - 90)) : null;
    obj.veinThickness = intOrNull('f_veinThick');
    obj.veinUnit = document.getElementById('f_veinUnit').value;
    obj.veinDensity = intOrNull('f_veinDensity');
    obj.mineralogy = Array.from(document.querySelectorAll('.min-chk:checked')).map(function(c){ return c.value; });
    obj.mineralOther = document.getElementById('f_mineralOther').value;
    obj.texture = document.getElementById('f_texture').value;
    obj.alteration = Array.from(document.querySelectorAll('.alt-chk:checked')).map(function(c){ return c.value; });
    obj.intensity = document.getElementById('f_intensity').value;
  }
  
  // CAMBIO: F5: agregar captureMeta solo cuando algún panel tenga procedencia en esta sesión.
  const capturePanels=Object.fromEntries(Object.entries(sensorCaptureStage).map(([key,entry])=>[key,{...entry}]));
  if(Object.keys(capturePanels).length) obj.captureMeta={version:1,panels:capturePanels};

  await dbPut('measurements', obj);
  // CAMBIO: Guardar fotos pendientes ligándolas a la medición ya creada
  let photosFailed = false;
  for (const p of pendingPhotos) {
    try {
      p.ownerId = obj.id;
      await dbPut('photos', p);
    } catch(err) {
      photosFailed = true;
    }
  }
  pendingPhotos = [];
  if (photosFailed) toast(t('photoSaveError'));
  toast(currentLang === 'es' ? 'Guardado' : 'Saved');
  Nav.station(state.stationId, state.campId);
}

function updateLiveDial(){
  document.querySelectorAll('[id^="dial_"]').forEach(svg=>{
    const formKey=svg.id.replace('dial_','');
    const mode=svg.closest('.sensor-box')?.dataset.mode||'planar';
    drawDial(svg, mode);
    // CAMBIO: F4: no reutilizar lecturas antiguas cuando el sensor no está activo.
    const r=sensorState.status==='active' ? sensorState.last : null;
    // CAMBIO: F1a: calcular la estabilidad desde la ventana reciente de este modo.
    updateReadingStability(formKey, mode);
    // CAMBIO: Actualizar la referencia solo cuando cambia, evitando parpadeos.
    const reference=document.getElementById('orientation_ref_'+formKey);
    if(reference){
      // CAMBIO: F2: actualizar la referencia completa sin alterar cálculos ni lectura.
      paintNorthReference(reference,sensorState.meta);
    }

    const dd=document.getElementById('live_dipdir_'+formKey);
    const dp=document.getElementById('live_dip_'+formKey);
    const tr=document.getElementById('live_trend_'+formKey);
    const pl=document.getElementById('live_plunge_'+formKey);

    // CAMBIO: Referencias a los rótulos del DOM
    const lblDd=document.getElementById('lbl_live_dipdir_'+formKey);
    const lblDp=document.getElementById('lbl_live_dip_'+formKey);

    if(mode === 'planar') {
      // CAMBIO: Obtener lectura formateada mediante función pura
      // CAMBIO: F4: fuera de active, ambas magnitudes muestran ausencia de datos.
      const readout = r ? formatPlaneReadout(r.dipDir, r.dip, inputNotation, quadrantPref) : {label1:t(inputNotation==='strike'?'readoutStrike':inputNotation==='quadrant'?'readoutQuadrant':'readoutDipDir'),label2:t('readoutDip'),value1:'—',value2:'—'};
      if(lblDd) lblDd.textContent = readout.label1;
      if(lblDp) lblDp.textContent = readout.label2;
      if(dd) dd.textContent = readout.value1;
      if(dp) dp.textContent = readout.value2;
    } else {
      // CAMBIO: Un plunge vertical no tiene trend definido.
      if(tr) tr.textContent = r && classifyAttitude(null, r.plunge).line === 'vertical' ? t('attitudeVertical') : r && Number.isFinite(r.trend) ? roundInt(r.trend)+'°' : '—';
      if(pl) pl.textContent = r && Number.isFinite(r.plunge) ? roundInt(r.plunge)+'°' : '—';
    }
  });
}

function drawDial(svg, mode){
  const r=sensorState.last;
  let heading = 0;
  if(r){
    if(mode==='planar'){
      heading = (needleMode==='strike') ? r.strike : r.dipDir;
    } else {
      heading = r.trend;
    }
  }

    // CAMBIO: No dibujar un azimut arbitrario si la dirección es indefinida.
  const headingDefined = !r || (mode==='planar' ? classifyAttitude(r.dip, null).plane !== 'horizontal' : classifyAttitude(null, r.plunge).line !== 'vertical');

  const mag = r ? (mode==='planar'? r.dip : r.plunge) : 0;
  let ticks='';
  for(let i=0;i<36;i++){
    const ang=i*10, len = (i%3===0)?12:6;
    const rad=toRad(ang);
    const x1=70+58*Math.sin(rad), y1=70-58*Math.cos(rad);
    const x2=70+(58-len)*Math.sin(rad), y2=70-(58-len)*Math.cos(rad);
    ticks+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--border)" stroke-width="${i%9===0?2:1}"/>`;
  }
  const needleRad=toRad(heading);
  const nx=70+46*Math.sin(needleRad), ny=70-46*Math.cos(needleRad);
  const barW = clamp(mag/90,0,1)*100;
  svg.innerHTML = `
    <circle cx="70" cy="70" r="62" fill="var(--surface-2)" stroke="var(--border)" stroke-width="1.5"/>
    ${ticks}
    <text x="70" y="16" text-anchor="middle" fill="var(--text-dim)" font-size="9">N</text>
    <text x="124" y="74" text-anchor="middle" fill="var(--text-dim)" font-size="9">E</text>
    <text x="70" y="130" text-anchor="middle" fill="var(--text-dim)" font-size="9">S</text>
    <text x="16" y="74" text-anchor="middle" fill="var(--text-dim)" font-size="9">${currentLang==='es'?'O':'W'}</text>
    ${headingDefined ? `<line x1="70" y1="70" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>` : ''}
    <circle cx="70" cy="70" r="4" fill="var(--accent)"/>
    <rect x="20" y="118" width="100" height="6" rx="3" fill="var(--surface)" stroke="var(--border)" />
    <rect x="20" y="118" width="${barW}" height="6" rx="3" fill="var(--accent)" />
  `;
}

// CAMBIO: F5: entrada pura de procedencia creada desde el resultado F1a o la última lectura.
function buildCaptureMeta({source, reliable, magOffset, summary, ts}){
  const trusted=reliable===true;
  const offset=Number(magOffset);
  const averaged=summary && Number.isFinite(summary.n) && summary.n>=READING_AVG_CONFIG.MIN_SAMPLES;
  const rounded=v=>Number.isFinite(v)?Math.round(v*10)/10:null;
  return {
    mode:'sensor',
    source:['absolute-event','ios-compass','relative-event'].includes(source)?source:null,
    northRef:trusted?(Number.isFinite(offset)&&offset!==0?'true':'magnetic'):'unknown',
    declination:trusted&&Number.isFinite(offset)?offset:null,
    nReadings:averaged?summary.n:1,
    sdIncl:averaged?rounded(summary.sd?.incl):null,
    sdAz:averaged?rounded(summary.sd?.az):null,
    level:averaged&&['ok','warn','bad'].includes(summary.level)?summary.level:'single',
    ts
  };
}

// CAMBIO: F5: descripción pura según el idioma recibido, sin modificar currentLang.
function describeCaptureMeta(entry, lang){
  const dict=I18N[lang]||I18N.es;
  const tr=key=>dict[key]||I18N.es[key]||key;
  if(entry.mode==='manual') return tr('captureManualLabel');
  if(entry.mode==='sensor-edited') return tr('captureSensorEdited');
  const fmt=value=>new Intl.NumberFormat(lang==='en'?'en-US':'es-CL',{maximumFractionDigits:1}).format(value);
  const parts=[tr('captureSensorLabel')];
  if(entry.northRef==='true'){
    const decl=entry.declination;
    parts.push(tr('captureNorthTrue')+(Number.isFinite(decl)?' ('+fmt(Math.abs(decl))+'° '+tr(decl<0?'northWest':'northEast')+')':''));
  } else if(entry.northRef==='magnetic') parts.push(tr('captureNorthMagnetic'));
  else parts.push(tr('captureNorthUnknown'));
  if(Number.isFinite(entry.nReadings)) parts.push(entry.nReadings===1?tr('captureOneReading'):tr('captureManyReadings').replace('{n}',fmt(entry.nReadings)));
  if(entry.level==='single') parts.push(tr('captureSingle'));
  else if(Number.isFinite(entry.sdIncl) || Number.isFinite(entry.sdAz)){
    parts.push('σ '+(Number.isFinite(entry.sdIncl)?fmt(entry.sdIncl)+'°':'—')+' / '+(Number.isFinite(entry.sdAz)?fmt(entry.sdAz)+'°':'—'));
  }
  return parts.join(' · ');
}

// CAMBIO: F5: solo input/change de controles de orientación, nunca setters ni selector de notación.
function captureMetaOnUserInput(event){
  const field=event.target;
  if(!(field instanceof HTMLElement) || !document.getElementById('measForm')?.contains(field)) return;
  const match=/^(?:dipDir|dip|dip2|dip3|strike|quad|quadDipSide|trend|plunge)_(p1|l1|fp|fl|c1|v1)$/.exec(field.id);
  if(!match) return;
  const key=match[1];
  const entry=sensorCaptureStage[key];
  if(entry){
    if(entry.mode==='sensor' || entry.mode==='sensor-edited') entry.mode='sensor-edited';
    else if(entry.mode==='manual') entry.ts=now();
  } else {
    sensorCaptureStage[key]={mode:'manual',source:null,northRef:null,declination:null,nReadings:null,sdIncl:null,sdAz:null,level:null,ts:now()};
  }
}

// CAMBIO: F5: delegado una sola vez y vaciado al abandonar el formulario.
function initCaptureMetaListeners(){
  document.addEventListener('input',captureMetaOnUserInput);
  document.addEventListener('change',captureMetaOnUserInput);
  const app=document.getElementById('app');
  if(app) new MutationObserver(()=>{
    if(!document.getElementById('measForm')){
      for(const key of Object.keys(sensorCaptureStage)) delete sensorCaptureStage[key];
    }
  }).observe(app,{childList:true});
}

// CAMBIO: F5: activar seguimiento sin intervenir en los cálculos ni eventos existentes.
initCaptureMetaListeners();

function captureSensorReading(formKey, mode){
  // CAMBIO: B4-3: informar el estado exacto si no hay una lectura activa.
  if(sensorState.status!=='active' || !sensorState.last){ toast(sensorState.status==='active' ? (currentLang==='es'?'Sin datos de sensor':'No sensor data yet') : sensorStatusMessage()); return; }
  // CAMBIO: F1a: excluir los últimos 300 ms y capturar la media si hay cinco muestras.
  const summary=summarizeReadings(recentSensorReadings(READING_AVG_CONFIG.AVG_WINDOW_MS,READING_AVG_CONFIG.AVG_SKIP_LAST_MS),mode);
  const averaged=summary.n>=READING_AVG_CONFIG.MIN_SAMPLES;
  const r=averaged ? summary.mean : sensorState.last;
  // CAMBIO: Nunca transferir una dirección sin referencia magnética confiable.
  // CAMBIO: F1a: fiabilidad azimutal de la media; conservar la anterior en fallback.
  const reliable=averaged ? Number.isFinite(mode==='planar'?r.dipDir:r.trend) : sensorState.meta?.reliable===true;
  if(mode==='planar'){
    // CAMBIO: No escribir azimuts cuando el plano es horizontal.
    const horizontal = classifyAttitude(r.dip, null).plane === 'horizontal';
    // CAMBIO: Reutilizar la excepción horizontal B2 y añadir la fiabilidad.
    setVal('dipDir_'+formKey, (!reliable || horizontal) ? '' : roundInt(r.dipDir));
    setVal('dip_'+formKey, roundInt(r.dip));

    // CAMBIO: Asegurar el llenado de los campos de manteo alternativos independientemente de la vista
    setVal('dip2_'+formKey, roundInt(r.dip));
    setVal('dip3_'+formKey, roundInt(r.dip));

    setVal('strike_'+formKey, (!reliable || horizontal) ? '' : roundInt(r.strike));
    setVal('quad_'+formKey, (!reliable || horizontal) ? '' : toQuadrant(r.strike));

    // CAMBIO: Procesar el cambio derivado indicando el origen dinámico
    onOrientationInputChange(formKey, inputNotation);
  } else {
    // CAMBIO: No escribir trend cuando la lineación es vertical.
    setVal('trend_'+formKey, (!reliable || classifyAttitude(null, r.plunge).line === 'vertical') ? '' : roundInt(r.trend));
    setVal('plunge_'+formKey, roundInt(r.plunge));
  }

  // CAMBIO: F5: capturar procedencia para el panel, también si F1a recurrió a lectura única.
  sensorCaptureStage[formKey]=buildCaptureMeta({source:sensorState.meta?.source??null,reliable,magOffset,summary:averaged?summary:null,ts:now()});

  // CAMBIO: No calcular rake a partir de una dirección eliminada por falta de referencia.
  if(formKey==='fl' || formKey==='fp'){
    if(reliable) autoCalcRakeIfReady();
    else updateStriaMisfit();
  }
  // CAMBIO: Sincronizar avisos aunque los setters no disparen eventos.
  updateAttitudeNotices();
  // CAMBIO: F1a: informar n, σ y advertir sin bloquear; fallback explícito.
  if(!averaged){
    toast(t('readingAverageFallback')+(!reliable?' '+t('orientationUnreliableCapture'):''));
    return;
  }
  const message=t('readingAverage')
    .replace('{n}',String(summary.n))
    .replace('{incl}',summary.sd.incl.toFixed(1)+'°')
    .replace('{az}',summary.sd.az===null?'—':summary.sd.az.toFixed(1)+'°');
  const warning=summary.level==='bad'?t('readingAverageBad'):summary.level==='warn'?t('readingAverageWarn'):'';
  toast(message+(warning?' '+warning:'')+(!reliable && summary.reasons.includes('azimuth-unreliable')?' '+t('orientationUnreliableCapture'):''));
}
