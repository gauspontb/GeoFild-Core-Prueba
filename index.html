<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14181c">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>GeoField Core - GIS & Estereogramas</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#14181c;
    --surface:#1c2227;
    --surface-2:#232a30;
    --border:#333c44;
    --border-soft:#2a3239;
    --text:#eef2f5;
    --text-dim:#8a97a3;
    --text-faint:#5c6770;
    --accent:#e8a33d;
    --accent-dim:#7a5a25;
    --accent-text:#1a1400;
    --danger:#e0645c;
    --danger-dim:#4a2422;
    --ok:#5fb583;
    --warn:#e8a33d;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --radius: 10px;
    --topbar-h: 52px;
    --navbar-h: 60px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  body.theme-sun{
    --bg:#f4f6f8;
    --surface:#ffffff;
    --surface-2:#e5e9ec;
    --border:#b0bec5;
    --border-soft:#cfd8dc;
    --text:#0a0c0e;
    --text-dim:#37474f;
    --text-faint:#78909c;
    --accent:#d87a00;
    --accent-dim:#ffe0b2;
    --accent-text:#0a0c0e;
    --danger:#c62828;
    --danger-dim:#ffcdd2;
    --ok:#2e7d32;
    --warn:#ef6c00;
  }
    /* CAMBIO: Paleta Obsidiana rosé. */
  body.theme-earth{
    --bg:#1D1920;
    --surface:#302630;
    --surface-2:#443541;
    --border:#705764;
    --border-soft:#5C4755;
    --text:#F5E9E7;
    --text-dim:#DCC1C9;
    --text-faint:#BFA2B0;
    --accent:#E4AAAF;
    --accent-dim:#68414E;
    --accent-text:#32191F;
    --danger:#F18B8B;
    --danger-dim:#612B37;
    --ok:#8CCFB0;
    --warn:#EBC184;
  }
  
  /* CAMBIO: Paleta Carbón y azul hielo. */
  body.theme-yellow{
    --bg:#171C24;
    --surface:#293340;
    --surface-2:#374658;
    --border:#58697C;
    --border-soft:#475767;
    --text:#EDF4FB;
    --text-dim:#B9CAD8;
    --text-faint:#9BAFC0;
    --accent:#9ACDEA;
    --accent-dim:#36576C;
    --accent-text:#102533;
    --danger:#E99094;
    --danger-dim:#60303B;
    --ok:#82D8B4;
    --warn:#EDC780;
  }
  
  /* CAMBIO: Paleta Rosado claro con texto oscuro y acento accesible. */
  body.theme-pink{
    --bg:#FCE4EC;
    --surface:#FFF5F8;
    --surface-2:#F8D7E3;
    --border:#EBB9CC;
    --border-soft:#EFC9D7;
    --text:#2B1620;
    --text-dim:#6B4556;
    --text-faint:#8F6F7E;
    --accent:#C2185B;
    --accent-dim:#F5B5CE;
    --accent-text:#FFFFFF;
    --danger:#c62828;
    --danger-dim:#ffcdd2;
    --ok:#2e7d32;
    --warn:#ef6c00;
  }

  /* CAMBIO: Nueva paleta Cobalto eléctrico. */
  body.theme-cobalt{
    --bg:#101625;
    --surface:#202C47;
    --surface-2:#30416A;
    --border:#536A97;
    --border-soft:#405783;
    --text:#F0F4FF;
    --text-dim:#CFD9F0;
    --text-faint:#B1C2DE;
    --accent:#94B4FF;
    --accent-dim:#314D8E;
    --accent-text:#132448;
    --danger:#FF979C;
    --danger-dim:#602B43;
    --ok:#8CE0BD;
    --warn:#E8C887;
  }

  /* CAMBIO: Nueva paleta Ceniza y lima suave. */
  body.theme-lime{
    --bg:#1B1D1A;
    --surface:#30342D;
    --surface-2:#41493A;
    --border:#68755F;
    --border-soft:#53614D;
    --text:#F3F4E9;
    --text-dim:#DAE0CB;
    --text-faint:#B9C5AD;
    --accent:#C5DE83;
    --accent-dim:#455B30;
    --accent-text:#253016;
    --danger:#EAA09A;
    --danger-dim:#5C3735;
    --ok:#93D4A8;
    --warn:#E9C781;
  }

  /* CAMBIO: Nueva paleta Arcilla y celeste. */
  body.theme-clay{
    --bg:#211D1C;
    --surface:#35302E;
    --surface-2:#4A403B;
    --border:#76675E;
    --border-soft:#62554E;
    --text:#F6EEE9;
    --text-dim:#DFCFC4;
    --text-faint:#C4B2A6;
    --accent:#A4D6E9;
    --accent-dim:#395C67;
    --accent-text:#17303A;
    --danger:#F29A8B;
    --danger-dim:#673C35;
    --ok:#8AD5AA;
    --warn:#EBC37F;
  }

  /* CAMBIO: Nueva paleta Amatista mineral. */
  body.theme-amethyst{
    --bg:#181527;
    --surface:#2B2540;
    --surface-2:#3F3556;
    --border:#635580;
    --border-soft:#50446B;
    --text:#F3EEFA;
    --text-dim:#D9CFEB;
    --text-faint:#BBAED1;
    --accent:#A7E4D4;
    --accent-dim:#345F5B;
    --accent-text:#18352E;
    --danger:#F198AC;
    --danger-dim:#622F46;
    --ok:#89D6B6;
    --warn:#EBC881;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:var(--sans);
    touch-action:manipulation;
    overscroll-behavior-y:none;
    -webkit-text-size-adjust:100%;
  }
  body{ display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; }
  input,select,textarea,button{ font-family:inherit; }
  h1,h2,h3,p{ margin:0; }
  ::selection{ background:var(--accent-dim); }

  #topbar{
    flex:0 0 auto;
    padding-top:var(--safe-t);
    background:var(--surface);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:10px;
    height:calc(var(--topbar-h) + var(--safe-t));
    padding-left:14px; padding-right:10px;
  }
  #topbar .brand{ display:flex; flex-direction:column; line-height:1.1; margin-right:auto; }
  #topbar .brand b{ font-size:15px; letter-spacing:.3px; }
  #topbar .brand span{ font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.8px; }
  .status-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--text-faint); box-shadow:0 0 0 3px rgba(255,255,255,0.03); }
  .status-dot.ok{ background:var(--ok); }
  .status-dot.warn{ background:var(--warn); animation:pulse 1.4s infinite; }
  /* CAMBIO: B4-3: quitar el parpadeo del estado amarillo del sensor sin alterar el GPS. */
  #sensorDot.status-dot.warn{ animation:none; }
  .status-dot.err{ background:var(--danger); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .status-chip{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-dim); padding:6px 8px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border-soft); }
  .icon-btn{ width:36px; height:36px; border-radius:8px; border:1px solid var(--border-soft); background:var(--surface-2); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; }
  /* CAMBIO: F4: chips táctiles, responsivos y sin animaciones. */
#topbar {
  height: auto;
  min-height: calc(var(--topbar-h) + var(--safe-t));
  flex-wrap: wrap;
  gap: 6px;
  padding-bottom: 5px;
}

#topbar .brand {
  min-width: 0;
  flex: 1 1 95px;
}

#topbar .status-chip {
  min-height: 40px;
  min-width: 0;
  max-width: 100%;
  padding: 7px 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  border: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: 8px;
  cursor: pointer;
  touch-action: manipulation;
  animation: none;
}

#topbar .status-chip[data-level="ok"] {
  border-color: var(--ok);
}

#topbar .status-chip[data-level="warn"] {
  border-color: var(--warn);
}

#topbar .status-chip[data-level="err"] {
  border-color: var(--danger);
}

#topbar .status-chip:focus-visible,
#statusPanel button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

#topbar .status-chip .status-dot {
  flex: 0 0 9px;
  animation: none;
}

#topbar .status-chip .chip-label {
  overflow: hidden;
  text-overflow: ellipsis;
}

#statusPanel {
  position: fixed;
  z-index: 90;
  top: calc(var(--topbar-h) + var(--safe-t) + 8px);
  right: 10px;
  width: min(330px, calc(100vw - 20px));
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 4px 16px var(--border);
}

#statusPanel[hidden] {
  display: none;
}

#statusPanel .status-panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

#statusPanel .status-panel-message {
  margin: 10px 0;
  font-size: 13px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

#statusPanel .status-panel-close {
  min-width: 40px;
  min-height: 40px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-2);
  color: var(--text);
  cursor: pointer;
}

#statusPanel .status-panel-retry {
  min-height: 40px;
}

/* CAMBIO: F4: respetar hidden aunque el botón utilice display de .btn. */
#statusPanel .status-panel-retry[hidden] {
  display: none;
}

@media (max-width: 400px) {
  #topbar {
    justify-content: space-between;
  }

  #topbar .brand {
    flex-basis: calc(100% - 55px);
  }

  #topbar .status-chip {
    flex: 1 1 100px;
  }
}

  #app{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 14px calc(24px + var(--safe-b)) 14px; position:relative; }
  #app.no-pad{ padding:0; overflow:hidden; }

  #navbar{
    flex:0 0 auto;
    display:flex;
    background:var(--surface);
    border-top:1px solid var(--border);
    padding-bottom:var(--safe-b);
    height:calc(var(--navbar-h) + var(--safe-b));
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    background:transparent; border:none; color:var(--text-faint); font-size:10px; letter-spacing:.3px; cursor:pointer;
  }
  .nav-btn .ic{ font-size:18px; }
  .nav-btn.active{ color:var(--accent); font-weight:700; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    min-height:48px; padding:10px 16px; border-radius:var(--radius);
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    font-size:15px; font-weight:600; width:100%; cursor:pointer;
  }
  .btn:active{ filter:brightness(1.15); }
  .btn.primary{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .btn.danger{ background:var(--danger-dim); color:#ffd7d3; border-color:#5c2f2c; }
  .btn.ghost{ background:transparent; }
  .btn.small{ min-height:38px; padding:6px 12px; font-size:13px; width:auto; }
  .btn-row{ display:flex; gap:10px; }
  .btn-row .btn{ flex:1; }

  .fab{
    position:fixed; right:calc(18px); bottom:calc(var(--navbar-h) + var(--safe-b) + 18px);
    width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--accent-text);
    border:none; font-size:28px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.4); z-index:20; cursor:pointer;
  }

  .card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px; margin-bottom:12px; cursor:pointer; }
  .card-title{ font-size:16px; font-weight:700; }
  .card-sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .badge-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .badge{ font-size:10.5px; background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border-soft); padding:3px 8px; border-radius:20px; }
  .badge.accent{ color:var(--accent); border-color:var(--accent-dim); }

  .empty{ text-align:center; padding:40px 20px; color:var(--text-faint); }
  .empty .big{ font-size:38px; margin-bottom:10px; }

  label{ display:block; font-size:12px; color:var(--text-dim); margin:14px 0 6px; font-weight:600; letter-spacing:.2px; }
  label:first-child{ margin-top:0; }
  .hint{ font-size:11px; color:var(--text-faint); margin-top:4px; }
  input[type=text], input[type=number], input[type=datetime-local], select, textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:12px 12px; font-size:15px; min-height:46px;
  }
  select{ -webkit-appearance:none; appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--text-dim) 50%),linear-gradient(135deg,var(--text-dim) 50%,transparent 50%); background-position:calc(100% - 18px) center, calc(100% - 13px) center; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
  textarea{ min-height:70px; resize:vertical; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--accent); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .check-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px; }
  .check-item{ display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:8px; padding:9px 10px; font-size:13px; cursor:pointer; }
  .check-item input{ width:16px; height:16px; min-height:unset; }
  .radio-row{ display:flex; gap:8px; margin-top:6px; }
  .radio-row label.opt{ flex:1; display:flex; align-items:center; justify-content:center; gap:6px; margin:0; padding:10px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border-soft); font-size:12.5px; font-weight:600; color:var(--text-dim); cursor:pointer; }
  .radio-row input{ display:none; }
  .radio-row label.opt.on{ border-color:var(--accent); color:var(--accent); background:rgba(232,163,61,0.08); }

  .switch-row{ display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:8px; padding:10px 12px; margin-top:10px; }
  .switch{ position:relative; width:46px; height:26px; }
  .switch input{ opacity:0; width:100%; height:100%; position:absolute; margin:0; cursor:pointer; }
  .switch .track{ position:absolute; inset:0; background:var(--border); border-radius:20px; transition:.15s; }
  .switch .thumb{ position:absolute; top:3px; left:3px; width:20px; height:20px; background:#fff; border-radius:50%; transition:.15s; }
  .switch input:checked + .track{ background:var(--accent); }
  .switch input:checked + .track .thumb{ transform:translateX(20px); }

  .section-hdr{ display:flex; align-items:center; justify-content:space-between; margin:20px 0 10px; }
  .section-hdr h3{ font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-dim); }

  details.accordion{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; }
  details.accordion > summary{ list-style:none; padding:14px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
  details.accordion > summary::-webkit-details-marker{ display:none; }
  details.accordion .sum-l{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:14.5px; }
  details.accordion .chev{ color:var(--text-faint); transition:.15s; }
  details.accordion[open] .chev{ transform:rotate(90deg); }
  .accordion-body{ padding:0 14px 14px; }
  .mini-row{ display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:8px; padding:10px 12px; margin-top:8px; }
  .mini-row .ml{ font-size:13px; }
  .mini-row .ml b{ display:block; font-size:14px; }
  .mini-row .ml span{ color:var(--text-dim); font-size:11.5px; font-family:var(--mono); }
  .mini-actions{ display:flex; gap:6px; }
  .icon-sm{ width:32px; height:32px; border-radius:7px; border:1px solid var(--border-soft); background:var(--bg); color:var(--text-dim); display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; }

  .topline{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .back-btn{ width:38px; height:38px; border-radius:9px; background:var(--surface-2); border:1px solid var(--border-soft); color:var(--text); font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .topline h2{ font-size:18px; }
  .topline .sub{ font-size:11px; color:var(--text-dim); }

  .sensor-box{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px; margin:14px 0; }
  .sensor-box.scale-lg{ padding:20px; border-width:2px; }
  .sensor-box.scale-xl{ padding:26px; border-width:2px; }
  .sensor-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .sensor-head b{ font-size:13px; }
  .dial-wrap{ display:flex; gap:14px; align-items:center; margin-top:10px; }
  .dial-readout{ flex:1; }
  /* CAMBIO: Separar la barra inferior del dial sin modificar su tamaño. */
.sensor-box .dial-wrap > svg[id^="dial_"] {
  overflow: visible;
  margin-bottom: 36px;
}

/* CAMBIO: Mover exclusivamente los dos rectángulos de la barra. */
.sensor-box .dial-wrap > svg[id^="dial_"] > rect:nth-last-of-type(-n+2) {
  transform-box: view-box;
}

/* CAMBIO: Dial de 90 px. */
.sensor-box .dial-wrap > svg[id^="dial_"][width="90"] > rect:nth-last-of-type(-n+2) {
  transform: translateY(41px);
}

/* CAMBIO: Dial de 120 px. */
.sensor-box .dial-wrap > svg[id^="dial_"][width="120"] > rect:nth-last-of-type(-n+2) {
  transform: translateY(36px);
}

/* CAMBIO: Dial de 160 px. */
.sensor-box .dial-wrap > svg[id^="dial_"][width="160"] > rect:nth-last-of-type(-n+2) {
  transform: translateY(33px);
}

/* CAMBIO: Dial de 210 px. */
.sensor-box .dial-wrap > svg[id^="dial_"][width="210"] > rect:nth-last-of-type(-n+2) {
  transform: translateY(31px);
}
  .readout-line{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:12.5px; padding:3px 0; border-bottom:1px dashed var(--border-soft); }
  .readout-line b{ color:var(--accent); font-size:15px; }

  .scale-lg .readout-line{ font-size:14px; padding:5px 0; }
  .scale-lg .readout-line b{ font-size:18px; }
  .scale-xl .readout-line{ font-size:16px; padding:7px 0; }
  .scale-xl .readout-line b{ font-size:22px; }

  .numfield-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .derived{ margin-top:10px; font-size:11.5px; color:var(--text-dim); background:var(--surface-2); border:1px solid var(--border-soft); border-radius:8px; padding:8px 10px; font-family:var(--mono); }

  .toast{ position:fixed; left:50%; bottom:calc(var(--navbar-h) + var(--safe-b) + 16px); transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--accent-dim); color:var(--text); padding:10px 16px; border-radius:20px; font-size:13px; z-index:50; box-shadow:0 4px 16px rgba(0,0,0,.4); }
  .guide-box{ background:var(--surface-2); border:1px solid var(--border-soft); border-radius:8px; padding:12px; font-size:13px; line-height:1.5; color:var(--text); margin-top:8px; }
  .guide-box ul{ padding-left:18px; margin:6px 0; }
    /* CAMBIO: Lectura cómoda de la Guía en dispositivos móviles. */
  .guide-section .guide-content{
    color:var(--text);
    font-size:14px;
    line-height:1.65;
  }

  .guide-section .guide-content h3{
    color:var(--accent);
    font-size:14px;
    margin:18px 0 8px;
  }

  .guide-section .guide-content h3:first-child{
    margin-top:6px;
  }

  .guide-section .guide-content ul,
  .guide-section .guide-content ol{
    padding-left:22px;
    margin:8px 0 14px;
  }

  .guide-section .guide-content li{
    padding-left:3px;
    margin-bottom:9px;
  }

  .guide-section .guide-content strong{
    color:var(--text);

const DB_NAME='geofieldcore_db', DB_VERSION=5; // CAMBIO: Sube la versión a 5
let DB=null;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded=(e)=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('campaigns')) d.createObjectStore('campaigns',{keyPath:'id'});
      if(!d.objectStoreNames.contains('stations')) d.createObjectStore('stations',{keyPath:'id'});
      if(!d.objectStoreNames.contains('measurements')) d.createObjectStore('measurements',{keyPath:'id'});
      if(!d.objectStoreNames.contains('map_overlays')) d.createObjectStore('map_overlays',{keyPath:'id'});
      // CAMBIO: Se agrega almacén de fotos
      if(!d.objectStoreNames.contains('photos')) {
        const ps = d.createObjectStore('photos', {keyPath:'id'});
        ps.createIndex('ownerId', 'ownerId', {unique:false});
        ps.createIndex('stationId', 'stationId', {unique:false});
      }
    };
    req.onsuccess=(e)=>{ 
      DB=e.target.result; 
      // CAMBIO: Manejo de onversionchange para no bloquear futuras actualizaciones
      DB.onversionchange = () => {
        DB.close();
        toast(t('closeTabs'));
      };
      resolve(DB); 
    };
    // CAMBIO: Manejo de onblocked
    req.onblocked=()=>toast(t('closeTabs'));
    req.onerror=(e)=>reject(e.target.error);
  });
}

function tx(store,mode){ return DB.transaction(store,mode).objectStore(store); }
function dbPut(store,obj){ return new Promise((res,rej)=>{ const r=tx(store,'readwrite').put(obj); r.onsuccess=()=>res(obj); r.onerror=()=>rej(r.error); }); }
function dbGet(store,id){ return new Promise((res,rej)=>{ const r=tx(store,'readonly').get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbGetAll(store){ return new Promise((res,rej)=>{ const r=tx(store,'readonly').getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); }); }
function dbDelete(store,id){ return new Promise((res,rej)=>{ const r=tx(store,'readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }

// CAMBIO: Funciones de índice para rendimiento y helpers de codificación para Blob en base64
function dbGetPhotosBy(indexName, key) {
  return new Promise((resolve, reject) => {
    const req = tx('photos', 'readonly').index(indexName).getAll(key);
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function base64ToBlob(b64, type) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: type || 'image/jpeg' });
}

async function dbGetByStation(stationId){
  const all = await dbGetAll('measurements');
  return all.filter(m => m.stationId === stationId);
}
async function dbGetByCampaign(campId){
  const all = await dbGetAll('stations');
  return all.filter(s => s.campaignId === campId);
}

async function dbDeleteStationCascade(stationId){
  const meas = await dbGetByStation(stationId);
  for(const m of meas) {
    await dbDelete('measurements', m.id);
    // CAMBIO: Uso eficiente del índice de fotos
    const mPhotos = await dbGetPhotosBy('ownerId', m.id);
    for(const p of mPhotos) await dbDelete('photos', p.id);
  }
  // CAMBIO: Uso eficiente del índice de fotos
  const sPhotos = await dbGetPhotosBy('ownerId', stationId);
  for(const p of sPhotos) await dbDelete('photos', p.id);
  
  await dbDelete('stations', stationId);
}

async function dbDeleteCampaignCascade(campId){
  const sts = await dbGetByCampaign(campId);
  for(const s of sts) await dbDeleteStationCascade(s.id);
  await dbDelete('campaigns', campId);
}

/* =========================================================
   MATEMÁTICAS VECTORIALES 3D Y ESTEREOGRAMA
   ========================================================= */
const V3 = {
  cross: (a, b) => [
    a[1] * b[2] - a[2] * b[1],
    a[2] * b[0] - a[0] * b[2],
    a[0] * b[1] - a[1] * b[0]
  ],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  norm: (v) => {
    const l = Math.hypot(v[0], v[1], v[2]);
    return l > 1e-12 ? [v[0] / l, v[1] / l, v[2] / l] : [0, 0, 0];
  },
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  scale: (v, s) => [v[0] * s, v[1] * s, v[2] * s],
  toLowerHemi: (v) => (v[2] < 0 ? [-v[0], -v[1], -v[2]] : [v[0], v[1], v[2]])
};

function trendPlungeToVector(tr, pl) {
  const trR = toRad(tr), plR = toRad(pl);
  return [Math.sin(trR) * Math.cos(plR), Math.cos(trR) * Math.cos(plR), Math.sin(plR)];
}

function vectorToTrendPlunge(v) {
  const vn = V3.toLowerHemi(v);
  let tr = norm360(toDeg(Math.atan2(vn[0], vn[1])));
  let pl = toDeg(Math.asin(clamp(vn[2], -1, 1)));
  return { trend: roundInt(tr), plunge: roundInt(pl) };
}

function planeToPoleVector(strike, dip) {
  const poleTr = norm360(strike - 90);
  const polePl = 90 - dip;
  return trendPlungeToVector(poleTr, polePl);
}

function faultRakeToSlipVector(strike, dip, rake, rakeQuad) {
  const sR = toRad(strike), dR = toRad(dip), rR = toRad(rake);
  const strikeVec = [Math.sin(sR), Math.cos(sR), 0];
  const dipVec = [Math.cos(sR) * Math.cos(dR), -Math.sin(sR) * Math.cos(dR), Math.sin(dR)];
  // CAMBIO: Convertir los ocho cuadrantes del selector a azimuts.
  const quadAzimuths = { N: 0, NE: 45, E: 90, SE: 135, S: 180, SO: 225, O: 270, NO: 315 };
  let rakeFromStrikeStart = true;
  // CAMBIO: Elegir el extremo más cercano; con cuadrante vacío o desconocido se conserva s.
  if (Object.prototype.hasOwnProperty.call(quadAzimuths, rakeQuad)) {
    const ref = quadAzimuths[rakeQuad], s = norm360(strike);
    const distS = Math.abs(((s - ref + 540) % 360) - 180);
    const distOpp = Math.abs(((s + 180 - ref + 540) % 360) - 180);
    // CAMBIO: En un empate de 90°/90°, prevalece el extremo s (RHR).
    if (distOpp < distS) rakeFromStrikeStart = false;
  }
  const sign = rakeFromStrikeStart ? 1 : -1;
  const slip = V3.add(V3.scale(strikeVec, sign * Math.cos(rR)), V3.scale(dipVec, Math.sin(rR)));
  return V3.norm(slip);
}

// CAMBIO: Resolver todos los alias hacia un único código interno sin modificar el dato guardado.
function canonicalSense(raw) {
  if (raw == null) return null;
  const key = String(raw).toLowerCase().replace(/\s+/g, '');
  const aliases = {
    normal: 'normal', n: 'normal',
        // CAMBIO: Reconocer explícitamente la ausencia de sentido cinemático determinado.
    undetermined: 'undetermined',
    sindeterminar: 'undetermined',
    indeterminado: 'undetermined',
    inverso: 'reverse', inversa: 'reverse', reverse: 'reverse', thrust: 'reverse', t: 'reverse',
    dextral: 'dextral', rl: 'dextral',
    sinistral: 'sinistral', ll: 'sinistral',
    'dextral-normal': 'normal_dextral', nr: 'normal_dextral', normal_dextral: 'normal_dextral',
    'sinistral-normal': 'normal_sinistral', nl: 'normal_sinistral', normal_sinistral: 'normal_sinistral',
    'dextral-inverso': 'reverse_dextral', tr: 'reverse_dextral', reverse_dextral: 'reverse_dextral',
    'sinistral-inverso': 'reverse_sinistral', tl: 'reverse_sinistral', reverse_sinistral: 'reverse_sinistral'
  };
  return Object.prototype.hasOwnProperty.call(aliases, key) ? aliases[key] : null;
}

function computeFaultKinematics(f) {
  // 1. Actitud del plano (Regla de la Mano Derecha / RHR)
  const strike = f.strike != null ? f.strike : norm360((f.dipDir || 0) - 90);
  const dip = f.dip != null ? f.dip : 0;
  const dipDir = norm360(strike + 90);

  const sR = toRad(strike);
  const dR = toRad(dip);
  const dipDirR = toRad(dipDir);

  // 2. Sistema ortonormal del plano (z positivo = abajo)
  const eStrike = [Math.sin(sR), Math.cos(sR), 0];
  const eDipDown = [Math.sin(dipDirR) * Math.cos(dR), Math.cos(dipDirR) * Math.cos(dR), Math.sin(dR)];

  // 3. Polos normalizados (planeToPoleVector apunta al yaciente con z positivo hacia abajo)
  const nFoot = planeToPoleVector(strike, dip);
  const nHang = [-nFoot[0], -nFoot[1], -nFoot[2]];

  // 4. Estría y vector de deslizamiento proyectado en el plano
  let u;
  if (f.striaeMode === 'trendplunge' && f.trend != null && f.plunge != null) {
    u = trendPlungeToVector(f.trend, f.plunge);
  } else if (f.rake != null) {
    u = faultRakeToSlipVector(strike, dip, f.rake, f.rakeQuadrant);
  } else {
    u = [...eDipDown];
  }
  u = V3.norm(u);

  // Proyectar sobre el plano para evitar desviaciones numéricas
  const uPlane = V3.sub(u, V3.scale(nHang, V3.dot(u, nHang)));
  const uLine = V3.norm(uPlane);

  // 5. Mapeo estricto de sentido cinemático (dipComponent, strikeComponent)
  // CAMBIO: El mapa contiene solamente códigos internos resueltos por canonicalSense.
  const senseMap = {
    'normal': [1, 0],
    'reverse': [-1, 0],
    'dextral': [0, 1],
    'sinistral': [0, -1],
    'normal_dextral': [1, 1],
    'reverse_dextral': [-1, 1],
    'normal_sinistral': [1, -1],
    'reverse_sinistral': [-1, -1]
  };

  // CAMBIO: Para lo desconocido, conservar la advertencia y el valor normal predeterminado.
  const rawSense = canonicalSense(f.sense) || String(f.sense || '').toLowerCase().replace(/\s+/g, '');
  let dipComp = 1, strikeComp = 0; // Default: normal

  if (senseMap.hasOwnProperty(rawSense)) {
    [dipComp, strikeComp] = senseMap[rawSense];
  } else if (rawSense) {
    console.warn('Sentido cinemático no reconocido, usando "normal":', f.sense);
  }

  // 6. Orientar el movimiento del bloque colgante (uHang)
  const targetDip = V3.scale(eDipDown, dipComp);
  const targetStrike = V3.scale(eStrike, -strikeComp); 
  const target = V3.add(targetDip, targetStrike);

  let uHang;
  if (V3.dot(uLine, target) >= 0) {
    uHang = [...uLine];
  } else {
    uHang = V3.scale(uLine, -1);
  }

  // 7. Cálculo de Ejes P y T
  const P = V3.toLowerHemi(V3.norm(V3.sub(nHang, uHang)));
  const T = V3.toLowerHemi(V3.norm(V3.add(nHang, uHang)));

  // 8. Eje nulo, plano auxiliar y estructura de retorno intacta
  const n = nFoot; 
  const b = V3.norm(V3.cross(n, uLine));

  const auxPole = V3.toLowerHemi(uHang);
  const auxTP = vectorToTrendPlunge(auxPole);
  const auxDipDir = norm360(auxTP.trend + 180);
  const auxDip = 90 - auxTP.plunge;

  return {
    n: V3.toLowerHemi(n),
    u: V3.toLowerHemi(uHang),
    b: V3.toLowerHemi(b),
    P,
    T,
    auxDipDir,
    auxDip,
    auxStrike: norm360(auxDipDir - 90),
    P_tp: vectorToTrendPlunge(P),
    T_tp: vectorToTrendPlunge(T)
  };
}

function calculateMeanOrientation(poles) {
  if (!poles || poles.length === 0) return null;
  let sum = [0, 0, 0];
  poles.forEach(p => { sum = V3.add(sum, p); });
  const R = Math.hypot(sum[0], sum[1], sum[2]);
  if (R < 1e-5) return null;
  const meanVec = V3.toLowerHemi(V3.scale(sum, 1 / R));
  const tp = vectorToTrendPlunge(meanVec);
  const dipDir = norm360(tp.trend + 180);
  const dip = 90 - tp.plunge;
  const strike = norm360(dipDir - 90);
  return { meanVec, dipDir, dip, strike, trend: tp.trend, plunge: tp.plunge, count: poles.length };
}

function project3D(v, type, R) {
  const vn = V3.toLowerHemi(v);
  const x = vn[0], y = vn[1], z = vn[2];
  let rProj = 0;
  if (type === 'schmidt') {
    rProj = R * Math.sqrt(Math.max(0, 1 - z));
  } else {
    const horiz = Math.hypot(x, y);
    rProj = (1 + z) > 1e-12 ? R * (horiz / (1 + z)) : 0;
  }
  const horizLen = Math.hypot(x, y);
  if (horizLen < 1e-7) return { x: 0, y: 0 };
  return { x: (x / horizLen) * rProj, y: -(y / horizLen) * rProj };
}

function unproject2D(px, py, type, R) {
  const dist = Math.hypot(px, py);
  if (dist > R) return null;
  const normDist = dist / R;
  let z = (type === 'schmidt') ? 1 - 2 * Math.pow(normDist / Math.SQRT2, 2) : (1 - normDist * normDist) / (1 + normDist * normDist);
  z = clamp(z, 0, 1);
  const horiz = Math.sqrt(Math.max(0, 1 - z * z));
  if (dist < 1e-7) return [0, 0, 1];
  return [(px / dist) * horiz, -(py / dist) * horiz, z];
}

/* =========================================================
   SISTEMA DE COORDENADAS / UTM (WGS84)
   ========================================================= */
const UTM_A=6378137.0, UTM_ECC2=0.00669438, UTM_K0=0.9996;
function llToUTM(lat, lon){
  const latRad=toRad(lat), lonRad=toRad(lon);
  const zoneNumber = Math.floor((lon+180)/6)+1;
  const lonOrigin = (zoneNumber-1)*6-180+3;
  const lonOriginRad = toRad(lonOrigin);
  const eccPrime2 = UTM_ECC2/(1-UTM_ECC2);
  const N = UTM_A/Math.sqrt(1-UTM_ECC2*Math.sin(latRad)*Math.sin(latRad));
  const T = Math.tan(latRad)*Math.tan(latRad);
  const C = eccPrime2*Math.cos(latRad)*Math.cos(latRad);
  const A = Math.cos(latRad)*(lonRad-lonOriginRad);
  const M = UTM_A*((1-UTM_ECC2/4-3*UTM_ECC2*UTM_ECC2/64-5*Math.pow(UTM_ECC2,3)/256)*latRad
            - (3*UTM_ECC2/8+3*UTM_ECC2*UTM_ECC2/32+45*Math.pow(UTM_ECC2,3)/1024)*Math.sin(2*latRad)
            + (15*UTM_ECC2*UTM_ECC2/256+45*Math.pow(UTM_ECC2,3)/1024)*Math.sin(4*latRad)
            - (35*Math.pow(UTM_ECC2,3)/3072)*Math.sin(6*latRad));
  let easting = UTM_K0*N*(A+(1-T+C)*Math.pow(A,3)/6
              + (5-18*T+T*T+72*C-58*eccPrime2)*Math.pow(A,5)/120) + 500000.0;
  let northing = UTM_K0*(M+N*Math.tan(latRad)*(A*A/2+(5-T+9*C+4*C*C)*Math.pow(A,4)/24
              + (61-58*T+T*T+600*C-330*eccPrime2)*Math.pow(A,6)/720));
  const hemisphere = lat<0 ? 'S' : 'N';
  if(lat<0) northing += 10000000.0;
  return { zoneNumber, hemisphere, easting: Math.round(easting), northing: Math.round(northing) };
}
function utmToLL(easting, northing, zoneNumber, hemisphere){
  const e1=(1-Math.sqrt(1-UTM_ECC2))/(1+Math.sqrt(1-UTM_ECC2));
  const x=easting-500000.0;
  let y=northing;
  if(hemisphere==='S') y -= 10000000.0;
  const lonOrigin=(zoneNumber-1)*6-180+3;
  const eccPrime2=UTM_ECC2/(1-UTM_ECC2);
  const M=y/UTM_K0;
  const mu=M/(UTM_A*(1-UTM_ECC2/4-3*UTM_ECC2*UTM_ECC2/64-5*Math.pow(UTM_ECC2,3)/256));
  const phi1 = mu + (3*e1/2-27*Math.pow(e1,3)/32)*Math.sin(2*mu)
             + (21*e1*e1/16-55*Math.pow(e1,4)/32)*Math.sin(4*mu)
             + (151*Math.pow(e1,3)/96)*Math.sin(6*mu)
             + (1097*Math.pow(e1,4)/512)*Math.sin(8*mu);
  const N1=UTM_A/Math.sqrt(1-UTM_ECC2*Math.sin(phi1)*Math.sin(phi1));
  const T1=Math.tan(phi1)*Math.tan(phi1);
  const C1=eccPrime2*Math.cos(phi1)*Math.cos(phi1);
  const R1=UTM_A*(1-UTM_ECC2)/Math.pow(1-UTM_ECC2*Math.sin(phi1)*Math.sin(phi1),1.5);
  const D=x/(N1*UTM_K0);
  let lat = phi1 - (N1*Math.tan(phi1)/R1)*(D*D/2
          - (5+3*T1+10*C1-4*C1*C1-9*eccPrime2)*Math.pow(D,4)/24
          + (61+90*T1+298*C1+45*T1*T1-252*eccPrime2-3*C1*C1)*Math.pow(D,6)/720);
  let lon = (D-(1+2*T1+C1)*Math.pow(D,3)/6
          + (5-2*C1+28*T1-3*C1*C1+8*eccPrime2+24*T1*T1)*Math.pow(D,5)/120)/Math.cos(phi1);
  // CAMBIO: Faltaba convertir 'lat' de radianes a grados con toDeg()
  return { lat: Number(toDeg(lat).toFixed(6)), lon: Number((lonOrigin+toDeg(lon)).toFixed(6)) };
}

function utmLabel(lat, lon){
  if(lat==null||lon==null||isNaN(lat)||isNaN(lon)) return null;
  const r=llToUTM(lat,lon);
  return { text: r.easting+' E, '+r.northing+' N ('+(currentLang==='es'?'Huso ':'Zone ')+r.zoneNumber+r.hemisphere+')', ...r };
}

function isSensorSecureContext(){

}

// CAMBIO: B4-3: función pura para decidir el estado inicial.
function computeInitialSensorStatus({secure, hasEvent, needsPermission}){
  if(!secure) return 'insecure';
  if(!hasEvent) return 'unsupported';
  return needsPermission ? 'needs-permission' : 'pending';
}

// CAMBIO: B4-3: función pura; solamente pending puede agotar el tiempo.
function checkSensorWatchdog(status, startedTs, nowMs){
  return status==='pending' && Number.isFinite(startedTs) && nowMs-startedTs>=SENSOR_CONFIG.SENSOR_NODATA_MS ? 'nodata' : status;
}

// CAMBIO: B4-3: resolver los mensajes con el sistema I18N existente.
function sensorStatusMessage(status=sensorState.status){
  return t('sensorStatus_'+status);
}

// CAMBIO: B4-3: cambiar el estado, reiniciar solamente el temporizador pending y sincronizar Ajustes.
function setSensorStatus(status){
  if(sensorState.watchdogTimer!==null){
    clearTimeout(sensorState.watchdogTimer);
    sensorState.watchdogTimer=null;
  }
  sensorState.status=status;
  sensorState.startedTs=status==='pending' ? now() : null;
  if(status==='pending') sensorState.watchdogTimer=setTimeout(runSensorWatchdog,SENSOR_CONFIG.SENSOR_NODATA_MS);
  updateTopbarStatus();
  const info=document.getElementById('sensorStateInfo');
  if(info) info.textContent=t('sensorStateLabel')+': '+sensorStatusMessage();
  const button=document.getElementById('sensorPermissionBtn');
  if(button) button.style.display=(status==='needs-permission'||status==='denied')?'':'none';
}

// CAMBIO: B4-3: el vigilante nunca degrada active.
function runSensorWatchdog(){
  const next=checkSensorWatchdog(sensorState.status,sensorState.startedTs,now());
  if(next!==sensorState.status) setSensorStatus(next);
}

// CAMBIO: B4-3: el éxito se notifica solamente con la primera lectura válida.

  if(sensorState.status!=='active') setSensorStatus('active');
  if(!sensorState.successShown){
    sensorState.successShown=true;
    toast(sensorStatusMessage());
  }
}

// CAMBIO: B4-3: al regresar de segundo plano, pedir una lectura nueva sin marcar error.
function onSensorVisibilityChange(){
  if(document.visibilityState==='visible' && sensorState.status==='active') setSensorStatus('pending');
}

// CAMBIO: B4-3: resolver el permiso sin invocar la API desde las pruebas.
function applySensorPermissionResult(response, failed=false){
  if(failed){
    sensorState.granted=null;
    setSensorStatus('needs-permission');
    return;
  }
  sensorState.granted=(response==='granted');
  if(sensorState.granted){
    setSensorStatus('pending');
    attachOrientationListener();
  } else {
    setSensorStatus('denied');
  }
}

function requestSensorPermission(){
  // CAMBIO: B4-3: no intentar activar sensores en un contexto inseguro o incompatible.
  if(!isSensorSecureContext()){ setSensorStatus('insecure'); return; }
  if(typeof DeviceOrientationEvent==='undefined'){ setSensorStatus('unsupported'); return; }
  if(typeof DeviceOrientationEvent.requestPermission==='function'){
    // CAMBIO: B4-3: mantener la solicitud iOS exclusivamente dentro del gesto del botón.
    try{
      Promise.resolve(DeviceOrientationEvent.requestPermission()).then(resp=>{
        applySensorPermissionResult(resp);
        if(sensorState.status==='denied') toast(sensorStatusMessage());
        render();
      }).catch(()=>{
        applySensorPermissionResult(null,true);
        toast(sensorStatusMessage());
        render();
      });
    } catch(e){
      // CAMBIO: B4-3: una excepción no equivale a rechazo explícito.
      applySensorPermissionResult(null,true);
      toast(sensorStatusMessage());
      render();
    }
  } else {
    // CAMBIO: B4-3: Android espera la primera lectura; no mostrar éxito anticipado.
    applySensorPermissionResult('granted');
  }
}

// CAMBIO: Reloj sustituible para comprobar los 1500 ms sin sensores reales.
function now(){ return Date.now(); }

// CAMBIO: Detectar la propiedad de evento estándar; no el nombre del evento.
function supportsAbsoluteOrientation(win){
  return 'ondeviceorientationabsolute' in win;
}

// CAMBIO: F2: formato este/oeste de la declinación según idioma.
function formatNorthDeclination(value){
  if(!Number.isFinite(value)) return '';
  return String(Number(Math.abs(value).toFixed(2)))+'° '+t(value<0?'northWest':'northEast');
}

// CAMBIO: F2: clasificación pura, independiente del DOM y de GPS.
function describeNorthReference({reliable,magOffset,estimatedDecl}){
  if(reliable!==true) return {key:'unreliable',level:'warn',declination:null};
  const applied=Number(magOffset);
  const estimate=Number.isFinite(estimatedDecl)?estimatedDecl:null;
  if(Number.isFinite(applied) && applied!==0){
    const mismatch=estimate!==null && Math.abs(applied-estimate)>=NORTH_REF_CONFIG.DECL_MISMATCH_MIN;
    return {key:mismatch?'true-mismatch':'true',level:mismatch?'warn':'ok',declination:applied};
  }
  const unapplied=estimate!==null && Math.abs(estimate)>=NORTH_REF_CONFIG.DECL_UNAPPLIED_MIN;
  return {key:unapplied?'magnetic-unapplied':'magnetic',level:unapplied?'warn':'ok',declination:estimate};
}

// CAMBIO: F2: estimación GPS reutilizada hasta variar 0.05° o transcurrir 30 s.
function getCachedEstimatedDeclination(){
  const lat=gpsState.lat, lon=gpsState.lon;
  if(gpsState.status!=='fix' || !Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat)>90 || Math.abs(lon)>180){
    northDeclinationCache.lat=null;
    northDeclinationCache.lon=null;
    northDeclinationCache.ts=null;
    northDeclinationCache.value=null;
    return null;
  }
  const ts=now();
  if(northDeclinationCache.ts===null || ts<northDeclinationCache.ts ||
     ts-northDeclinationCache.ts>=NORTH_REF_CONFIG.CACHE_MS ||
     Math.abs(lat-northDeclinationCache.lat)>NORTH_REF_CONFIG.CACHE_DEG ||
     Math.abs(lon-northDeclinationCache.lon)>NORTH_REF_CONFIG.CACHE_DEG){
    const estimated=estimateDeclination(lat,lon);
    northDeclinationCache.lat=lat;
    northDeclinationCache.lon=lon;
    northDeclinationCache.ts=ts;
    northDeclinationCache.value=Number.isFinite(estimated)?estimated:null;
  }
  return northDeclinationCache.value;
}

// CAMBIO: F2: texto y atributos comunes para el indicador inicial y vivo.
function northReferenceDisplay(meta){
  if(!meta) return {text:t('orientationPending'),reliable:'pending',level:'warn'};
  const estimatedDecl=getCachedEstimatedDeclination();
  const info=describeNorthReference({reliable:meta.reliable,magOffset,estimatedDecl});
  let text;
  if(info.key==='unreliable') text=t('orientationRelative');
  else if(info.key==='magnetic') text=t('orientationMagnetic');
  else if(info.key==='magnetic-unapplied'){
    text=t('northMagneticUnapplied').replace('{estimated}',formatNorthDeclination(estimatedDecl));
  } else if(info.key==='true-mismatch'){
    text=t('northTrueMismatch')
      .replace('{applied}',formatNorthDeclination(magOffset))
      .replace('{estimated}',formatNorthDeclination(estimatedDecl));
  } else {
    text=t('northTrue').replace('{decl}',formatNorthDeclination(magOffset));
  }
  return {text,reliable:String(meta.reliable),level:info.level};
}

function paintNorthReference(element,meta){
  const view=northReferenceDisplay(meta);
  if(element.dataset.reliable!==view.reliable) element.dataset.reliable=view.reliable;
  if(element.dataset.level!==view.level) element.dataset.level=view.level;
  if(element.textContent!==view.text) element.textContent=view.text;
}

// CAMBIO: Conservar la conversión de iOS y declarar fiabilidad y referencia.
function resolveOrientationSource({eventType, absolute, alpha, compassHeading, compassAccuracy}){
  if(Number.isFinite(compassHeading)){
    return { alphaDeg:norm360(360 - compassHeading), source:'ios-compass', reliable:!(typeof compassAccuracy==='number' && compassAccuracy<0), ref:'magnetic' };
  }
  if(eventType==='deviceorientationabsolute' || absolute===true){
    return { alphaDeg:alpha||0, source:'absolute-event', reliable:true, ref:'magnetic' };
  }
  return { alphaDeg:alpha||0, source:'relative-event', reliable:false, ref:'unknown' };
}

// CAMBIO: F1a: estadística pura para inclinación lineal y azimut circular.
function summarizeReadings(samples, mode){
  const planar=mode==='planar';
  if(!planar && mode!=='linear') throw new Error('Invalid reading mode');
  const inclKey=planar?'dip':'plunge', azKey=planar?'dipDir':'trend';
  const valid=(Array.isArray(samples)?samples:[]).filter(s=>s && Number.isFinite(s[inclKey]));
  const n=valid.length;
  const mean={dip:null,dipDir:null,strike:null,trend:null,plunge:null};
  const sd={incl:null,az:null};
  const reasons=[];
  if(n){
    const inclination=valid.reduce((sum,s)=>sum+s[inclKey],0)/n;
    mean[inclKey]=inclination;
    sd.incl=Math.sqrt(valid.reduce((sum,s)=>sum+(s[inclKey]-inclination)**2,0)/n);
    const reliable=valid.filter(s=>s.reliable===true && Number.isFinite(s[azKey]));
    // CAMBIO: F1a/B2: usar los umbrales inclusivos compartidos de classifyAttitude.
    const undefinedAz=planar?inclination<=ATTITUDE_LIMITS.horizontalDip:inclination>=ATTITUDE_LIMITS.verticalPlunge;
    if(undefinedAz) reasons.push('azimuth-undefined');
    else if(!reliable.length) reasons.push('azimuth-unreliable');
    else {
      const sin=reliable.reduce((sum,s)=>sum+Math.sin(toRad(s[azKey])),0)/reliable.length;
      const cos=reliable.reduce((sum,s)=>sum+Math.cos(toRad(s[azKey])),0)/reliable.length;
      const R=Math.hypot(sin,cos);
      if(R>1e-12){
        const az=norm360(toDeg(Math.atan2(sin,cos)));
        mean[azKey]=az;
        if(planar) mean.strike=norm360(az-90);
      } else reasons.push('azimuth-undefined');
      sd.az=toDeg(Math.sqrt(-2*Math.log(Math.min(1,Math.max(Number.MIN_VALUE,R)))));
            // CAMBIO: F1a: evitar dispersión ficticia cuando todos los azimutes confiables coinciden.
      if(reliable.every(s=>norm360(s[azKey]-reliable[0][azKey])===0)) sd.az=0;
    }
  }
  if(n<READING_AVG_CONFIG.MIN_SAMPLES){
    reasons.push('few-samples');
    return {n,mean,sd,level:'insufficient',reasons};
  }
  const ok=sd.incl<=READING_AVG_CONFIG.OK_INCL_SD && (sd.az===null || sd.az<=READING_AVG_CONFIG.OK_AZ_SD);
  const warn=sd.incl<=READING_AVG_CONFIG.WARN_INCL_SD && (sd.az===null || sd.az<=READING_AVG_CONFIG.WARN_AZ_SD);
  const level=ok?'ok':warn?'warn':'bad';
  if(sd.incl>READING_AVG_CONFIG.OK_INCL_SD) reasons.push('inclination-motion');
  if(sd.az!==null && sd.az>READING_AVG_CONFIG.OK_AZ_SD) reasons.push('azimuth-motion');
  return {n,mean,sd,level,reasons};
}

// CAMBIO: F1a: registrar solo lecturas activas; recortar por tiempo y cantidad.
function pushSensorReading(ts, reading, reliable){
  if(sensorState.status!=='active'){
    sensorState.buffer.length=0;
    return;
  }
  sensorState.buffer.push({
    ts, dip:reading.dip, dipDir:reading.dipDir, strike:reading.strike,
    trend:reading.trend, plunge:reading.plunge, reliable:reliable===true
  });
  const limit=ts-READING_AVG_CONFIG.BUFFER_WINDOW_MS;
  sensorState.buffer=sensorState.buffer.filter(s=>s.ts>=limit && s.ts<=ts).slice(-READING_AVG_CONFIG.MAX_SAMPLES);
}

// CAMBIO: F1a: ventana temporal con reloj inyectable y exclusión de latencia.
function recentSensorReadings(windowMs, skipLastMs=0){
  if(sensorState.status!=='active'){
    sensorState.buffer.length=0;
    return [];
  }
  const end=now()-skipLastMs, start=end-windowMs;
  return sensorState.buffer.filter(s=>s.ts>=start && s.ts<=end);
}

// CAMBIO: F1a: observar la salida de active y la visibilidad sin alterar B4-3.
function initReadingBufferLifecycle(){
  document.addEventListener('visibilitychange',()=>{ sensorState.buffer.length=0; });
  const dot=document.getElementById('sensorDot');
  if(dot){
    new MutationObserver(()=>{
      if(sensorState.status!=='active') sensorState.buffer.length=0;
    }).observe(dot,{attributes:true,attributeFilter:['class']});
  }
}

// CAMBIO: F1a: indicador textual por ventana LIVE, sin cambios visuales redundantes.
function updateReadingStability(formKey, mode){
  const el=document.getElementById('reading_stability_'+formKey);
  if(!el) return;
  const result=summarizeReadings(recentSensorReadings(READING_AVG_CONFIG.LIVE_WINDOW_MS),mode);
  const key={ok:'readingStable',warn:'readingMoving',bad:'readingUnstable',insufficient:'readingMeasuring'}[result.level];
  const label=t(key);
  if(el.dataset.level!==result.level) el.dataset.level=result.level;
  if(el.textContent!==label) el.textContent=label;
}

// CAMBIO: Una única ruta procesa ángulos, procedencia, estado y actualización visual.
function processOrientationEvent(e, eventType){
  if(e.alpha==null && e.beta==null && e.gamma==null) return false;
  const ts=now();
  // CAMBIO: Ignorar el respaldo mientras el origen absoluto tenga lecturas recientes.
  if(orientationAbsoluteListenerEnabled && eventType==='deviceorientation' &&
     orientationLastAbsoluteTs!==null && ts-orientationLastAbsoluteTs<=1500) return false;
  const source=resolveOrientationSource({
    eventType, absolute:e.absolute, alpha:e.alpha,
    compassHeading:e.webkitCompassHeading, compassAccuracy:e.webkitCompassAccuracy
  });
  if(eventType==='deviceorientationabsolute') orientationLastAbsoluteTs=ts;
  sensorState.available=true;
  // CAMBIO: B4-3: cambiar el estado por la ruta común sin alterar el cálculo ni los metadatos.
  sensorState.last=computeOrientation(source.alphaDeg, e.beta||0, e.gamma||0);
  sensorState.meta={source:source.source, reliable:source.reliable, ref:source.ref, ts};
  onSensorReading();
  // CAMBIO: F1a: guardar la lectura ya calculada y su fiabilidad en memoria.
  pushSensorReading(ts, sensorState.last, sensorState.meta.reliable);
  if(!dialRAF){
    dialRAF=true;
    requestAnimationFrame(()=>{ dialRAF=false; updateLiveDial(); updateTopbarStatus(); });
  }
  return true;
}

function attachOrientationListener(){
  if(orientationHandlerAttached) return;
  orientationHandlerAttached=true;
  // CAMBIO: Registrar el absoluto si existe y mantener el evento relativo como respaldo.
  orientationAbsoluteListenerEnabled=supportsAbsoluteOrientation(window);
  if(orientationAbsoluteListenerEnabled){
    window.addEventListener('deviceorientationabsolute', e=>processOrientationEvent(e, 'deviceorientationabsolute'));
  }
  window.addEventListener('deviceorientation', e=>processOrientationEvent(e, 'deviceorientation'));
}

function initSensors(){
  // CAMBIO: B4-3: clasificar explícitamente seguridad, soporte y necesidad de permiso.
  const initial=computeInitialSensorStatus({
    secure:isSensorSecureContext(),
    hasEvent:typeof DeviceOrientationEvent!=='undefined',
    needsPermission:typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'
  });
  setSensorStatus(initial);
  // CAMBIO: B4-3: iOS no solicita permiso hasta el gesto del usuario.
  if(initial==='pending') attachOrientationListener();
  if(!sensorState.visibilityInstalled){
    document.addEventListener('visibilitychange',onSensorVisibilityChange);
    sensorState.visibilityInstalled=true;
  }
}

// CAMBIO: F4: descripción del GPS sin modificar estados ni consultar el DOM.
function describeGpsChip(gps){
  if(gps.supported===false){
    return {
      text:t('gpsChipUnavailable'),
      level:'err',
      message:t('gpsStatusUnsupported')
    };
  }

  if(gps.status==='searching'){
    return {
      text:t('gpsChipSearching'),
      level:'warn',
      message:t('gpsStatusSearching')
    };
  }

  if(gps.errorCode===1 && gps.status==='unavailable'){
    return {
      text:t('gpsChipDenied'),
      level:'err',
      message:t('gpsStatusDenied')
    };
  }

  if(gps.status==='fix'){
    const accuracy=Number(gps.accuracy);
    const valid=gps.accuracy!==null && gps.accuracy!==undefined &&
      Number.isFinite(accuracy) && accuracy>=0;

    if(!valid){
      return {
        text:t('gpsChipNoAccuracy'),
        level:'ok',
        message:t('gpsStatusNoAccuracy')
      };
    }

    const shown=Math.round(accuracy);
    const poor=accuracy>GPS_WARN_ACCURACY_M;
    const value=String(shown);

    return {
      text:t('gpsChipAccuracy')
        .replace('{symbol}',poor?'⚠':'✔')
        .replace('{accuracy}',value),
      level:poor?'warn':'ok',
      message:t(poor?'gpsStatusPoor':'gpsStatusGood')
        .replace('{accuracy}',value)
    };
  }

  return {
    text:t('gpsChipUnavailable'),
    level:'err',
    message:t(gps.status==='idle'?'gpsStatusIdle':'gpsStatusUnavailable')
  };
}

// CAMBIO: F4: descripción del sensor según B4-3 y la clasificación F2.
function describeSensorChip(sensor,northRef){
  const status=sensor.status;
  const message=t(status==='idle'?'sensorStatusIdle':'sensorStatus_'+status);

  if(status==='needs-permission'){
    return {text:t('sensorChipPermission'),level:'warn',message};
  }

  if(status==='pending'){
    return {text:t('sensorChipPending'),level:'warn',message};
  }

  if(status==='nodata'){
    return {text:t('sensorChipNoData'),level:'warn',message};
  }

  if(status!=='active'){
    return {text:t('sensorChipInactive'),level:'err',message};
  }

  if(!northRef || northRef.key==='unreliable'){
    return {
      text:t('sensorChipRelative'),
      level:'warn',
      message:message+' '+t('orientationRelative')
    };
  }

  if(northRef.level==='warn'){
    return {
      text:t('sensorChipNorthWarning'),
      level:'warn',
      message:message+' '+t(
        northRef.key==='true-mismatch'
          ? 'northTrueMismatch'
          : 'northMagneticUnapplied'
      )
    };
  }

  if(northRef.key==='true'){
    return {
      text:t('sensorChipTrue'),
      level:'ok',
      message:message+' '+t('northTrue')
    };
  }

  if(northRef.key==='magnetic'){
    return {
      text:t('sensorChipMagnetic'),
      level:'ok',
      message:message+' '+t('orientationMagnetic')
    };
  }

  return {
    text:t('sensorChipActiveUnknown'),
    level:'warn',
    message:message+' '+t('orientationPending')
  };
}

// CAMBIO: F4: adaptar los metadatos reales de F2 para las descripciones.
function currentStatusChipDescriptions(){
  const estimated=getCachedEstimatedDeclination();
  const northRef=sensorState.status==='active' && sensorState.meta
    ? describeNorthReference({
        reliable:sensorState.meta.reliable,
        magOffset,
        estimatedDecl:estimated
      })
    : null;

  const gps=describeGpsChip({
    ...gpsState,
    supported:IS_SECURE && !!navigator.geolocation
  });

  const sensor=describeSensorChip(sensorState,northRef);

  if(sensorState.status==='active' && sensorState.meta){
    sensor.message=northReferenceDisplay(sensorState.meta).text+
      ' '+sensorStatusMessage();
  }

  return {gps,sensor};
}

function updateTopbarStatus(){
  // CAMBIO: F4: calcular texto, nivel y mensaje desde el estado actual.
  const descriptions=currentStatusChipDescriptions();

  const gDot=document.getElementById('gpsDot');
  if(gDot){
    const cls='status-dot'+
      (gpsState.status==='fix'?' ok':gpsState.status==='searching'?' warn':' err');
    if(gDot.className!==cls) gDot.className=cls;
  }

  const sDot=document.getElementById('sensorDot');
  // CAMBIO: B4-3: verde activo, amarillo esperando permiso/datos, rojo restante.
  if(sDot){
    const cls='status-dot'+(sensorState.status==='active'?' ok':(sensorState.status==='pending'||sensorState.status==='needs-permission')?' warn':' err');
    if(sDot.className!==cls) sDot.className=cls;
    const msg=sensorStatusMessage();
    if(sDot.title!==msg) sDot.title=msg;
  }

  // CAMBIO: F4: actualizar únicamente los atributos y textos que cambian.
  for(const type of ['gps','sensor']){
    const chip=document.getElementById(type+'StatusChip');
    const label=document.getElementById(type+'ChipText');
    const description=descriptions[type];
    if(!chip || !label) continue;

    if(label.textContent!==description.text){
      label.textContent=description.text;
    }
    if(chip.dataset.level!==description.level){
      chip.dataset.level=description.level;
    }
    const accessible=description.text+'. '+description.message;
    if(chip.getAttribute('aria-label')!==accessible){
      chip.setAttribute('aria-label',accessible);
    }
    if(chip.title!==description.message){
      chip.title=description.message;
    }
  }

  // CAMBIO: F4: sincronizar un panel abierto sin recrearlo.
  const panel=document.getElementById('statusPanel');
  if(panel && !panel.hidden){
    refreshStatusPanel();
  }
}

// CAMBIO: F4: abrir el panel y solicitar permiso solo por gesto directo.
function openStatusChip(type){
  const panel=document.getElementById('statusPanel');
  if(!panel || (type!=='gps' && type!=='sensor')) return;

  if(!panel.hidden && panel.dataset.type===type){
    closeStatusPanel();
    return;
  }

  panel.dataset.type=type;
  panel.hidden=false;

  // CAMBIO: F4: anunciar cuál de los dos controles mantiene abierto el panel.
  for(const chipType of ['gps','sensor']){
    const chip=document.getElementById(chipType+'StatusChip');
    if(chip) chip.setAttribute('aria-expanded',String(chipType===type));
  }

  refreshStatusPanel();

  if(type==='sensor' && sensorState.status==='needs-permission'){
    requestSensorPermission();
  }
}

// CAMBIO: F4: mantener actualizado el panel sin reconstruir el DOM.
function refreshStatusPanel(){
  const panel=document.getElementById('statusPanel');
  if(!panel || panel.hidden) return;

  const type=panel.dataset.type;
  if(type!=='gps' && type!=='sensor') return;

  const descriptions=currentStatusChipDescriptions();
  const description=descriptions[type];
  const title=document.getElementById('statusPanelTitle');
  const message=document.getElementById('statusPanelMessage');
  const retry=document.getElementById('statusPanelRetry');
  const close=document.getElementById('statusPanelClose');

  if(title){
    const text=t(type==='gps'?'gpsChipName':'sensorChipName');
    if(title.textContent!==text) title.textContent=text;
  }

  if(message && message.textContent!==description.message){
    message.textContent=description.message;
  }

  if(close){
    close.setAttribute('aria-label',t('statusClose'));
  }

  if(retry){
    // CAMBIO: F4: permiso denegado no puede reintentarse desde el chip.
    const denied=type==='gps' && gpsState.errorCode===1 &&
      gpsState.status==='unavailable';

    const retryable=type==='gps' &&
      (gpsState.status==='unavailable'||gpsState.status==='idle') &&
      !denied && IS_SECURE && !!navigator.geolocation;

    retry.hidden=!retryable;

    if(retryable){
      const text=t('gpsRetry');
      if(retry.textContent!==text) retry.textContent=text;
    }
  }
}

// CAMBIO: F4: el reintento usa la función GPS existente.
function retryGpsFromChip(){
  const panel=document.getElementById('statusPanel');
  if(!panel || panel.hidden || panel.dataset.type!=='gps') return;

  if(gpsState.status!=='unavailable' && gpsState.status!=='idle') return;
  if(gpsState.status==='unavailable' && gpsState.errorCode===1) return;
  if(!IS_SECURE || !navigator.geolocation) return;

  initGPS();
  closeStatusPanel();
}

// CAMBIO: F4: cerrar sin alterar estados ni permisos.
function closeStatusPanel(){
  const panel=document.getElementById('statusPanel');
  if(!panel) return;

  panel.hidden=true;
  panel.removeAttribute('data-type');

  for(const type of ['gps','sensor']){
    const chip=document.getElementById(type+'StatusChip');
    if(chip) chip.setAttribute('aria-expanded','false');
  }
}

// CAMBIO: F4: activar el cierre exterior sin interferir con los gestos de los chips.
document.addEventListener('click',function(event){
  const panel=document.getElementById('statusPanel');
  if(!panel || panel.hidden) return;

  if(panel.contains(event.target)) return;
  if(event.target.closest('#gpsStatusChip, #sensorStatusChip')) return;

  closeStatusPanel();
});

// CAMBIO: F4: cierre accesible mediante Escape.
document.addEventListener('keydown',function(event){
  if(event.key==='Escape') closeStatusPanel();
});

function initGPS(){
  if(!IS_SECURE || !navigator.geolocation) return;
  // CAMBIO: F4: cancelar exclusivamente la vigilancia GPS anterior.
  if(gpsWatchId!==null){
    navigator.geolocation.clearWatch(gpsWatchId);
    gpsWatchId=null;
  }
  gpsState.status='searching';
  // CAMBIO: F4: conservar el identificador para el siguiente reintento.
  gpsWatchId=navigator.geolocation.watchPosition(pos=>{
    gpsState.status='fix';
    gpsState.lat=pos.coords.latitude;
    gpsState.lon=pos.coords.longitude;
    gpsState.alt=pos.coords.altitude ? Math.round(pos.coords.altitude) : null;
    gpsState.accuracy=pos.coords.accuracy ? Math.round(pos.coords.accuracy) : null;
    updateTopbarStatus();
  }, err=>{
    // CAMBIO: F4: conservar el código de error sin cambiar el estado existente.
    gpsState.errorCode=err.code;
    gpsState.status='unavailable';
    updateTopbarStatus();
  }, { enableHighAccuracy:true, maximumAge:4000, timeout:20000 });
}

function getDialDiameter(){
  if(compassScale==='sm') return 90;
  if(compassScale==='lg') return 160;
  if(compassScale==='xl') return 210;
  return 120;
}

function formatPlaneReadout(dipDir, dip, notation, quadrantPref) {
  // CAMBIO: Mostrar Horizontal aunque la dirección de manteo no exista.
  const plane = classifyAttitude(dip, null).plane;
  let l1 = t('readoutDipDir');
  if (notation === 'strike') l1 = t('readoutStrike');
  if (notation === 'quadrant') l1 = t('readoutQuadrant');
  if (plane === 'horizontal') {
    return { label1:l1, value1:t('attitudeHorizontal'), label2:t('readoutDip'), value2:Math.round(Number(dip)) + '°', notice:null };
  }
  if (plane == null || !Number.isFinite(dipDir) || dipDir < 0 || dipDir > 360) {
    return { label1:l1, value1:'—', label2:t('readoutDip'), value2:plane == null ? '—' : Math.round(Number(dip)) + '°', notice:plane === 'vertical' ? t('attitudeVerticalPlaneWarning') : null };
  }

  let label1 = t('readoutDipDir');
  let value1 = Math.round(dipDir) + '°';

  if (notation === 'strike') {
    label1 = t('readoutStrike');
    value1 = Math.round(norm360(dipDir - 90)) + '°';
  } else if (notation === 'quadrant') {
    label1 = t('readoutQuadrant');
    const oldPref = window.quadrantPref;
    if (quadrantPref) window.quadrantPref = quadrantPref;
    value1 = toQuadrant(norm360(dipDir - 90));
    if (quadrantPref) window.quadrantPref = oldPref;
  }

  return {
    label1: label1,
    value1: value1,
    label2: t('readoutDip'),
    value2: Math.round(Number(dip)) + '°',
    // CAMBIO: Hacer disponible el aviso también para la lectura vertical.
    notice: plane === 'vertical' ? t('attitudeVerticalPlaneWarning') : null
  };
}

function initMapPanelUI() {
  let attempts = 0;
  const syncInterval = setInterval(() => {
    if (typeof updateMapSummaryText === 'function') updateMapSummaryText();
    const warnDiv = document.getElementById('onlineLayerWarning');
    const ind = document.getElementById('mapOnlineWarnIndicator');
    if (warnDiv && ind) {
       ind.style.display = warnDiv.style.display === 'none' ? 'none' : 'inline-block';
    }
    attempts++;
    if (attempts > 15) clearInterval(syncInterval);
  }, 100);

  const checkWarn = setInterval(() => {
     const warnDiv = document.getElementById('onlineLayerWarning');
     if (warnDiv) {
        clearInterval(checkWarn);
        const observer = new MutationObserver(() => {
           const ind = document.getElementById('mapOnlineWarnIndicator');
           if (ind) ind.style.display = warnDiv.style.display === 'none' ? 'none' : 'inline-block';
        });
        observer.observe(warnDiv, { attributes: true, attributeFilter: ['style'] });
     }
  }, 300);
}

function toggleMapPanel() {
  const panel = document.getElementById('mapFiltersPanel');
  const btn = document.getElementById('btnMapPanelToggle');
  const ic = document.getElementById('mapToggleIc');
  if (!panel || !btn || !ic) return;
  
  const isExpanded = btn.getAttribute('aria-expanded') === 'true';
  const newState = !isExpanded;
  
  btn.setAttribute('aria-expanded', String(newState));
  ic.textContent = newState ? '▲' : '▼';
  
  if (newState) {
    panel.classList.remove('collapsed');
  } else {
    panel.classList.add('collapsed');
  }
  
  try {
    localStorage.setItem('geo_map_panel_open', newState ? '1' : '0');
  } catch (e) {}
}

function updateMapSummaryText() {
  const textEl = document.getElementById('mapSummaryText');
  const campSel = document.getElementById('mapCampSelect');
  const laySel = document.getElementById('mapBaseLayerSel');
  if (!textEl || !campSel || !laySel) return;

  const campText = campSel.options[campSel.selectedIndex]?.text.replace(/^[📁📂]\s*/, '') || '';
  const layText = laySel.options[laySel.selectedIndex]?.text || '';
  
  textEl.textContent = campText + ' · ' + layText;
}

// CAMBIO: Sincronizar el búfer del mapa con su tamaño CSS sin alterar la vista.
function resizeGISCanvas(){
  if(state.view !== 'mapView') return;

  const canvas = document.getElementById('gisCanvas');
  const container = document.getElementById('mapContainer');
  if(!canvas || !container) return;

  const width = container.clientWidth;
  const height = container.clientHeight;
  if(width <= 0 || height <= 0) return;

  const dpr = window.devicePixelRatio || 1;
  const newWidth = Math.round(width * dpr);
  const newHeight = Math.round(height * dpr);

  // CAMBIO: Evitar borrar el canvas cuando el búfer ya tiene el tamaño correcto.
  if(canvas.width === newWidth && canvas.height === newHeight) return;

  if(canvas.width !== newWidth) canvas.width = newWidth;
  if(canvas.height !== newHeight) canvas.height = newHeight;

  // CAMBIO: Redibujar únicamente después de un cambio efectivo de tamaño.
  drawGISMap();
}

let gisTouchState = { dragging:false, startX:0, startY:0, lastX:0, lastY:0, pinchDist:0, lastTap:0 };

async function initGISMap(){
  const canvas = document.getElementById('gisCanvas');
  if(!canvas) return;

  const dpr = window.devicePixelRatio || 1;

  canvas.width = container.clientWidth * dpr;

  const camps = await dbGetAll('campaigns');
  const sel = document.getElementById('mapCampSelect');
  if(sel){
    camps.forEach(c=>{
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = '📂 ' + c.name;
      if(mapState.campId === c.id) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  // Poblar selector de capas base
  const layerSel = document.getElementById('mapBaseLayerSel');
  if(layerSel) {
    layerSel.innerHTML = `<option value="">${t('noLayer')}</option>`;
    const layers = await listMapLayers();
    if(layers.length === 0) {
      layerSel.innerHTML = `<option value="">${t('noLayersMsg')}</option>`;
    } else {
      const offGrp = document.createElement('optgroup');
      offGrp.label = t('offlineLayers');
      layers.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.id;
        opt.textContent = l.name || 'Capa';
        offGrp.appendChild(opt);
      });
      layerSel.appendChild(offGrp);
    }

    if(MAP_ONLINE_LAYERS.length > 0) {
      const onGrp = document.createElement('optgroup');
      onGrp.label = t('onlineLayers');
      MAP_ONLINE_LAYERS.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.id;
        opt.textContent = l.name;
        onGrp.appendChild(opt);
      });
      layerSel.appendChild(onGrp);

      if(!document.getElementById('onlineLayerWarning')) {
        layerSel.parentElement.style.flexWrap = 'wrap';
        const warnDiv = document.createElement('div');
        warnDiv.id = 'onlineLayerWarning';
        warnDiv.style.display = 'none';
        warnDiv.style.width = '100%';
        warnDiv.style.fontSize = '10px';
        warnDiv.style.color = 'var(--text-dim)';
        warnDiv.style.marginTop = '2px';
        warnDiv.style.padding = '0 4px';
        warnDiv.innerHTML = `<span>${t('onlineWarningText')}</span> <a href="#" onclick="event.preventDefault(); openOfflineMapGuide();" style="color:var(--accent); text-decoration:none;">${t('layerGuideBtn')}</a>`;
        layerSel.parentElement.appendChild(warnDiv);
      }
    }
  }

  await loadSavedMapOverlay();
  if(layerSel && mapState.overlayMeta) {
    layerSel.value = mapState.overlayMeta.id;
  }

  await loadMapData();

  // CAMBIO: Reencuadrar al entrar por primera vez o al cambiar de campaña desde Libreta.
  if(!mapViewInitialized || mapLastFittedCampId !== mapState.campId){
    if(mapState.stationsCache.length > 0){
      gisFitBounds();
    } else if(!mapViewInitialized && gpsState.lat != null){
      mapState.centerLat = gpsState.lat;
      mapState.centerLon = gpsState.lon;
    }
    // CAMBIO: Registrar la campaña ya encuadrada y conservar la vista en futuras entradas.
    mapViewInitialized = true;
    mapLastFittedCampId = mapState.campId;
  }

  setupGISMapEvents(canvas);
  drawGISMap();
}
 
async function loadMapData(){
  let stations = await dbGetAll('stations');

// Proyección de Coordenadas Geográficas (Lat/Lon) a Coordenadas Pantalla (Canvas)
function geoToScreen(lat, lon, width, height){
  // Escala métrica aproximada centrada (1 grado latitud ≈ 111,320m)
  const latRad = toRad(mapState.centerLat);
  const metersPerDegLat = 111320;
  const metersPerDegLon = 111320 * Math.cos(latRad);
 
  const dx = (lon - mapState.centerLon) * metersPerDegLon;
  const dy = (lat - mapState.centerLat) * metersPerDegLat;
 
  // Factor de escala
  const pxPerMeter = (1 / mapState.zoom) * mapState.scale;
  const screenX = (width / 2) + dx * pxPerMeter + mapState.panX;
  const screenY = (height / 2) - dy * pxPerMeter + mapState.panY;
 
  return { x: screenX, y: screenY };
}
 
function screenToGeo(sx, sy, width, height){
  const latRad = toRad(mapState.centerLat);
  const metersPerDegLat = 111320;
  const metersPerDegLon = 111320 * Math.cos(latRad);
  const pxPerMeter = (1 / mapState.zoom) * mapState.scale;
 
  const dx = (sx - (width / 2) - mapState.panX) / pxPerMeter;
  const dy = ((height / 2) - (sy - mapState.panY)) / pxPerMeter;
 
  const lon = mapState.centerLon + (dx / metersPerDegLon);
  const lat = mapState.centerLat + (dy / metersPerDegLat);
  return { lat, lon };
}

function latLonToTile(lat, lon, z) {
  const latRad = lat * Math.PI / 180;
  const x = Math.floor((lon + 180) / 360 * Math.pow(2, z));
  const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * Math.pow(2, z));
  return { x, y };
}

function tileToBounds(z, x, y) {
  const n = Math.pow(2, z);
  const lonMin = x / n * 360 - 180;
  const lonMax = (x + 1) / n * 360 - 180;
  const latMaxRad = Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n)));
  const latMinRad = Math.atan(Math.sinh(Math.PI * (1 - 2 * (y + 1) / n)));
  return { north: latMaxRad * 180 / Math.PI, south: latMinRad * 180 / Math.PI, west: lonMin, east: lonMax };
}

function buildTileUrl(layer, z, x, y) {
  return layer.url.replace('{z}', z).replace('{x}', x).replace('{y}', y);
}

function zoomForResolution(lat, mpp) {
  return Math.round(Math.log2(156543.03 * Math.cos(lat * Math.PI / 180) / mpp));
}

const tileCache = new Map();
const failedTiles = new Map();
let activeTileDownloads = 0;
let consecutiveTileErrors = 0;
let drawTileRaf = null;

function drawOnlineBaseTiles(ctx, width, height) {
  if (!mapState.onlineLayer) return;
  
  let mpp = mapState.zoom / mapState.scale;
  let z = zoomForResolution(mapState.centerLat, mpp);
  const layer = mapState.onlineLayer;
  z = clamp(z, layer.minZoom, layer.maxZoom);

  const nw = screenToGeo(0, 0, width, height);
  const se = screenToGeo(width, height, width, height);
  
  let startTile = latLonToTile(nw.lat, nw.lon, z);
  let endTile = latLonToTile(se.lat, se.lon, z);
  
  let minX = Math.min(startTile.x, endTile.x);
  let maxX = Math.max(startTile.x, endTile.x);
  let minY = Math.min(startTile.y, endTile.y);
  let maxY = Math.max(startTile.y, endTile.y);
  
  let totalTiles = (maxX - minX + 1) * (maxY - minY + 1);
  if (totalTiles > 80 && z > layer.minZoom) {
    z -= 1;
    startTile = latLonToTile(nw.lat, nw.lon, z);
    endTile = latLonToTile(se.lat, se.lon, z);
    minX = Math.min(startTile.x, endTile.x);
    maxX = Math.max(startTile.x, endTile.x);
    minY = Math.min(startTile.y, endTile.y);
    maxY = Math.max(startTile.y, endTile.y);
  }

  const now = Date.now();
  let anyLoaded = false;
  
  for (let x = Math.max(0, minX); x <= Math.min(maxX, Math.pow(2, z) - 1); x++) {
    for (let y = Math.max(0, minY); y <= Math.min(maxY, Math.pow(2, z) - 1); y++) {
      const key = `${layer.id}/${z}/${x}/${y}`;
      const bounds = tileToBounds(z, x, y);
      const pNW = geoToScreen(bounds.north, bounds.west, width, height);
      const pSE = geoToScreen(bounds.south, bounds.east, width, height);
      
      const dx = pNW.x - 0.5;
      const dy = pNW.y - 0.5;
      const dw = (pSE.x - pNW.x) + 1.0;
      const dh = (pSE.y - pNW.y) + 1.0;

      if (tileCache.has(key)) {
        anyLoaded = true;
        ctx.drawImage(tileCache.get(key), dx, dy, dw, dh);
      } else {
        let drawnParent = false;
        for (let dz = 1; dz <= 2 && z - dz >= 0; dz++) {
          const pz = z - dz;
          const px = Math.floor(x / Math.pow(2, dz));
          const py = Math.floor(y / Math.pow(2, dz));
          const pKey = `${layer.id}/${pz}/${px}/${py}`;
          if (tileCache.has(pKey)) {
            const pBounds = tileToBounds(pz, px, py);
            const pImg = tileCache.get(pKey);
            const pNW_geo = geoToScreen(pBounds.north, pBounds.west, width, height);
            const pSE_geo = geoToScreen(pBounds.south, pBounds.east, width, height);
            ctx.drawImage(pImg, pNW_geo.x - 0.5, pNW_geo.y - 0.5, (pSE_geo.x - pNW_geo.x) + 1.0, (pSE_geo.y - pNW_geo.y) + 1.0);
            drawnParent = true;
            break;
          }
        }
        
        if (activeTileDownloads < 16) {
          const failTime = failedTiles.get(key);
          if (!failTime || now - failTime > 10000) {
            activeTileDownloads++;
            failedTiles.set(key, now); // Marcar intento preventivamente
            const img = new Image();
            img.onload = () => {
              activeTileDownloads--;
              consecutiveTileErrors = 0;
              if (tileCache.size >= 400) tileCache.delete(tileCache.keys().next().value);
              tileCache.set(key, img);
              if (!drawTileRaf) drawTileRaf = requestAnimationFrame(() => { drawTileRaf = null; drawGISMap(); });
            };
            img.onerror = () => {
              activeTileDownloads--;
              consecutiveTileErrors++;
              failedTiles.set(key, Date.now());
              if (consecutiveTileErrors >= 8 && !anyLoaded) {
                toast(t('tilesFailed'));
                consecutiveTileErrors = 0;
              }
            };
            img.src = buildTileUrl(layer, z, x, y);
          }
        }
      }
    }
  }
}

let navSearchMarker = null;
let liveLocWatchId = null;
let liveLocState = { active: false, lat: null, lon: null, accuracy: null, firstFix: false };

function computeFitView(bounds, width, height, paddingPx) {
  const lat = (bounds.north + bounds.south) / 2;
  const lon = (bounds.west + bounds.east) / 2;
  const latSpan = Math.abs(bounds.north - bounds.south);
  const lonSpan = Math.abs(bounds.east - bounds.west);
  const metersSpanY = latSpan * 111320;
  const metersSpanX = lonSpan * 111320 * Math.cos(lat * Math.PI / 180);
  
  const wSafe = Math.max(1, width - paddingPx * 2);
  const hSafe = Math.max(1, height - paddingPx * 2);
  const rawMpp = Math.max(metersSpanX / wSafe, metersSpanY / hSafe);
  
  return { lat, lon, mpp: clampMapResolution(rawMpp) };
}

function gisGoToLayer() {
  if (mapState.onlineLayer) {
    toast(t('onlineLayerFull'));
    return;
  }
  if (!mapState.overlayMeta || mapState.overlayMeta.latMax == null) {
    toast(t('noOfflineLayer'));
    return;
  }
  const canvas = document.getElementById('gisCanvas');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas ? canvas.width / dpr : 300;
  const h = canvas ? canvas.height / dpr : 300;
  
  const m = mapState.overlayMeta;
  const bounds = { north: m.latMax, south: m.latMin, west: m.lonMin, east: m.lonMax };
  
  const fit = computeFitView(bounds, w, h, 20);
  mapState.centerLat = fit.lat;
  mapState.centerLon = fit.lon;
  mapState.panX = 0;
  mapState.panY = 0;
  mapState.zoom = 1;
  mapState.scale = mapState.zoom / fit.mpp;
  drawGISMap();
}

function parseCoordinateInput(text) {
  if (!text || typeof text !== 'string') return null;
  let str = text.trim();
  if (!str) return null;

  // CAMBIO: Se acepta cualquier letra en el bloque central para filtrar su validez lógicamente
  const utmRegex = /^(\d{1,2})\s*([a-zA-Z])\s+(\d+(?:\.\d+)?)\s*[Ee]?\s+(\d+(?:\.\d+)?)\s*[Nn]?$/i;
  const utmMatch = str.match(utmRegex);
  if (utmMatch) {
    const zone = parseInt(utmMatch[1], 10);
    // CAMBIO: Validación estricta del huso de 1 a 60
    if (zone < 1 || zone > 60) return null;
    
    const letter = utmMatch[2].toUpperCase();
    // CAMBIO: Se excluyen explícitamente I y O según estándar MGRS
    if (letter === 'I' || letter === 'O') return null;
    
    let hemi;
    // CAMBIO: Se prioriza 'N' y 'S' exactos para la convención de la app ANTES de evaluar rangos
    if (letter === 'N') {
      hemi = 'N';
    } else if (letter === 'S') {
      hemi = 'S';
    } else if (letter >= 'C' && letter <= 'M') {
      hemi = 'S';
    } else if (letter >= 'P' && letter <= 'X') {
      hemi = 'N';
    } else {
      return null;
    }
    
    const easting = parseFloat(utmMatch[3]);
    const northing = parseFloat(utmMatch[4]);
    const ll = utmToLL(easting, northing, zone, hemi);
    if (isNaN(ll.lat) || isNaN(ll.lon)) return null;
    return { lat: ll.lat, lon: ll.lon, source: 'utm' };
  }

  const decRegex = /^\s*([+-]?\d+(?:[.,]\d+)?)\s*([NnSs])?\s*[,; \t]+\s*([+-]?\d+(?:[.,]\d+)?)\s*([EeWwOo])?\s*$/;
  const decMatch = str.match(decRegex);
  if (decMatch) {
    let lat = parseFloat(decMatch[1].replace(',', '.'));
    let latDir = decMatch[2]?.toUpperCase();
    let lon = parseFloat(decMatch[3].replace(',', '.'));
    let lonDir = decMatch[4]?.toUpperCase();

    if (latDir === 'S') lat = -Math.abs(lat);
    if (latDir === 'N') lat = Math.abs(lat);
    if (lonDir === 'W' || lonDir === 'O') lon = -Math.abs(lon);
    if (lonDir === 'E') lon = Math.abs(lon);

    if (lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
      return { lat, lon, source: 'decimal' };
    }
  }
  return null;
}
