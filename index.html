/* =========================================================
   MATEMÁTICAS VECTORIALES 3D Y GEOLOGÍA ESTRUCTURAL (FAULTKIN)
   ========================================================= */
const V3 = {
  cross: (a, b) => [
    a[1] * b[2] - a[2] * b[1],
    a[2] * b[0] - a[0] * b[2],
    a[0] * b[1] - a[1] * b[0]
  ],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  norm: (v) => {
    const l = Math.hypot(v[0], v[1], v[2]);
    return l > 1e-12 ? [v[0] / l, v[1] / l, v[2] / l] : [0, 0, 0];
  },
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  scale: (v, s) => [v[0] * s, v[1] * s, v[2] * s],
  toLowerHemi: (v) => (v[2] < 0 ? [-v[0], -v[1], -v[2]] : [v[0], v[1], v[2]])
};

// Convierte Trend y Plunge (en grados) a vector unitario (X: Este, Y: Norte, Z: Abajo)
function trendPlungeToVector(tr, pl) {
  const trR = toRad(tr);
  const plR = toRad(pl);
  return [
    Math.sin(trR) * Math.cos(plR),
    Math.cos(trR) * Math.cos(plR),
    Math.sin(plR)
  ];
}

// Convierte vector unitario (X, Y, Z) a Trend y Plunge
function vectorToTrendPlunge(v) {
  const vn = V3.toLowerHemi(v);
  let tr = norm360(toDeg(Math.atan2(vn[0], vn[1])));
  let pl = toDeg(Math.asin(clamp(vn[2], -1, 1)));
  return { trend: roundInt(tr), plunge: roundInt(pl) };
}

// Polo normal inferior del plano (Strike RHR o DipDir)
function planeToPoleVector(strike, dip) {
  const poleTr = norm360(strike - 90);
  const polePl = 90 - dip;
  return trendPlungeToVector(poleTr, polePl);
}

// Vector de deslizamiento / estría a partir de Strike, Dip, Rake y Cuadrante de referencia
function faultRakeToSlipVector(strike, dip, rake, rakeQuad) {
  const sR = toRad(strike);
  const dR = toRad(dip);
  const rR = toRad(rake);
  
  // Vector rumbo unitario en sentido Strike RHR
  const strikeVec = [Math.sin(sR), Math.cos(sR), 0];
  // Vector máxima pendiente hacia abajo
  const dipVec = [Math.cos(sR) * Math.sin(dR), -Math.sin(sR) * Math.sin(dR), Math.cos(dR)];
  
  // Determinar si el rake se mide desde el origen de strike o desde strike+180
  const strikeQuad = dipDirQuadrant(strike);
  let rakeFromStrikeStart = true;
  if (rakeQuad && rakeQuad !== strikeQuad) {
    rakeFromStrikeStart = false;
  }
  
  const sign = rakeFromStrikeStart ? 1 : -1;
  const slip = V3.add(
    V3.scale(strikeVec, sign * Math.cos(rR)),
    V3.scale(dipVec, Math.sin(rR))
  );
  return V3.norm(slip);
}

// Motor Cinemático FaultKin / Allmendinger
function computeFaultKinematics(f) {
  const strike = f.strike != null ? f.strike : norm360((f.dipDir || 0) - 90);
  const dip = f.dip || 0;
  
  // Vector normal hacia el bloque techo (hanging wall)
  const n = planeToPoleVector(strike, dip);
  
  let u;
  if (f.striaeMode === 'trendplunge' && f.trend != null && f.plunge != null) {
    u = trendPlungeToVector(f.trend, f.plunge);
  } else if (f.rake != null) {
    u = faultRakeToSlipVector(strike, dip, f.rake, f.rakeQuadrant);
  } else {
    // Estimación por defecto: dip-slip puro
    u = [Math.cos(toRad(strike)) * Math.sin(toRad(dip)), -Math.sin(toRad(strike)) * Math.sin(toRad(dip)), Math.cos(toRad(dip))];
  }
  
  // Eje B = n x u
  let b = V3.norm(V3.cross(n, u));
  
  // Ajuste de sentido relativo del vector de movimiento del bloque techo
  let uHang = [...u];
  const sense = (f.sense || 'Normal').toLowerCase();
  
  // Si es movimiento inverso, el bloque techo sube (opuesto a la componente de buzamiento de u)
  if (sense.includes('invers') || sense.includes('thrust') || sense.includes('reverse')) {
    uHang = V3.scale(u, -1);
  } else if (sense.includes('dextral') || sense.includes('sinistral')) {
    // En rumbo puro / oblicuo verificar consistencia de cizalle
    const bCrossN = V3.cross(b, n);
    if (sense.includes('dextral') && V3.dot(uHang, bCrossN) < 0) {
      uHang = V3.scale(uHang, -1);
    }
  }

  // Ejes P y T cinemáticos a 45°
  let P = V3.toLowerHemi(V3.norm(V3.sub(n, uHang)));
  let T = V3.toLowerHemi(V3.norm(V3.add(n, uHang)));
  
  // Polo del plano nodal auxiliar = vector de estría u
  const auxPole = V3.toLowerHemi(u);
  const auxTP = vectorToTrendPlunge(auxPole);
  const auxDipDir = norm360(auxTP.trend + 180);
  const auxDip = 90 - auxTP.plunge;

  return {
    n: V3.toLowerHemi(n),
    u: V3.toLowerHemi(u),
    b: V3.toLowerHemi(b),
    P,
    T,
    auxDipDir,
    auxDip,
    auxStrike: norm360(auxDipDir - 90),
    P_tp: vectorToTrendPlunge(P),
    T_tp: vectorToTrendPlunge(T)
  };
}

// Cálculo del Polo Medio Vectorial (Fisher mean / Orientación media)
function calculateMeanOrientation(poles) {
  if (!poles || poles.length === 0) return null;
  let sum = [0, 0, 0];
  poles.forEach(p => {
    sum = V3.add(sum, p);
  });
  const R = Math.hypot(sum[0], sum[1], sum[2]);
  if (R < 1e-5) return null;
  const meanVec = V3.toLowerHemi(V3.scale(sum, 1 / R));
  const tp = vectorToTrendPlunge(meanVec);
  const dipDir = norm360(tp.trend + 180);
  const dip = 90 - tp.plunge;
  const strike = norm360(dipDir - 90);
  return { meanVec, dipDir, dip, strike, trend: tp.trend, plunge: tp.plunge, count: poles.length };
}

/* =========================================================
   PROYECCIÓN ESTEREOGRÁFICA (SCHMIDT & WULFF)
   ========================================================= */
function project3D(v, type, R) {
  const vn = V3.toLowerHemi(v);
  const x = vn[0], y = vn[1], z = vn[2];
  let rProj = 0;
  
  if (type === 'schmidt') {
    // Equiárea: r = sqrt(2) * R * sin(theta/2) = R * sqrt(1 - z)
    rProj = R * Math.sqrt(Math.max(0, 1 - z));
  } else {
    // Equiangular (Wulff): r = R * tan(theta/2) = R * sqrt(1 - z^2) / (1 + z)
    const horiz = Math.hypot(x, y);
    rProj = (1 + z) > 1e-12 ? R * (horiz / (1 + z)) : 0;
  }
  
  const horizLen = Math.hypot(x, y);
  if (horizLen < 1e-7) return { x: 0, y: 0 };
  return {
    x: (x / horizLen) * rProj,
    y: -(y / horizLen) * rProj // -y porque en Canvas Y crece hacia abajo y Norte es hacia arriba
  };
}

// Mapeo inverso de píxel Canvas a vector 3D
function unproject2D(px, py, type, R) {
  const dist = Math.hypot(px, py);
  if (dist > R) return null;
  const normDist = dist / R;
  let z = 0;
  if (type === 'schmidt') {
    z = 1 - 2 * Math.pow(normDist / Math.SQRT2, 2);
  } else {
    z = (1 - normDist * normDist) / (1 + normDist * normDist);
  }
  z = clamp(z, 0, 1);
  const horiz = Math.sqrt(Math.max(0, 1 - z * z));
  if (dist < 1e-7) return [0, 0, 1];
  return [
    (px / dist) * horiz,
    -(py / dist) * horiz,
    z
  ];
}

/* =========================================================
   ESTIMACIÓN DECLINACIÓN MAGNÉTICA
   ========================================================= */
function estimateDeclination(lat, lon){
  if(lat==null || lon==null) return 0;
  const d = -0.15 * lat + 0.12 * lon + 0.002 * lat * lon;
  return Math.round(clamp(d, -30, 30));
}

function computeOrientation(alphaDeg, betaDeg, gammaDeg){
  const correctedAlpha = norm360(alphaDeg + magOffset);
  const a=toRad(correctedAlpha), b=toRad(betaDeg), g=toRad(gammaDeg);
  const cA=Math.cos(a), sA=Math.sin(a);
  const cB=Math.cos(b), sB=Math.sin(b);
  const cG=Math.cos(g), sG=Math.sin(g);
  const E = cA*sG + cG*sA*sB;
  const N = sA*sG - cA*cG*sB;
  const U = cB*cG;
  const dip = toDeg(Math.acos(clamp(U,-1,1)));
  const dipDir = norm360(toDeg(Math.atan2(E,N)) + 180);
  const strike = norm360(dipDir - 90);
  const Ey = -cB*sA, Ny = cA*cB, Uy = sB;
  let trend = norm360(toDeg(Math.atan2(Ey,Ny)));
  let plunge = toDeg(-Math.asin(clamp(Uy,-1,1)));
  if(plunge<0){ trend=norm360(trend+180); plunge=-plunge; }
  return { dip: roundInt(dip), dipDir: roundInt(dipDir), strike: roundInt(strike), trend: roundInt(trend), plunge: roundInt(plunge) };
}

function toQuadrant(strikeAz){
  if(strikeAz==null||isNaN(strikeAz)) return '—';
  let s = norm360(strikeAz);
  const wChar = currentLang==='es'?'O':'W';
  
  if(quadrantPref==='N_ONLY'){
    let half = s % 180;
    if(half<=90) return `N${Math.round(half)}°E`;
    return `N${Math.round(180-half)}°${wChar}`;
  } else {
    let sNorm = s % 180;
    let ns, ew, angle;
    if(sNorm<=90){ ns='N'; ew='E'; angle=sNorm; } else { ns='S'; ew=wChar; angle=180-sNorm; }
    angle=Math.round(angle);
    if(angle===0) return 'N-S';
    if(angle===90) return `E-${wChar}`;
    return ns+angle+'°'+ew;
  }
}

function dipDirQuadrant(dipDirAz){
  if(dipDirAz==null||isNaN(dipDirAz)) return '—';
  const az=norm360(dipDirAz);
  const dirsEs=[['N',0],['NNE',22.5],['NE',45],['ENE',67.5],['E',90],['ESE',112.5],['SE',135],['SSE',157.5],
                ['S',180],['SSO',202.5],['SO',225],['OSO',247.5],['O',270],['ONO',292.5],['NO',315],['NNO',337.5]];
  const dirsEn=[['N',0],['NNE',22.5],['NE',45],['ENE',67.5],['E',90],['ESE',112.5],['SE',135],['SSE',157.5],
                ['S',180],['SSW',202.5],['SW',225],['WSW',247.5],['W',270],['WNW',292.5],['NW',315],['NNW',337.5]];
  const dirs = currentLang==='en'? dirsEn : dirsEs;
  let best=dirs[0], bd=999;
  dirs.forEach(d=>{ let diff=Math.abs(az-d[1]); if(diff>180) diff=360-diff; if(diff<bd){bd=diff; best=d;} });
  return best[0];
}

function calculateRakeFromTP(dipDir, dip, trend, plunge){
  if(dip==null || trend==null || plunge==null || dip===0) return null;
  const sinR = Math.sin(toRad(plunge)) / Math.sin(toRad(dip));
  const rakeDeg = roundInt(toDeg(Math.asin(clamp(sinR, -1, 1))));
  const strike = norm360((dipDir||0) - 90);
  const strikeOpp = norm360(strike + 180);
  let diff1 = Math.abs(trend - strike); if(diff1>180) diff1 = 360-diff1;
  let diff2 = Math.abs(trend - strikeOpp); if(diff2>180) diff2 = 360-diff2;
  const refAz = diff1 <= diff2 ? strike : strikeOpp;
  const quad = dipDirQuadrant(refAz);
  return { rake: rakeDeg, quadrant: quad };
}

/* =========================================================
   UTM (WGS84)
   ========================================================= */
const UTM_A=6378137.0, UTM_ECC2=0.00669438, UTM_K0=0.9996;
function llToUTM(lat, lon){
  const latRad=toRad(lat), lonRad=toRad(lon);
  const zoneNumber = Math.floor((lon+180)/6)+1;
  const lonOrigin = (zoneNumber-1)*6-180+3;
  const lonOriginRad = toRad(lonOrigin);
  const eccPrime2 = UTM_ECC2/(1-UTM_ECC2);
  const N = UTM_A/Math.sqrt(1-UTM_ECC2*Math.sin(latRad)*Math.sin(latRad));
  const T = Math.tan(latRad)*Math.tan(latRad);
  const C = eccPrime2*Math.cos(latRad)*Math.cos(latRad);
  const A = Math.cos(latRad)*(lonRad-lonOriginRad);
  const M = UTM_A*((1-UTM_ECC2/4-3*UTM_ECC2*UTM_ECC2/64-5*Math.pow(UTM_ECC2,3)/256)*latRad
            - (3*UTM_ECC2/8+3*UTM_ECC2*UTM_ECC2/32+45*Math.pow(UTM_ECC2,3)/1024)*Math.sin(2*latRad)
            + (15*UTM_ECC2*UTM_ECC2/256+45*Math.pow(UTM_ECC2,3)/1024)*Math.sin(4*latRad)
            - (35*Math.pow(UTM_ECC2,3)/3072)*Math.sin(6*latRad));
  let easting = UTM_K0*N*(A+(1-T+C)*Math.pow(A,3)/6
              + (5-18*T+T*T+72*C-58*eccPrime2)*Math.pow(A,5)/120) + 500000.0;
  let northing = UTM_K0*(M+N*Math.tan(latRad)*(A*A/2+(5-T+9*C+4*C*C)*Math.pow(A,4)/24
              + (61-58*T+T*T+600*C-330*eccPrime2)*Math.pow(A,6)/720));
  const hemisphere = lat<0 ? 'S' : 'N';
  if(lat<0) northing += 10000000.0;
  return { zoneNumber, hemisphere, easting: Math.round(easting), northing: Math.round(northing) };
}
function utmToLL(easting, northing, zoneNumber, hemisphere){
  const e1=(1-Math.sqrt(1-UTM_ECC2))/(1+Math.sqrt(1-UTM_ECC2));
  const x=easting-500000.0;
  let y=northing;
  if(hemisphere==='S') y -= 10000000.0;
  const lonOrigin=(zoneNumber-1)*6-180+3;
  const eccPrime2=UTM_ECC2/(1-UTM_ECC2);
  const M=y/UTM_K0;
  const mu=M/(UTM_A*(1-UTM_ECC2/4-3*UTM_ECC2*UTM_ECC2/64-5*Math.pow(UTM_ECC2,3)/256));
  const phi1 = mu + (3*e1/2-27*Math.pow(e1,3)/32)*Math.sin(2*mu)
             + (21*e1*e1/16-55*Math.pow(e1,4)/32)*Math.sin(4*mu)
             + (151*Math.pow(e1,3)/96)*Math.sin(6*mu)
             + (1097*Math.pow(e1,4)/512)*Math.sin(8*mu);
  const N1=UTM_A/Math.sqrt(1-UTM_ECC2*Math.sin(phi1)*Math.sin(phi1));
  const T1=Math.tan(phi1)*Math.tan(phi1);
  const C1=eccPrime2*Math.cos(phi1)*Math.cos(phi1);
  const R1=UTM_A*(1-UTM_ECC2)/Math.pow(1-UTM_ECC2*Math.sin(phi1)*Math.sin(phi1),1.5);
  const D=x/(N1*UTM_K0);
  let lat = phi1 - (N1*Math.tan(phi1)/R1)*(D*D/2
          - (5+3*T1+10*C1-4*C1*C1-9*eccPrime2)*Math.pow(D,4)/24
          + (61+90*T1+298*C1+45*T1*T1-252*eccPrime2-3*C1*C1)*Math.pow(D,6)/720);
  let lon = (D-(1+2*T1+C1)*Math.pow(D,3)/6
          + (5-2*C1+28*T1-3*C1*C1+8*eccPrime2+24*T1*T1)*Math.pow(D,5)/120)/Math.cos(phi1);
  return { lat: Number(lat.toFixed(6)), lon: Number((lonOrigin+toDeg(lon)).toFixed(6)) };
}
function utmLabel(lat, lon){
  if(lat==null||lon==null||isNaN(lat)||isNaN(lon)) return null;
  const r=llToUTM(lat,lon);
  return { text: r.easting+' E, '+r.northing+' N ('+(currentLang==='es'?'Huso ':'Zone ')+r.zoneNumber+r.hemisphere+')', ...r };
}

/* =========================================================
   BASE DE DATOS
   ========================================================= */
const DB_NAME='geofieldcore_db', DB_VERSION=3;
let DB=null;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded=(e)=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('campaigns')) d.createObjectStore('campaigns',{keyPath:'id'});
      if(!d.objectStoreNames.contains('stations')) d.createObjectStore('stations',{keyPath:'id'});
      if(!d.objectStoreNames.contains('measurements')) d.createObjectStore('measurements',{keyPath:'id'});
    };
    req.onsuccess=(e)=>{ DB=e.target.result; resolve(DB); };
    req.onerror=(e)=>reject(e.target.error);
  });
}
function tx(store,mode){ return DB.transaction(store,mode).objectStore(store); }
function dbPut(store,obj){ return new Promise((res,rej)=>{ const r=tx(store,'readwrite').put(obj); r.onsuccess=()=>res(obj); r.onerror=()=>rej(r.error); }); }
function dbGet(store,id){ return new Promise((res,rej)=>{ const r=tx(store,'readonly').get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbGetAll(store){ return new Promise((res,rej)=>{ const r=tx(store,'readonly').getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); }); }
function dbDelete(store,id){ return new Promise((res,rej)=>{ const r=tx(store,'readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }

async function dbGetByStation(stationId){
  const all = await dbGetAll('measurements');
  return all.filter(m => m.stationId === stationId);
}
async function dbGetByCampaign(campId){
  const all = await dbGetAll('stations');
  return all.filter(s => s.campaignId === campId);
}
async function dbDeleteStationCascade(stationId){
  const meas = await dbGetByStation(stationId);
  for(const m of meas) await dbDelete('measurements', m.id);
  await dbDelete('stations', stationId);
}
async function dbDeleteCampaignCascade(campId){
  const sts = await dbGetByCampaign(campId);
  for(const s of sts) await dbDeleteStationCascade(s.id);
  await dbDelete('campaigns', campId);
}

let dialRAF=false;
const IS_SECURE = window.isSecureContext === true;

function requestSensorPermission(){
  if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(resp=>{
      sensorState.granted = (resp==='granted');
      if(sensorState.granted){ sensorState.status='pending'; attachOrientationListener(); }
      render();
    }).catch(()=>{ sensorState.granted=false; render(); });
  } else {
    sensorState.status='pending';
    attachOrientationListener();
    toast('Sensores activados');
  }
}
let orientationHandlerAttached=false;
function attachOrientationListener(){
  if(orientationHandlerAttached) return;
  orientationHandlerAttached=true;
  const handler=(e)=>{
    if(e.alpha==null && e.beta==null && e.gamma==null) return;
    let alphaDeg;
    if(typeof e.webkitCompassHeading==='number'){
      alphaDeg = norm360(360 - e.webkitCompassHeading);
    } else {
      alphaDeg = e.alpha||0;
    }
    sensorState.available=true;
    sensorState.status='active';
    sensorState.last = computeOrientation(alphaDeg, e.beta||0, e.gamma||0);
    if(!dialRAF){
      dialRAF=true;
      requestAnimationFrame(()=>{ dialRAF=false; updateLiveDial(); updateTopbarStatus(); });
    }
  };
  window.addEventListener('deviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation', handler);
}
function initSensors(){
  if(!IS_SECURE || typeof DeviceOrientationEvent==='undefined') return;
  if(typeof DeviceOrientationEvent.requestPermission!=='function'){ sensorState.status='pending'; attachOrientationListener(); }
}
function updateTopbarStatus(){
  const gDot=document.getElementById('gpsDot');
  if(gDot) gDot.className='status-dot'+(gpsState.status==='fix'?' ok':gpsState.status==='searching'?' warn':' err');
  const sDot=document.getElementById('sensorDot');
  if(sDot) sDot.className='status-dot'+(sensorState.status==='active'?' ok':(sensorState.status==='pending')?' warn':' err');
}
function initGPS(){
  if(!IS_SECURE || !navigator.geolocation) return;
  gpsState.status='searching';
  navigator.geolocation.watchPosition(pos=>{
    gpsState.status='fix';
    gpsState.lat=pos.coords.latitude;
    gpsState.lon=pos.coords.longitude;
    gpsState.alt=pos.coords.altitude ? Math.round(pos.coords.altitude) : null;
    gpsState.accuracy=pos.coords.accuracy ? Math.round(pos.coords.accuracy) : null;
    updateTopbarStatus();
  }, ()=>{ gpsState.status='unavailable'; updateTopbarStatus(); }, { enableHighAccuracy:true, maximumAge:4000, timeout:20000 });
}

function drawDial(svg, mode){
  const r=sensorState.last;
  let heading = 0;
  if(r){
    if(mode==='planar'){
      heading = (needleMode==='strike') ? r.strike : r.dipDir;
    } else {
      heading = r.trend;
    }
  }
  const mag = r ? (mode==='planar'? r.dip : r.plunge) : 0;
  let ticks='';
  for(let i=0;i<36;i++){
    const ang=i*10, len = (i%3===0)?12:6;
    const rad=toRad(ang);
    const x1=70+58*Math.sin(rad), y1=70-58*Math.cos(rad);
    const x2=70+(58-len)*Math.sin(rad), y2=70-(58-len)*Math.cos(rad);
    ticks+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--border)" stroke-width="${i%9===0?2:1}"/>`;
  }
  const needleRad=toRad(heading);
  const nx=70+46*Math.sin(needleRad), ny=70-46*Math.cos(needleRad);
  const barW = clamp(mag/90,0,1)*100;
  svg.innerHTML = `
    <circle cx="70" cy="70" r="62" fill="var(--surface-2)" stroke="var(--border)" stroke-width="1.5"/>
    ${ticks}
    <text x="70" y="16" text-anchor="middle" fill="var(--text-dim)" font-size="9">N</text>
    <text x="124" y="74" text-anchor="middle" fill="var(--text-dim)" font-size="9">E</text>
    <text x="70" y="130" text-anchor="middle" fill="var(--text-dim)" font-size="9">S</text>
    <text x="16" y="74" text-anchor="middle" fill="var(--text-dim)" font-size="9">${currentLang==='es'?'O':'W'}</text>
    <line x1="70" y1="70" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="70" cy="70" r="4" fill="var(--accent)"/>
    <rect x="20" y="118" width="100" height="6" rx="3" fill="var(--surface)" stroke="var(--border)" />
    <rect x="20" y="118" width="${barW}" height="6" rx="3" fill="var(--accent)" />
  `;
}

function captureSensorReading(formKey, mode){
  if(!sensorState.last){ toast(currentLang==='es'?'Sin datos de sensor':'No sensor data yet'); return; }
  const r=sensorState.last;
  if(mode==='planar'){
    setVal('dipDir_'+formKey, roundInt(r.dipDir));
    setVal('dip_'+formKey, roundInt(r.dip));
    onOrientationInputChange(formKey);
  } else {
    setVal('trend_'+formKey, roundInt(r.trend));
    setVal('plunge_'+formKey, roundInt(r.plunge));
  }
  if(formKey==='fl' || formKey==='fp') autoCalcRakeIfReady();
  toast(currentLang==='es'?'Lectura capturada':'Reading captured');
}
function setVal(id,v){ const el=document.getElementById(id); if(el) el.value=v; }
function onOrientationInputChange(formKey){
  const dipDir=parseInt(document.getElementById('dipDir_'+formKey)?.value, 10);
  const dip=parseInt(document.getElementById('dip_'+formKey)?.value, 10);
  const out=document.getElementById('derived_'+formKey);
  if(!out) return;
  if(isNaN(dipDir)||isNaN(dip)){ out.textContent='Strike RHR: — · '+t('quadrant')+': —'; return; }
  const strike=roundInt(norm360(dipDir-90));
  out.innerHTML = `${t('strikeRHR')}: <b style="color:var(--accent)">${strike}°</b> &nbsp;·&nbsp; ${t('quadrant')}: <b style="color:var(--accent)">${toQuadrant(strike)}</b> &nbsp;·&nbsp; ${t('dipTowards')}: <b style="color:var(--accent)">${dipDirQuadrant(dipDir)}</b>`;
}

  editCampaign(id){ state.view='campForm'; state.campId=id; render(); },
  campaign(id){ state.view='campaignDetail'; state.campId=id; state.stationId=null; render(); },
  newStation(campId){ state.view='stationForm'; state.campId=campId; state.stationId=null; render(); },
  editStation(id, campId){ state.view='stationForm'; state.campId=campId; state.stationId=id; render(); },
  station(id, campId){ state.view='stationDetail'; state.stationId=id; if(campId) state.campId=campId; render(); },
  newMeasurement(stationId, type){ state.view='measForm'; state.stationId=stationId; state.measType=type; state.measId=null; render(); },
  editMeasurement(id, stationId, type){ state.view='measForm'; state.stationId=stationId; state.measType=type; state.measId=id; render(); },

    else if(state.view==='stereonet' && state.campId) Nav.campaign(state.campId);

  ['navHome','navStereo','navExport','navSettings'].forEach(id=>document.getElementById(id)?.classList.remove('active'));
  if(['campaigns','campForm','campaignDetail','stationForm','stationDetail','measForm'].includes(state.view)) document.getElementById('navHome')?.classList.add('active');

  if(state.view==='settings') document.getElementById('navSettings')?.classList.add('active');

  document.getElementById('navStereoTxt').textContent = t('stereonet');
  document.getElementById('navExportTxt').textContent = t('export');
  document.getElementById('navSettingsTxt').textContent = t('settings');
}

  if(state.view==='campaigns') app.innerHTML = await renderCampaigns();
  else if(state.view==='campForm') app.innerHTML = await renderCampaignForm();
  else if(state.view==='campaignDetail') app.innerHTML = await renderCampaignDetail();

}

   MOTOR GRÁFICO DEL ESTEREOGRAMA (CANVAS NATIVO RETINA)
   ========================================================= */
let canvasCachedData = [];
async function initStereonetCanvas(){
  const canvas = document.getElementById('stereoCanvas');
  if(!canvas) return;
  
  // Adaptar dimensiones para pantallas táctiles y alta densidad de píxeles
  const size = Math.min(window.innerWidth - 32, 440);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  
  // Eventos táctiles y ratón para inspección interactiva
  canvas.onpointerdown = handleCanvasTouch;
  
  await drawStereonet();
}

async function drawStereonet(){
  const canvas = document.getElementById('stereoCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.width / dpr;
  const R = (size / 2) - 22;
  const cx = size / 2;
  const cy = size / 2;

  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, size, size);

  // 1. Dibujar Fondo de la falsilla
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = '#171c21';
  ctx.fill();

  // 2. Filtrar datos desde IndexedDB
  const allSts = await dbGetAll('stations');
  const allMeas = await dbGetAll('measurements');
  
  let validStations = allSts;
  if(stereoState.campId !== 'ALL'){
    validStations = validStations.filter(s => s.campaignId === stereoState.campId);
  }
  if(stereoState.stationId !== 'ALL'){
    validStations = validStations.filter(s => s.id === stereoState.stationId);
  }
  const stIds = new Set(validStations.map(s => s.id));
  const meas = allMeas.filter(m => stIds.has(m.stationId));

  stereoState.interactiveItems = [];
  const polesForMean = [];
  const faultRecords = [];

  // 3. Renderizar Mecanismos Focales Beachball (si está activo)
  if(stereoState.showBeachball){
    meas.filter(m => m.type === 'fault' && (m.strike != null || m.dipDir != null)).forEach(f => {
      const kin = computeFaultKinematics(f);
      drawBeachballQuadrants(ctx, cx, cy, R, stereoState.proj, kin);
    });
  }

  // 4. Dibujar Red Estereográfica (Primitiva, Ejes y Marcas cada 10° y 2°)
  drawStereoGrid(ctx, cx, cy, R);

  // 5. Dibujar Planos, Polos y Lineaciones
  meas.forEach(m => {
    let strike = m.strike;
    if(strike == null && m.dipDir != null) strike = norm360(m.dipDir - 90);
    const dip = m.dip;

    // A. Planos Geológicos
    if(m.type !== 'fault' && strike != null && dip != null){
      const poleVec = planeToPoleVector(strike, dip);
      polesForMean.push(poleVec);
      const polePt = project3D(poleVec, stereoState.proj, R);
      const px = cx + polePt.x;
      const py = cy + polePt.y;

      let color = '#5fb583'; // Estratificación verde
      if((m.subtype||'').includes('Foliación')) color = '#e8a33d';
      if(m.type === 'vein') color = '#5cb3ff';
      if(m.type === 'contact') color = '#d38aea';

      // Dibujar Ciclográfica
      if(stereoState.showPlanes){
        drawGreatCircle(ctx, cx, cy, R, stereoState.proj, strike, dip, color, 1.4, false);
      }

      // Dibujar Polo
      if(stereoState.showPoles){
        ctx.beginPath();
        ctx.arc(px, py, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#14181c';
        ctx.lineWidth = 1;
        ctx.stroke();

        stereoState.interactiveItems.push({
          x: px, y: py, radius: 12, data: m, label: `${m.subtype||m.type}: ${pad3(strike)}/${pad2(dip)}`
        });
      }
    }

    // B. Lineaciones puras
    if(m.trend != null && m.plunge != null && m.type !== 'fault'){
      const linVec = trendPlungeToVector(m.trend, m.plunge);
      const pt = project3D(linVec, stereoState.proj, R);
      const lx = cx + pt.x, ly = cy + pt.y;
      
      ctx.fillStyle = '#ff6b6b';
      ctx.fillRect(lx - 4, ly - 4, 8, 8);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.strokeRect(lx - 4, ly - 4, 8, 8);

      stereoState.interactiveItems.push({
        x: lx, y: ly, radius: 12, data: m, label: `Lineación: ${pad3(m.trend)}/${pad2(m.plunge)}`
      });
    }

    // C. Fallas con Cinemática (FaultKin)
    if(m.type === 'fault' && (strike != null || m.dipDir != null)){
      faultRecords.push(m);
      const kin = computeFaultKinematics(m);

      if(stereoState.showFaults){
        // Plano principal de falla
        drawGreatCircle(ctx, cx, cy, R, stereoState.proj, strike, dip, '#e0645c', 2, false);
        
        // Plano auxiliar nodal
        drawGreatCircle(ctx, cx, cy, R, stereoState.proj, kin.auxStrike, kin.auxDip, 'rgba(224,100,92,0.4)', 1, true);

        // Vector estría / deslizamiento
        const stPt = project3D(kin.u, stereoState.proj, R);
        const sx = cx + stPt.x, sy = cy + stPt.y;
        
        ctx.beginPath();
        ctx.arc(sx, sy, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#e0645c';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Flecha de movimiento sobre el plano
        drawKinematicArrow(ctx, cx, cy, R, stereoState.proj, strike, dip, kin);

        stereoState.interactiveItems.push({
          x: sx, y: sy, radius: 14, data: m,
          label: `Falla ${m.sense||''}: ${pad3(strike)}/${pad2(dip)} | Rake: ${m.rake??'—'}°`
        });
      }

      if(stereoState.showPT){
        // Eje P (Compresión / Acortamiento) - Rojo/Negro
        const pPt = project3D(kin.P, stereoState.proj, R);
        const pX = cx + pPt.x, pY = cy + pPt.y;
        ctx.beginPath();
        ctx.arc(pX, pY, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#e0645c';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Eje T (Extensión / Tensión) - Azul/Blanco
        const tPt = project3D(kin.T, stereoState.proj, R);
        const tX = cx + tPt.x, tY = cy + tPt.y;
        ctx.beginPath();
        ctx.rect(tX - 4.5, tY - 4.5, 9, 9);
        ctx.fillStyle = '#5cb3ff';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        stereoState.interactiveItems.push({
          x: pX, y: pY, radius: 10, data: m, label: `Eje P: ${pad3(kin.P_tp.trend)}/${pad2(kin.P_tp.plunge)}`
        });
        stereoState.interactiveItems.push({
          x: tX, y: tY, radius: 10, data: m, label: `Eje T: ${pad3(kin.T_tp.trend)}/${pad2(kin.T_tp.plunge)}`
        });
      }
    }
  });

  // 6. Estadísticas y Polo Medio
  const mean = calculateMeanOrientation(polesForMean);
  if(mean && stereoState.showPlanes){
    // Dibujar plano medio en blanco punteado
    drawGreatCircle(ctx, cx, cy, R, stereoState.proj, mean.strike, mean.dip, '#ffffff', 2.2, true);
    const mPt = project3D(mean.meanVec, stereoState.proj, R);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(cx + mPt.x, cy + mPt.y, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  updateStereoStats(mean, faultRecords, meas.length);
  ctx.restore();
}

// Dibujar Red Básica y Marcas
function drawStereoGrid(ctx, cx, cy, R){
  ctx.save();
  ctx.strokeStyle = '#333c44';
  ctx.lineWidth = 1;

  // Círculo Primitivo
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.stroke();

  // Ejes N-S y E-W
  ctx.beginPath();
  ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R);
  ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy);
  ctx.stroke();

  // Marcas perimetrales (10° mayores, 2° menores)
  for(let deg = 0; deg < 360; deg += 2){
    const rad = toRad(deg);
    const isMajor = (deg % 10 === 0);
    const isCardinal = (deg % 90 === 0);
    const len = isCardinal ? 9 : (isMajor ? 6 : 3);

    const x1 = cx + R * Math.sin(rad);
    const y1 = cy - R * Math.cos(rad);
    const x2 = cx + (R - len) * Math.sin(rad);
    const y2 = cy - (R - len) * Math.cos(rad);

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = isMajor ? '#8a97a3' : '#333c44';
    ctx.lineWidth = isMajor ? 1.2 : 0.8;
    ctx.stroke();
  }

  // Letras cardinales
  ctx.fillStyle = '#e8a33d';
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('N', cx, cy - R + 14);
  ctx.fillText('S', cx, cy + R - 14);
  ctx.fillText('E', cx + R - 14, cy);
  ctx.fillText(currentLang === 'es' ? 'O' : 'W', cx - R + 14, cy);

  // Centro
  ctx.beginPath();
  ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
  ctx.fillStyle = '#8a97a3';
  ctx.fill();

  ctx.restore();
}

// Trazado continuo del Círculo Mayor (Ciclográfica)
function drawGreatCircle(ctx, cx, cy, R, projType, strike, dip, color, lineWidth, dashed){
  ctx.save();
  ctx.beginPath();
  if(dashed) ctx.setLineDash([4, 4]);
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;

  const sR = toRad(strike);
  const dR = toRad(dip);
  const strikeVec = [Math.sin(sR), Math.cos(sR), 0];
  const dipVec = [Math.cos(sR) * Math.sin(dR), -Math.sin(sR) * Math.sin(dR), Math.cos(dR)];

  let first = true;
  for(let alpha = 0; alpha <= 180; alpha += 2){
    const aR = toRad(alpha);
    const v = V3.add(
      V3.scale(strikeVec, Math.cos(aR)),
      V3.scale(dipVec, Math.sin(aR))
    );
    const pt = project3D(v, projType, R);
    const x = cx + pt.x;
    const y = cy + pt.y;

    if(first){
      ctx.moveTo(x, y);
      first = false;
    } else {
      ctx.lineTo(x, y);
    }
  }
  ctx.stroke();
  ctx.restore();
}

// Flecha cinemática de sentido de movimiento sobre el plano
function drawKinematicArrow(ctx, cx, cy, R, projType, strike, dip, kin){
  const pt = project3D(kin.u, projType, R);
  const px = cx + pt.x, py = cy + pt.y;
  
  // Vector tangente sobre el plano en la estría
  const moveDir = V3.norm(V3.cross(kin.n, kin.b));
  const arrowHead = V3.add(kin.u, V3.scale(moveDir, 0.12));
  const ptH = project3D(arrowHead, projType, R);
  
  const dx = (cx + ptH.x) - px;
  const dy = (cy + ptH.y) - py;
  const ang = Math.atan2(dy, dx);

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(ang);
  ctx.fillStyle = '#e8a33d';
  ctx.beginPath();
  ctx.moveTo(6, 0);
  ctx.lineTo(-6, -4);
  ctx.lineTo(-6, 4);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// Cuadrantes de compresión / tensión (Beachball)
function drawBeachballQuadrants(ctx, cx, cy, R, projType, kin){
  ctx.save();
  const step = 6;
  for(let y = -R; y <= R; y += step){
    for(let x = -R; x <= R; x += step){
      if(Math.hypot(x, y) <= R){
        const v = unproject2D(x, y, projType, R);
        if(v){
          // Criterio de mecanismo focal: signo del producto (n · v) * (u · v)
          const f1 = V3.dot(kin.n, v);
          const f2 = V3.dot(kin.u, v);
          if(f1 * f2 > 0){
            ctx.fillStyle = 'rgba(224, 100, 92, 0.18)'; // Cuadrante de compresión
            ctx.fillRect(cx + x - step/2, cy + y - step/2, step, step);
          }
        }
      }
    }
  }
  ctx.restore();
}

// Inspección Táctil / Clic sobre Canvas
function handleCanvasTouch(e){
  const canvas = document.getElementById('stereoCanvas');
  const tooltip = document.getElementById('stereoTooltip');
  if(!canvas || !tooltip) return;

  const rect = canvas.getBoundingClientRect();
  const clientX = e.clientX || (e.touches && e.touches[0].clientX);
  const clientY = e.clientY || (e.touches && e.touches[0].clientY);
  const touchX = clientX - rect.left;
  const touchY = clientY - rect.top;

  let found = null;
  for(const item of stereoState.interactiveItems){
    const dist = Math.hypot(touchX - item.x, touchY - item.y);
    if(dist <= item.radius){
      found = item;
      break;
    }
  }

  if(found){
    tooltip.style.display = 'block';
    tooltip.style.left = Math.min(touchX + 12, rect.width - 200) + 'px';
    tooltip.style.top = Math.max(touchY - 40, 10) + 'px';
    tooltip.innerHTML = `<b>${esc(found.label)}</b><br><span style="color:var(--text-dim);font-size:10.5px;">ID: ${esc(found.data.id)}</span>`;
  } else {
    tooltip.style.display = 'none';
  }
}

function updateStereoStats(mean, faults, totalMeas){
  const el = document.getElementById('stereoStats');
  if(!el) return;
  let html = `Total de datos proyectados: <b>${totalMeas}</b><br>`;
  if(mean){
    html += `Polo medio (N=${mean.count}): <b>Trend/Plunge ${pad3(mean.trend)}/${pad2(mean.plunge)}</b><br>`;
    html += `Plano medio equivalente: <b>${pad3(mean.strike)}/${pad2(mean.dip)} (RHR)</b> · DipDir <b>${pad3(mean.dipDir)}</b><br>`;
  } else {
    html += `Polo medio: <i>Insuficientes planos</i><br>`;
  }
  if(faults.length > 0){
    html += `Fallas cinemáticas activas: <b>${faults.length}</b> (FaultKin P/T calculado)`;
  }
  el.innerHTML = html;
}

function utmFromLatLon(){
  const lat=parseFloat(document.getElementById('f_lat')?.value);
  const lon=parseFloat(document.getElementById('f_lon')?.value);
  if(isNaN(lat)||isNaN(lon)) return;
  const r=llToUTM(lat,lon);
  setVal('f_utmZone', r.zoneNumber);
  const hemiEl=document.getElementById('f_utmHemi'); if(hemiEl) hemiEl.value=r.hemisphere;
  setVal('f_utmEast', r.easting);
  setVal('f_utmNorth', r.northing);
}
function latLonFromUtm(){
  const zone=parseInt(document.getElementById('f_utmZone')?.value,10);
  const hemi=document.getElementById('f_utmHemi')?.value||'S';
  const east=parseInt(document.getElementById('f_utmEast')?.value, 10);
  const north=parseInt(document.getElementById('f_utmNorth')?.value, 10);
  if(isNaN(zone)||isNaN(east)||isNaN(north)){ toast('Completa UTM'); return; }
  const r=utmToLL(east, north, zone, hemi);
  setVal('f_lat', r.lat);
  setVal('f_lon', r.lon);
}
function captureGpsIntoStation(){
  if(gpsState.lat==null){ toast('Sin señal GPS'); return; }

  if(gpsState.alt!=null) setVal('f_alt', Math.round(gpsState.alt));

}

function autoCalcRakeIfReady(){
  const dipDir = parseInt(document.getElementById('dipDir_fp')?.value, 10);
  const dip = parseInt(document.getElementById('dip_fp')?.value, 10);
  const trend = parseInt(document.getElementById('trend_fl')?.value, 10);
  const plunge = parseInt(document.getElementById('plunge_fl')?.value, 10);
  const out = document.getElementById('rakeCalculatedOut');
  if(isNaN(dip)||isNaN(trend)||isNaN(plunge)){ if(out) out.textContent='Rake calculado: —'; return; }
  const res = calculateRakeFromTP(dipDir||0, dip, trend, plunge);
  if(res && out){
    out.innerHTML = `Rake geométrico: <b style="color:var(--accent)">${res.rake}°</b> (desde el extremo <b style="color:var(--accent)">${res.quadrant}</b>)`;
    setVal('f_rake', res.rake);
    const qEl=document.getElementById('f_rakeQuad'); if(qEl) qEl.value=res.quadrant;
  }
}

function calcThickness(){
  const ta=parseFloat(document.getElementById('f_appThickness').value);
  const dip=parseFloat(document.getElementById('f_bedDip').value);
  const slope=parseFloat(document.getElementById('f_slope').value)||0;
  const sense=document.getElementById('f_slopeSense').value;
  const out=document.getElementById('thicknessOut');
  if(isNaN(ta)||isNaN(dip)){ out.textContent=t('trueThick')+': — m'; return null; }
  let angle = sense==='flat'? dip : sense==='same'? (dip-slope) : (dip+slope);
  const val = roundInt(Math.abs(ta*Math.sin(toRad(angle))));
  out.textContent = t('trueThick')+' ≈ '+val+' m';
  return val;
}

async function saveMeasurement(id, isNew){
  const type=state.measType;
  const obj={ id, stationId:state.stationId, type, timestamp: nowIso(), notes: document.getElementById('f_notes').value };

  if(type==='planar'){
    obj.subtype=document.getElementById('f_subtype').value;
    if(LINEAR_SUBTYPES.includes(obj.subtype)){
      obj.trend=intOrNull('trend_l1'); obj.plunge=intOrNull('plunge_l1');
    } else {
      obj.dipDir=intOrNull('dipDir_p1'); obj.dip=intOrNull('dip_p1');
      obj.strike = obj.dipDir!=null? roundInt(norm360(obj.dipDir-90)) : null;
    }
  } else if(type==='fault'){
    obj.dipDir=intOrNull('dipDir_fp'); obj.dip=intOrNull('dip_fp');
    obj.strike = obj.dipDir!=null? roundInt(norm360(obj.dipDir-90)) : null;
    obj.striaeMode=document.querySelector('input[name=striaeMode]:checked')?.value || 'rake';
    if(obj.striaeMode==='trendplunge'){
      obj.trend=intOrNull('trend_fl'); obj.plunge=intOrNull('plunge_fl');
    }
    obj.rake=intOrNull('f_rake');
    obj.rakeQuadrant=document.getElementById('f_rakeQuad')?.value || null;
    obj.sense=document.getElementById('f_sense').value;
    obj.senseQuality=document.getElementById('f_senseQuality').value;
    obj.criteria=[...document.querySelectorAll('.crit-chk:checked')].map(c=>c.value);
  } else if(type==='contact'){
    obj.contactType=document.getElementById('f_contactType').value;
    obj.dipDir=intOrNull('dipDir_c1'); obj.dip=intOrNull('dip_c1');
    obj.strike = obj.dipDir!=null? roundInt(norm360(obj.dipDir-90)) : null;
    obj.lithoTop=document.getElementById('f_lithoTop').value;
    obj.lithoBottom=document.getElementById('f_lithoBottom').value;
    obj.appThickness=intOrNull('f_appThickness');
    obj.bedDip=intOrNull('f_bedDip');
    obj.slope=intOrNull('f_slope');
    obj.slopeSense=document.getElementById('f_slopeSense').value;
    obj.trueThickness=calcThickness();
  } else if(type==='vein'){
    obj.structKind=document.querySelector('input[name=structKind]:checked')?.value || 'Veta';
    obj.dipDir=intOrNull('dipDir_v1'); obj.dip=intOrNull('dip_v1');
    obj.strike = obj.dipDir!=null? roundInt(norm360(obj.dipDir-90)) : null;
    obj.veinThickness=intOrNull('f_veinThick');
    obj.veinUnit=document.getElementById('f_veinUnit').value;
    obj.veinDensity=intOrNull('f_veinDensity');
    obj.mineralogy=[...document.querySelectorAll('.min-chk:checked')].map(c=>c.value);
    obj.mineralOther=document.getElementById('f_mineralOther').value;
    obj.texture=document.getElementById('f_texture').value;
    obj.alteration=[...document.querySelectorAll('.alt-chk:checked')].map(c=>c.value);
    obj.intensity=document.getElementById('f_intensity').value;
  }
  await dbPut('measurements', obj);
  toast(currentLang==='es'?'Guardado':'Saved');
  Nav.station(state.stationId, state.campId);
}
function intOrNull(id){ const v=parseInt(document.getElementById(id)?.value, 10); return isNaN(v)?null:v; }

function csvEsc(v){ v=String(v??''); if(/[",\n]/.test(v)){ v='"'+v.replace(/"/g,'""')+'"'; } return v; }

async function getFilteredData(){
  const scope = document.getElementById('exportCampSelect')?.value || 'ALL';
  let stations = await dbGetAll('stations');
  let camps = await dbGetAll('campaigns');
  const campMap={}; camps.forEach(c=>campMap[c.id]=c);

  if(scope !== 'ALL'){
    stations = stations.filter(s=>s.campaignId === scope);
  }
  const stMap={}; stations.forEach(s=>stMap[s.id]=s);
  const allMeas = await dbGetAll('measurements');
  const measurements = allMeas.filter(m=>stMap[m.stationId]);
  return { stations, measurements, stMap, campMap };
}

async function exportCSV(){
  const { measurements, stMap, campMap } = await getFilteredData();
  const headers=['Campaign','Station_ID','Timestamp','Lat','Lon','Alt','UTM_Zone','UTM_Hemisphere','UTM_Easting','UTM_Northing','Struct_Type','Kind','Strike','Dip','DipDir','Trend','Plunge','Rake','Rake_Quad','Sense','True_Thickness','Vein_Thick','Vein_Unit','Alteration','Notes'];
  const rows=[headers.join(',')];
  measurements.forEach(m=>{
    const st=stMap[m.stationId]||{};
    const camp=campMap[st.campaignId]||{};
    const u = utmLabel(st.lat, st.lon);
    rows.push([
      csvEsc(camp.name||''), csvEsc(st.name||st.id||''), csvEsc(m.timestamp||st.timestamp||''),
      st.lat??'', st.lon??'', st.alt??'',
      u? u.zoneNumber:'', u? u.hemisphere:'', u? u.easting:'', u? u.northing:'',
      csvEsc(m.subtype||m.type), csvEsc(m.structKind||''),
      m.strike!=null?roundInt(m.strike):'', m.dip!=null?roundInt(m.dip):'', m.dipDir!=null?roundInt(m.dipDir):'',
      m.trend!=null?roundInt(m.trend):'', m.plunge!=null?roundInt(m.plunge):'', m.rake!=null?roundInt(m.rake):'', csvEsc(m.rakeQuadrant||''),
      csvEsc(m.sense||''), m.trueThickness!=null?roundInt(m.trueThickness):'', m.veinThickness!=null?roundInt(m.veinThickness):'', csvEsc(m.veinUnit||''),
      csvEsc((m.alteration||[]).join('; ')), csvEsc(m.notes||'')
    ].join(','));
  });
  downloadFile('\uFEFF'+rows.join('\r\n'), 'GeoFieldCore_'+dateStamp()+'.csv', 'text/csv;charset=utf-8');
  toast('CSV exportado');
}

async function exportGeoJSON(){
  const { measurements, stMap, campMap } = await getFilteredData();
  const features=measurements.filter(m=>{ const s=stMap[m.stationId]; return s && s.lat!=null && s.lon!=null; }).map(m=>{
    const st=stMap[m.stationId];
    const camp=campMap[st.campaignId]||{};
    const u = utmLabel(st.lat, st.lon);
    return {
      type:'Feature',
      geometry:{ type:'Point', coordinates:[Number(st.lon), Number(st.lat), st.alt!=null?Number(st.alt):0] },
      properties:{
        Campaign: camp.name||null, Station_ID: st.name||st.id, Timestamp: m.timestamp||st.timestamp,
        UTM_Zone: u? u.zoneNumber:null, UTM_Hemisphere: u? u.hemisphere:null,
        UTM_Easting: u? u.easting:null, UTM_Northing: u? u.northing:null,
        Struct_Type: m.subtype||m.type, Kind: m.structKind||null,
        Strike: m.strike!=null?roundInt(m.strike):null, Dip: m.dip!=null?roundInt(m.dip):null, DipDir: m.dipDir!=null?roundInt(m.dipDir):null,
        Trend: m.trend!=null?roundInt(m.trend):null, Plunge: m.plunge!=null?roundInt(m.plunge):null, Rake: m.rake!=null?roundInt(m.rake):null, Rake_Quad: m.rakeQuadrant||null,
        Sense: m.sense||null, True_Thickness: m.trueThickness!=null?roundInt(m.trueThickness):null,
        Vein_Thick: m.veinThickness!=null?roundInt(m.veinThickness):null, Vein_Unit: m.veinUnit||null,
        Alteration: (m.alteration||[]).join('; ')||null, Notes: m.notes||null
      }
    };
  });
  downloadFile(JSON.stringify({ type:'FeatureCollection', features },null,2), 'GeoFieldCore_'+dateStamp()+'.geojson', 'application/geo+json');
  toast('GeoJSON exportado');
}

      <b>2. Sentido del Rake (Pitch):</b>
      <ul>
        <li>El <b>Rake</b> es el ángulo (0° a 90°) que forma la estría medido sobre el plano de falla.</li>
        <li>Se referencia indicando desde qué extremo del rumbo se mide el ángulo (ej. <i>35° desde el N</i> o <i>40° desde el SO</i>).</li>
        <li>Si capturas el plano de falla y luego mides la estría con el sensor en <i>Trend/Plunge</i>, la app calcula automáticamente el Rake y su cuadrante.</li>
      </ul>
    </div>
  </div>

  <div class="card" style="cursor:default;">
    <div class="card-title">Sensores / Permisos</div>
    <button class="btn primary" style="margin-top:8px;" onclick="requestSensorPermission()">📡 Activar / Re-calibrar Sensores</button>
  </div>
  `;
}

function autoEstimateDeclination(){
  if(gpsState.lat==null || gpsState.lon==null){ toast('Requiere señal GPS'); return; }
  const est = estimateDeclination(gpsState.lat, gpsState.lon);
  changeMagOffset(est);
  const input = document.getElementById('magOffsetInput');
  if(input) input.value = est;
  toast(`Declinación estimada: ${est}° aplicada`);
}

function changeLanguage(lang){ currentLang=lang; localStorage.setItem('geo_lang', lang); render(); }
function changeCompassScale(scale){ compassScale=scale; localStorage.setItem('geo_compass_scale', scale); render(); }
function changeBoxScale(scale){ boxScale=scale; localStorage.setItem('geo_box_scale', scale); render(); }
function changeQuadrantPref(val){ quadrantPref=val; localStorage.setItem('geo_quadrant_pref', val); render(); }
function changeNeedleMode(val){ needleMode=val; localStorage.setItem('geo_needle_mode', val); render(); }
function changeMagOffset(val){ magOffset=parseFloat(val)||0; localStorage.setItem('geo_mag_offset', magOffset); render(); }

(async function init(){
  await openDB();
  initGPS();
  initSensors();
  updateTopbarStatus();
  setInterval(updateTopbarStatus, 3000);
  render();
})();
</script>
</body>
</html>
